# Manyselves configuration
# Copy this file to manyselves.config.yaml and fill in your API keys.
#
#   cp manyselves.config.example.yaml manyselves.config.yaml
#
# API keys can also be set via environment variables:
#   ANTHROPIC_API_KEY, OPENAI_API_KEY, DEEPSEEK_API_KEY, etc.
#
# On first launch, a GUI dialog will help you configure providers.

agents:
  defaults:
    model: claude-haiku-5-5
    provider: anthropic
    context_compaction_strategy: model_summary
    context_compaction_model: claude-haiku-5-5
    temperature: 0.1
    max_tool_iterations: 200
    timezone: Asia/Shanghai
    prompt_templates_dir: templates/agents

mineru_api:
  enabled: true
  timeout: 300
  validate_on_startup: true

providers:
  active: anthropic-official
  configurations:
    - id: anthropic-official
      name: Claude Official API
      provider: anthropic
      api_key: null  # Fill in here, or set ANTHROPIC_API_KEY
      api_base: https://api.anthropic.com
      default_model: claude-haiku-5-5
      # Fill in the limits the model's documentation declares, in tokens:
      # context_window: <tokens>
      # max_output_tokens: <tokens>
      enabled: true
  # Example:
  # - name: Anthropic
  #   provider: anthropic
  #   api_key: null          # Set via ANTHROPIC_API_KEY env var, or fill in directly
  #   api_base: null
  #   default_model: claude-sonnet-4-20250514
  #   enabled: true
  #
  # - name: DeepSeek
  #   provider: deepseek
  #   api_key: null          # Set via DEEPSEEK_API_KEY env var
  #   api_base: https://api.deepseek.com
  #   default_model: deepseek-chat
  #   enabled: true
