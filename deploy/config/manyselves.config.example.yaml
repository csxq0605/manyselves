# ManySelves 生产环境配置
# 包含所有主流 AI 服务商的预配置
# 复制此文件到 /data/manyselves/manyselves.config.yaml

providers:
  # 当前激活的提供商（默认 MiMo AI）
  active: mimo-openai

  configurations:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 国内主流服务商
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  # MiMo AI（小米）- 默认
  - apiKey: null
    apiBase: https://token-plan-cn.xiaomimimo.com/v1
    defaultModel: mimo-v2.5-pro
    enabled: true
    id: mimo-openai
    name: MiMo AI
    provider: openai

  # DeepSeek（深度求索）
  - apiKey: null
    apiBase: https://api.deepseek.com
    defaultModel: deepseek-chat
    enabled: false
    id: deepseek
    name: DeepSeek
    provider: openai

  # Kimi（月之暗面）
  - apiKey: null
    apiBase: https://api.moonshot.cn/v1
    defaultModel: moonshot-v1-8k
    enabled: false
    id: kimi
    name: Kimi
    provider: openai

  # 通义千问（阿里云）
  - apiKey: null
    apiBase: https://dashscope.aliyuncs.com/compatible-mode/v1
    defaultModel: qwen-turbo
    enabled: false
    id: qwen
    name: 通义千问
    provider: openai

  # 智谱AI（GLM）
  - apiKey: null
    apiBase: https://open.bigmodel.cn/api/paas/v4
    defaultModel: glm-4-flash
    enabled: false
    id: glm
    name: 智谱AI
    provider: openai

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 国际主流服务商
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  # OpenAI（ChatGPT）
  - apiKey: null
    apiBase: https://api.openai.com/v1
    defaultModel: gpt-4o
    enabled: false
    id: openai-official
    name: OpenAI (ChatGPT)
    provider: openai

  # Claude（Anthropic）
  - apiKey: null
    apiBase: https://api.anthropic.com
    defaultModel: claude-sonnet-4-20250514
    enabled: false
    id: anthropic-official
    name: Claude
    provider: anthropic

  # Google Gemini
  - apiKey: null
    apiBase: https://generativelanguage.googleapis.com/v1beta/openai
    defaultModel: gemini-2.0-flash-exp
    enabled: false
    id: gemini
    name: Google Gemini
    provider: openai

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 聚合平台
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  # OpenRouter
  - apiKey: null
    apiBase: https://openrouter.ai/api/v1
    defaultModel: anthropic/claude-sonnet-4.6
    enabled: false
    id: openrouter
    name: OpenRouter
    provider: openai

  # Groq
  - apiKey: null
    apiBase: https://api.groq.com/openai/v1
    defaultModel: llama-3.3-70b-versatile
    enabled: false
    id: groq
    name: Groq
    provider: openai