id: typed-turn-recovery
version: 1.0.0
description: Default recovery for typed Agent turns (correct, continue, reuse, stop on no progress)
rules:
  natural_language_without_submission:
    action: correct
    max_attempts: 2
  invalid_structured_output:
    action: correct
  max_tokens:
    action: continue
  tool_slice_boundary:
    action: continue
  no_progress:
    action: stop
  completed_tool_result:
    action: reuse_result
