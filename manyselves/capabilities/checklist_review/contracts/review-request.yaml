id: review-request
version: 1.0.0
description: One project document and the checklist to review it against
adapter: json_schema
schema:
  type: object
  required: [document_path, checklist]
  additionalProperties: false
  properties:
    document_path:
      type: string
      minLength: 1
    checklist:
      type: array
      minItems: 1
      items:
        type: object
        required: [id, question]
        additionalProperties: false
        properties:
          id: {type: string, minLength: 1}
          question: {type: string, minLength: 1}
