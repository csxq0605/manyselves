id: summary-input
version: 1.0.0
description: The finding table, item failures and the checklist
adapter: json_schema
schema:
  type: object
  required: [findings, errors, checklist, open_items]
  properties:
    findings: {type: object}
    errors: {type: object}
    checklist: {type: array}
    open_items: {type: array, items: {type: string}}
