id: ledger_proposal_input
version: 1.0.0
description: The linker's proposals on one judging group's rows, each with the other end's row, and the facts both ends cite
adapter: json_schema
schema:
  type: object
  required: [module_id, group_id, proposed, relation_names, facts]
  properties:
    module_id:
      type: string
    group_id:
      type: string
    proposed:
      type: object
      description: Row id of this group -> the proposals on it, each with other_row (the other end's row in full)
    relation_names:
      type: array
      items:
        type: string
    facts:
      type: string
      description: The facts the other ends cite, as recorded
