id: ledger_row_fix_plan
version: 2.0.0
description: The final ledger with the fixed rows, and one revision per writer - the editor's blocking findings with the sections resting on the fixed rows
adapter: json_schema
schema:
  type: object
  required: [ledger, section_revise_items, changed_rows]
  properties:
    ledger:
      type: object
    section_revise_items:
      type: array
    changed_rows:
      type: array
      items: {type: string}
