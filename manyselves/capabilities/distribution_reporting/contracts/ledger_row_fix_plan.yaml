id: ledger_row_fix_plan
version: 1.0.0
description: The final ledger with the fixed rows, and one revision item per writer whose sections rest on them
adapter: json_schema
schema:
  type: object
  required: [ledger, section_fix_items, changed_rows]
  properties:
    ledger:
      type: object
    section_fix_items:
      type: array
    changed_rows:
      type: array
      items: {type: string}
