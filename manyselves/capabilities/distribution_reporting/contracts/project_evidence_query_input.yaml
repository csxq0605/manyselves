id: project_evidence_query_input
version: 1.0.0
description: Paginated keyword search or exact-scope evidence enumeration
adapter: json_schema
schema:
  type: object
  properties:
    query:
      type: string
      description: Keywords; an empty string enumerates the filtered normalized scope.
    limit: {type: integer, minimum: 1}
    offset: {type: integer, minimum: 0}
    module_id: {type: [string, 'null']}
    submodule_id: {type: [string, 'null']}
  required: [query]
  additionalProperties: false
