id: ledger_apply_relations_input
version: 1.1.0
description: Ledger context, the built ledger and each group's relations
adapter: json_schema
schema:
  type: object
  required: [context, ledger]
  properties:
    own:
      type: object
      description: Each judging group's own relations
    proposals:
      type: object
      description: What each group took of the linker's proposals (runs planned before the cross-module review)
    relations:
      type: object
      description: Relations by module (runs planned before the two rounds)
