id: distribution_reporting_output
version: 1.0.0
description: Typed top-level output carried by partial and completed Reporting runs
adapter: json_schema
schema:
  type: object
  required:
  - run_id
  properties:
    run_id:
      type: string
      minLength: 1
    delivery_completion_ref:
      type: string
      minLength: 1
    delivery_status:
      type: string
      minLength: 1
    output_artifacts:
      type: array
      items:
        type: object
        required:
        - kind
        - path
        properties:
          kind:
            type: string
            minLength: 1
          path:
            type: string
            minLength: 1
          module_id:
            type:
            - string
            - "null"
        additionalProperties: true
  additionalProperties: true
