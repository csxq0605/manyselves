id: text_search_tool_input
version: 1.0.0
description: Provider input for bounded search inside an artifact
adapter: json_schema
schema:
  type: object
  properties:
    ref: {type: string}
    query: {type: string}
    max_matches: {type: integer, minimum: 1}
    context_lines: {type: integer, minimum: 0}
  required: [ref, query]
  additionalProperties: false
