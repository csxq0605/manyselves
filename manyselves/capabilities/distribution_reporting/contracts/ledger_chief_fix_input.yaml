id: ledger_chief_fix_input
version: 1.0.0
description: The findings on chapters 1 and 3 with the rows and records they cite, and only the parts of the chapters they point at
adapter: json_schema
schema:
  type: object
  required: [findings, blocking, texts]
  properties:
    findings:
      type: object
      description: Location -> problem, severity, suggestion, grounds (the cited rows and records as recorded), same_elsewhere
    blocking:
      type: boolean
    texts:
      type: object
      description: Section id (1.1, 1.2, 1.3, 3.1) -> the current text, only the sections pointed at
    chapter1:
      type: object
      description: Chapter 1 in full, present only when one of its tables is pointed at
    actions:
      type: array
      description: The 3.2 action groups pointed at, as they stand
