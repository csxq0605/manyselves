id: ledger_relate_plan_input
version: 2.0.0
description: Ledger context, the built ledger, the cross-module linker's proposals by pack, and each judging group's relate item
adapter: json_schema
schema:
  type: object
  required: [context, ledger, links, own_items]
  properties:
    own_items:
      type: array
      description: One relate item per judging group (built by build-ledger), to which its proposals are added
