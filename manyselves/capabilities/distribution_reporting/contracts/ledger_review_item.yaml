id: ledger_review_item
version: 3.1.0
description: One module's own rows with what each cites, the cases they rest on with every row and record of each, program checks and doubtful photos
adapter: json_schema
schema:
  type: object
  required: [module_id, program_findings, rows, facts, rules, method]
  properties:
    rows:
      type: array
    cases:
      type: array
      description: Each case (one column of one table) the module's rows rest on, with all its rows and records.
    case_rows:
      type: array
      description: Other modules' rows on those cases.
    calculations:
      type: array
    program_checks:
      type: array
    facts:
      type: string
    rules:
      type: string
    method:
      type: string
    photos:
      type: array
      description: Original images whose reading is in doubt, sent with the message in this order.
      items:
        type: object
        required: [photo_id, path, media_type, row_ids]
