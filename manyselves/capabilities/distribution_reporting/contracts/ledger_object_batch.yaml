id: ledger_object_batch
version: 2.0.0
description: Cases (one column of one table) two or more rows rest on, with every row on them and the column's records
adapter: json_schema
schema:
  type: object
  required: [batch_id, cases, rows, facts]
  properties:
    batch_id:
      type: string
    cases:
      type: array
    rows:
      type: array
    facts:
      type: string
