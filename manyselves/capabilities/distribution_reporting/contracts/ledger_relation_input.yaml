id: ledger_relation_input
version: 2.0.0
description: Other modules' flagged rows, the linker's proposals on this group's rows and the relation method, for one author
adapter: json_schema
schema:
  type: object
  required: [module_id, flagged_elsewhere, relation_method, relation_names]
  properties:
    module_id:
      type: string
    related:
      type: object
    group_id:
      type: string
    flagged_elsewhere:
      type: array
      items:
        type: string
    relation_method:
      type: string
    relation_names:
      type: array
      items:
        type: string
    proposed:
      type: object
      description: Row id of this group -> the linker's proposals on it, each with other_row (the other end's row in full)
    facts:
      type: string
      description: The facts the proposals' other ends cite, as recorded
