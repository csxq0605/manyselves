id: ledger_relation_input
version: 3.0.0
description: Other modules' flagged rows, the rows on the same objects and at the same room, and the relation method, for one author
adapter: json_schema
schema:
  type: object
  required: [module_id, flagged_elsewhere, relation_method, relation_names]
  properties:
    module_id:
      type: string
    related:
      type: object
    group_id:
      type: string
    flagged_elsewhere:
      type: array
      items:
        type: string
    relation_method:
      type: string
    relation_names:
      type: array
      items:
        type: string
    same_room:
      type: object
      description: Row id of another module's flagged row at the same distribution room (the table's room column) -> that row briefly
    facts:
      type: string
      description: The records the candidates cite (related rows, same-room rows), as recorded
