id: ledger_relation_batch
version: 1.0.0
description: Recorded cross-module relations with both rows, what they cite and the relation method
adapter: json_schema
schema:
  type: object
  required: [batch_id, relations, rows, facts, relation_method]
  properties:
    batch_id:
      type: string
    relations:
      type: array
    rows:
      type: array
    facts:
      type: string
    relation_method:
      type: string
