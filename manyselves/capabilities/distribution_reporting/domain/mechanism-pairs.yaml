# Subsections whose judgments bear on each other through a mechanism, not
# through one shared object.  Chosen by subsection meaning (taxonomy titles),
# like observation-ownership.yaml, not by one run's data.  Two rows of a pair
# are linked when they are in the same room (or one of them covers the whole
# site) and at least one of them is a concern or undetermined; the author then
# decides whether the link changes its conclusion.
pairs:
  - between: ["2.1.5", "2.2.1.1"]   # 电容补偿投切 ↔ 谐波：谐振放大风险
  - between: ["2.3.2", "2.4.3.1"]   # 零序/漏电防范 ↔ 实测剩余电流
  - between: ["2.3.3", "2.4.2.2"]   # 过电压防范（SPD）↔ 接地与等电位：泄放路径
  - between: ["2.4.1.3", "2.5.1"]   # 联锁/闭锁 ↔ SOP/EOP：防误操作
  - between: ["2.4.1.3", "2.5.5"]   # 联锁/闭锁 ↔ LOTO 与安全用具：防误操作
  - between: ["2.5.1", "2.5.5"]     # SOP/EOP ↔ LOTO：防误操作
  - between: ["2.5.4", "2.2.2.1"]   # 智能化监测 ↔ 发热：单次测量能否转为趋势
  - between: ["2.5.4", "2.4.3.1"]   # 智能化监测 ↔ 剩余电流：单次测量能否转为趋势
  - between: ["2.5.6", "2.4.3"]     # 备件 ↔ 带病运行：故障后恢复
