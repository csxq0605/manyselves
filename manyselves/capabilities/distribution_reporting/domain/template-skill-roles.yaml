# Writing-method roles distilled from the expert report template.
#
# Each role names the template sections it learns from (by number, checked by
# title).  The extraction workflow makes one model call per role with only
# these sections; the program accepts entries and renders one Skill per role
# under Inputs/report-template-role-skills/<id>/SKILL.md.  The order here is
# the order Skills appear in the shared writing context.
policy:
  # Hard rules come from task contracts; a method using these words is refused.
  mandatory_words: [必须, 一律, 务必, 立即, 均须, 均应, 一定要, 不允许]
  # An organisation name in the template is two to four characters before one of these.
  organisation_suffixes: [有限公司, 股份公司, 集团, 公司]
roles:
- id: author-2.1
  title: 2.1 配电系统架构问题的写法
  purpose: 判断和撰写第二章 2.1 各小节时参考：每节怎样分段、表格和图怎样引出、现状、风险与建议怎样衔接，资料不足时怎样写。
  sections: [{number: "2.1", title: 电力系统架构问题}]
- id: author-2.2
  title: 2.2 环境工况风险的写法
  purpose: 判断和撰写第二章 2.2 各小节时参考：每节怎样分段、测量结果和表格怎样呈现、现状、风险与建议怎样衔接，资料不足时怎样写。
  sections: [{number: "2.2", title: 环境工况风险}]
- id: author-2.3
  title: 2.3 针对故障的保护的写法
  purpose: 判断和撰写第二章 2.3 各小节时参考：每节怎样分段、分析过程和结论怎样组织、现状、风险与建议怎样衔接，资料不足时怎样写。
  sections: [{number: "2.3", title: 针对故障的保护}]
- id: author-2.4
  title: 2.4 配电设备/元件风险的写法
  purpose: 判断和撰写第二章 2.4 各小节时参考：每节怎样分段、问题清单和现场图片怎样呈现、现状、风险与建议怎样衔接，资料不足时怎样写。
  sections: [{number: "2.4", title: 配电设备/元件风险}]
- id: author-2.5
  title: 2.5 运维管理与风险管控的写法
  purpose: 判断和撰写第二章 2.5 各小节时参考：每节怎样分段、检查结果和表格怎样呈现、现状、风险与建议怎样衔接，资料不足时怎样写。
  sections: [{number: "2.5", title: 运维管理与风险管控}]
- id: chief-editor-chapter-1
  title: 第一章评估概述的写法
  purpose: 总编写第一章时参考：评估背景交代哪些要素，问题概览怎样从第二章结论归纳。概览表格由系统按结构化字段生成，文字里不画表。
  sections: [{number: "1", title: 配电评估概述}]
- id: chief-editor-chapter-3
  title: 第三章结论与建议的写法
  purpose: 总编写第三章时参考：风险汇总怎样归纳第二章结论，改善行动怎样排列和说明优先级。行动表由系统按结构化字段生成，文字里不画表。
  sections: [{number: "3", title: 结论与建议}]
- id: chief-editor-chapter-4
  title: 第四章专题分析的写法
  purpose: 专家版模板没有第四章，这个角色不从模板提炼，沿用项目里现有的 Skill 文件。
  extract: false
