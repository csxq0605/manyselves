# Method roles distilled from the expert report (专家优化版), not from the
# style template that rendering uses.
#
# Each role names the template sections it learns from (by number, checked by
# title).  The extraction workflow makes one model call per role with only
# these sections; the program accepts entries and renders one Skill per role
# under Inputs/report-template-role-skills/<id>/SKILL.md, grouped by section
# and then by use.  All Skills go into the report's shared context in the
# order listed here; each use names the report step that reads it.
policy:
  # Hard rules come from task contracts; a method using these words is refused.
  mandatory_words: [必须, 一律, 务必, 立即, 均须, 均应, 一定要, 不允许]
  # An organisation name in the template is two to four characters before one of these.
  organisation_suffixes: [有限公司, 股份公司, 集团, 公司]
  # What the product does not produce; an entry that mentions it is refused.
  unavailable:
    附件: 报告不带附件，不能让读者去看附件
    附录: 报告不带附录，不能让读者去看附录
  uses:
  - id: judge
    title: 判断方法
    description: 判断台账时用。专家怎样判断这一节的检查点：看哪些证据、和什么对照、怎样从现状推出风险和影响、按什么理由定优先级和时限、资料不足时怎样处理
  - id: write
    title: 写法
    description: 逐节写正文时用。这一节分哪几段、表和图怎样引出和收尾、现状、风险与建议怎样衔接
  - id: synthesis
    title: 章节综合
    description: 总编写第一章和第三章时用。怎样把第二章各节的结论归并成概览、汇总和行动，怎样排列和说明优先级
  - id: example
    title: 范例
    description: 写正文和总编时用。可以套用的句式，模板的数值、对象和单位都换成〈〉
    placeholders: true
  - id: check
    title: 核对要点
    description: 编辑通读成稿时用。对照专家版的做法核对什么，例如每个关注项是否都有对应的建议、正文和表是否说的是同一对象
# Our own headings outside the chapter 2 taxonomy.  Skills are headed by our
# sections: each expert section is aligned to ours by title, and an expert
# section we have no counterpart for folds into its parent.  Chapter 2 headings
# come from the report taxonomy.
targets:
- {number: "1", title: 配电评估概述}
- {number: "1.1", title: 评估背景}
- {number: "1.2", title: 健康度总览}
- {number: "1.3", title: 各区域执行摘要}
- {number: "3", title: 结论与建议}
- {number: "3.1", title: 风险/问题汇总与概览}
- {number: "3.2", title: 改善行动速查表}
roles:
- id: author-2.1
  title: 2.1 配电系统架构问题的方法
  purpose: 判断和撰写第二章 2.1 各小节时参考。
  sections: [{number: "2.1", title: 电力系统架构问题}]
  uses: [judge, write, example, check]
  required_uses: [judge, write]
- id: author-2.2
  title: 2.2 环境工况风险的方法
  purpose: 判断和撰写第二章 2.2 各小节时参考。
  sections: [{number: "2.2", title: 环境工况风险}]
  uses: [judge, write, example, check]
  required_uses: [judge, write]
- id: author-2.3
  title: 2.3 针对故障的保护的方法
  purpose: 判断和撰写第二章 2.3 各小节时参考。
  sections: [{number: "2.3", title: 针对故障的保护}]
  uses: [judge, write, example, check]
  required_uses: [judge, write]
- id: author-2.4
  title: 2.4 配电设备/元件风险的方法
  purpose: 判断和撰写第二章 2.4 各小节时参考。
  sections: [{number: "2.4", title: 配电设备/元件风险}]
  uses: [judge, write, example, check]
  required_uses: [judge, write]
- id: author-2.5
  title: 2.5 运维管理与风险管控的方法
  purpose: 判断和撰写第二章 2.5 各小节时参考。
  sections: [{number: "2.5", title: 运维管理与风险管控}]
  uses: [judge, write, example, check]
  required_uses: [judge, write]
- id: chief-editor-chapter-1
  title: 第一章评估概述的方法
  purpose: 总编写第一章时参考：评估背景交代哪些要素，健康度总览和各区域摘要怎样从第二章结论归纳。第一章的表由系统按结构化字段生成，文字里不画表。
  sections: [{number: "1", title: 配电评估概述, generated: 表由系统按结构化字段生成}]
  uses: [synthesis, write, example, check]
  required_uses: [synthesis]
- id: chief-editor-chapter-3
  title: 第三章结论与建议的方法
  purpose: 总编写第三章时参考：风险汇总怎样归纳第二章结论，改善行动怎样归并、排列和说明优先级。行动表由系统按结构化字段生成，文字里不画表。
  sections: [{number: "3", title: 结论与建议, generated: 行动表由系统按结构化字段生成，列以任务合同为准}]
  uses: [synthesis, write, example, check]
  required_uses: [synthesis]
