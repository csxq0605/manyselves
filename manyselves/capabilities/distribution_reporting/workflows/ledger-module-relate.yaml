id: ledger-module-relate
version: 2.0.0
description: One author weighs the linker's proposals and relates its own rows to the other modules' flagged rows, in its judging conversation
tasks:
- relate-judgments
recovery:
- typed-turn-recovery
output_contract: ledger_relation_set
state:
  item: null
  item_key: null
actions:
- id: resume-author
  kind: resolve_conversation
  agent: report-consultant
  conversation_key: author
  key_variable: item_key
  mode: run
  output_variable: author_conversation
- id: relate
  kind: invoke_agent
  agent: report-consultant
  task: relate-judgments
  conversation_variable: author_conversation
  input_variable: item
  output_variable: relations
- id: finish
  kind: end_workflow
  output_variable: relations
  output_name: result
