id: ledger-edit-pass
version: 2.0.0
description: One editorial pass over an owner's sections; the findings wait for the fact check's row fixes, so the writer revises once
tasks:
- edit-sections
recovery:
- typed-turn-recovery
output_contract: ledger_owner_result
state:
  item: null
  item_key: null
actions:
- id: open-edit
  kind: create_conversation
  agent: report-consultant
  conversation_key: edit
  key_variable: item_key
  mode: run
  output_variable: edit_conversation
- id: edit
  kind: invoke_agent
  agent: report-consultant
  task: edit-sections
  conversation_variable: edit_conversation
  input_variable: item
  output_variable: review
- id: merge
  kind: invoke_tool
  tool: merge-review-findings
  input_variables:
    item: item
    review: review
  output_variable: merged
- id: hold
  kind: invoke_tool
  tool: hold-edit
  input_variables:
    item: item
    merged: merged
  output_variable: result
- id: finish
  kind: end_workflow
  output_variable: result
  output_name: result
