id: distribution-cross-owner-repair-lane
version: 1.0.0
description: Repair one joint finding owner and complete its local audit; Cross recheck
  occurs after Join.
tasks:
- cross-owner-module-2.1-revision-r1
- cross-owner-module-2.2-revision-r1
- cross-owner-module-2.3-revision-r1
- cross-owner-module-2.4-revision-r1
- cross-owner-module-2.5-revision-r1
- cross-owner-runtime-local-review
- cross-owner-runtime-main-exception
interactions:
- cross-owner-main-exception-decision
recovery:
- current-reporting-recovery
input_contract: reporting_tail_state
output_contract: declarative_cross_owner_runtime_context
parameters:
- owner_module_id
- conversation_key
- revision_agent_id
- revision_task_id
- revision_conversation_key
- local_review_conversation_key
- local_review_workflow_id
state:
  reporting-state: {}
  owner-module-id: '{owner_module_id}'
actions:
- id: project-owner
  kind: invoke_tool
  tool: project-joint-cross-repair-context
  input_variables:
    state: reporting-state
    owner_module_id: owner-module-id
  output_variable: owner-context
- id: needs-repair
  kind: invoke_tool
  tool: cross-owner-initial-has-findings
  input_variable: owner-context
  output_variable: needs-repair
- id: choose-repair
  kind: if
  condition:
    variable: needs-repair
    operator: truthy
  then: prepare-current-cross-owner-revision
  otherwise: finish-repair
- id: prepare-current-cross-owner-revision
  kind: invoke_tool
  tool: prepare-current-cross-owner-revision
  input_variable: owner-context
  output_variable: owner-context
- id: cross-owner-revision-requires-agent
  kind: invoke_tool
  tool: cross-owner-revision-requires-agent
  input_variable: owner-context
  output_variable: should-invoke-cross-owner-revision
- id: choose-cross-owner-revision-source
  kind: if
  condition:
    variable: should-invoke-cross-owner-revision
    operator: truthy
  then: project-current-cross-owner-module-revision-agent-input
  otherwise: prepare-current-cross-owner-author-exception
- id: project-current-cross-owner-module-revision-agent-input
  kind: invoke_tool
  tool: project-current-cross-owner-module-revision-agent-input
  input_variable: owner-context
  output_variable: cross-owner-revision-agent-input
- id: create-cross-owner-revision-conversation
  kind: create_conversation
  agent: '{revision_agent_id}'
  conversation_key: '{revision_conversation_key}'
  mode: run
  output_variable: cross-owner-revision-conversation
- id: invoke-current-cross-owner-revision
  kind: invoke_agent
  agent: '{revision_agent_id}'
  task: '{revision_task_id}'
  conversation_variable: cross-owner-revision-conversation
  input_variable: cross-owner-revision-agent-input
  output_variable: cross-owner-revision-agent-result
- id: accept-current-cross-owner-revision
  kind: invoke_tool
  tool: accept-current-cross-owner-revision
  input_variables:
    context: owner-context
    result: cross-owner-revision-agent-result
  output_variable: owner-context
- id: continue-after-cross-owner-revision
  kind: goto
  target: prepare-current-cross-owner-author-exception
- id: prepare-current-cross-owner-author-exception
  kind: invoke_tool
  tool: prepare-current-cross-owner-author-exception
  input_variable: owner-context
  output_variable: owner-context
- id: cross-owner-author-exception-requires-agent
  kind: invoke_tool
  tool: cross-owner-main-exception-requires-agent
  input_variable: owner-context
  output_variable: should-invoke-cross-owner-author-exception
- id: choose-cross-owner-author-exception-source
  kind: if
  condition:
    variable: should-invoke-cross-owner-author-exception
    operator: truthy
  then: create-cross-owner-author-exception-conversation
  otherwise: cross-owner-author-exception-requests-user
- id: create-cross-owner-author-exception-conversation
  kind: create_conversation
  agent: main-agent
  conversation_key: main-cross-exception
  mode: run
  output_variable: cross-owner-author-exception-conversation
- id: invoke-current-cross-owner-author-exception
  kind: invoke_agent
  agent: main-agent
  task: cross-owner-runtime-main-exception
  conversation_variable: cross-owner-author-exception-conversation
  input_variable: owner-context
  output_variable: cross-owner-main-exception-agent-result
- id: accept-current-cross-owner-author-exception
  kind: invoke_tool
  tool: accept-current-cross-owner-main-exception
  input_variables:
    context: owner-context
    result: cross-owner-main-exception-agent-result
  output_variable: owner-context
- id: continue-after-cross-owner-author-exception
  kind: goto
  target: cross-owner-author-exception-requests-user
- id: cross-owner-author-exception-requests-user
  kind: invoke_tool
  tool: cross-owner-main-exception-requests-user
  input_variable: owner-context
  output_variable: should-request-cross-owner-author-input
- id: choose-cross-owner-author-user-input
  kind: if
  condition:
    variable: should-request-cross-owner-author-input
    operator: truthy
  then: request-cross-owner-author-user-input
  otherwise: cross-owner-author-exception-returns-to-author
- id: request-cross-owner-author-user-input
  kind: request_input
  interaction: cross-owner-main-exception-decision
  output_variable: cross-owner-main-exception-user-input
- id: apply-cross-owner-author-user-input
  kind: invoke_tool
  tool: apply-current-cross-owner-main-exception-user-input
  input_variables:
    context: owner-context
    input: cross-owner-main-exception-user-input
  output_variable: owner-context
- id: continue-after-cross-owner-author-user-input
  kind: goto
  target: cross-owner-author-exception-returns-to-author
- id: cross-owner-author-exception-returns-to-author
  kind: invoke_tool
  tool: cross-owner-author-exception-returns-to-author
  input_variable: owner-context
  output_variable: should-return-cross-owner-to-author
- id: choose-cross-owner-after-author-exception
  kind: if
  condition:
    variable: should-return-cross-owner-to-author
    operator: truthy
  then: prepare-current-cross-owner-revision
  otherwise: prepare-current-cross-owner-local-review
- id: prepare-current-cross-owner-local-review
  kind: invoke_tool
  tool: prepare-current-cross-owner-local-review
  input_variable: owner-context
  output_variable: owner-context
- id: execute-current-cross-owner-local-module-review
  kind: subworkflow
  workflow: '{local_review_workflow_id}'
  input_variable: owner-context
  child_input_variable: owner-context
  child_output_name: result
  output_variable: owner-context
- id: finish-repair
  kind: end_workflow
  output_variable: owner-context
  output_name: result
