id: distribution-cross-joint-review
version: 1.0.0
description: Joint Cross review, parallel owner repair/local audit, merged-snapshot
  recheck.
tasks:
- cross-joint-runtime-review
- cross-joint-runtime-main-exception
interactions:
- cross-owner-main-exception-decision
recovery:
- current-reporting-recovery
input_contract: reporting_tail_state
output_contract: reporting_tail_state
state:
  reporting-state: {}
actions:
- id: prepare-joint
  kind: invoke_tool
  tool: prepare-joint-cross-review
  output_variable: joint-context
  input_variable: reporting-state
- id: create-joint
  kind: create_conversation
  agent: cross-relation-reviewer
  conversation_key: cross-joint
  mode: run
  output_variable: joint-conversation
- id: invoke-joint
  kind: invoke_agent
  agent: cross-relation-reviewer
  task: cross-joint-runtime-review
  conversation_variable: joint-conversation
  input_variable: joint-context
  output_variable: joint-result
- id: accept-joint
  kind: invoke_tool
  tool: accept-joint-cross-review
  output_variable: reporting-state
  input_variables:
    state: reporting-state
    context: joint-context
    result: joint-result
- id: prepare-exception
  kind: invoke_tool
  tool: prepare-joint-cross-exception
  output_variable: exception-context
  input_variable: reporting-state
- id: exception-required
  kind: invoke_tool
  tool: joint-cross-exception-requires-agent
  output_variable: exception-required
  input_variable: exception-context
- id: choose-exception
  kind: if
  condition:
    variable: exception-required
    operator: truthy
  then: create-main
  otherwise: exception-needs-user
- id: create-main
  kind: create_conversation
  agent: main-agent
  conversation_key: main-cross-joint-exception
  mode: run
  output_variable: main-conversation
- id: invoke-main
  kind: invoke_agent
  agent: main-agent
  task: cross-joint-runtime-main-exception
  conversation_variable: main-conversation
  input_variable: exception-context
  output_variable: main-result
- id: accept-main
  kind: invoke_tool
  tool: accept-joint-cross-exception
  output_variable: exception-context
  input_variables:
    context: exception-context
    result: main-result
- id: exception-needs-user
  kind: invoke_tool
  tool: joint-cross-exception-requests-user
  output_variable: needs-user
  input_variable: exception-context
- id: choose-user
  kind: if
  condition:
    variable: needs-user
    operator: truthy
  then: request-user
  otherwise: apply-decision
- id: request-user
  kind: request_input
  interaction: cross-owner-main-exception-decision
  output_variable: user-input
- id: apply-user
  kind: invoke_tool
  tool: apply-joint-cross-exception-user-input
  output_variable: exception-context
  input_variables:
    context: exception-context
    input: user-input
- id: apply-decision
  kind: invoke_tool
  tool: apply-joint-cross-exception
  output_variable: reporting-state
  input_variables:
    state: reporting-state
    context: exception-context
- id: needs-repairs
  kind: invoke_tool
  tool: joint-cross-needs-repairs
  output_variable: needs-repairs
  input_variable: reporting-state
- id: choose-next
  kind: if
  condition:
    variable: needs-repairs
    operator: truthy
  then: repair-cohort
  otherwise: complete
- id: repair-cohort
  kind: subworkflow
  workflow: distribution-cross-joint-repairs
  input_variables:
    reporting-state: reporting-state
  child_output_name: result
  output_variable: reporting-state
- id: review-merged
  kind: goto
  target: prepare-joint
- id: complete
  kind: invoke_tool
  tool: complete-joint-cross-review
  output_variable: reporting-state
  input_variable: reporting-state
- id: finish
  kind: end_workflow
  output_variable: reporting-state
  output_name: result
