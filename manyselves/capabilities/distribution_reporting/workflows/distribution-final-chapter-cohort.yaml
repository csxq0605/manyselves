id: distribution-final-chapter-cohort
version: 1.0.0
description: File-defined parallel Join for the Final initial chapter lanes
tasks:
- final-chapter-review
gates: []
recovery:
- current-reporting-recovery
input_contract: reporting_tail_state
output_contract: reporting_tail_state
state:
  reporting-state: {}
  chapter-id-1: "1"
  chapter-id-3: "3"
  chapter-id-4: "4"
  prepared-final-state: {}
  final-chapter-outcomes: {}
  completed-final-state: {}
actions:
- id: prepare-final-chapter-cohort
  kind: invoke_tool
  tool: prepare-final-chapter-cohort
  input_variable: reporting-state
  output_variable: prepared-final-state
- id: final-chapter-cohort
  kind: parallel
  branches:
    "1": execute-final-chapter-1
    "3": execute-final-chapter-3
    "4": execute-final-chapter-4
  join: join-final-chapter-cohort
  max_concurrency: 3
- id: execute-final-chapter-1
  kind: subworkflow
  workflow: distribution-final-chapter-1-lane
  input_variables:
    reporting-state: prepared-final-state
    chapter-id: chapter-id-1
  child_output_name: result
  output_variable: outcome-1
- id: complete-final-chapter-1-branch
  kind: goto
  target: join-final-chapter-cohort
- id: execute-final-chapter-3
  kind: subworkflow
  workflow: distribution-final-chapter-3-lane
  input_variables:
    reporting-state: prepared-final-state
    chapter-id: chapter-id-3
  child_output_name: result
  output_variable: outcome-3
- id: complete-final-chapter-3-branch
  kind: goto
  target: join-final-chapter-cohort
- id: execute-final-chapter-4
  kind: subworkflow
  workflow: distribution-final-chapter-4-lane
  input_variables:
    reporting-state: prepared-final-state
    chapter-id: chapter-id-4
  child_output_name: result
  output_variable: outcome-4
- id: complete-final-chapter-4-branch
  kind: goto
  target: join-final-chapter-cohort
- id: join-final-chapter-cohort
  kind: join
  parallel: final-chapter-cohort
  inputs:
    "1": outcome-1
    "3": outcome-3
    "4": outcome-4
  output_variable: final-chapter-outcomes
- id: reduce-final-chapter-cohort
  kind: invoke_tool
  tool: reduce-final-chapter-cohort
  input_variables:
    state: prepared-final-state
    outcomes: final-chapter-outcomes
  output_variable: completed-final-state
- id: continue-final-review
  kind: invoke_tool
  tool: continue-current-final-review
  input_variable: completed-final-state
  output_variable: completed-final-state
- id: finish-final-chapter-cohort
  kind: end_workflow
  output_variable: completed-final-state
  output_name: result
