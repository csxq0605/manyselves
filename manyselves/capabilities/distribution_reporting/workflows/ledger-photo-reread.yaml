id: ledger-photo-reread
version: 1.0.0
description: One photo read again in a fresh reader conversation, without the recorded values
tasks:
- photo-reread
recovery:
- typed-turn-recovery
output_contract: photo_reading_submission
state:
  item: null
  item_key: null
actions:
- id: fresh-reader
  kind: reset_conversation
  agent: photo-reader
  conversation_key: photo-reread
  key_variable: item_key
  mode: run
  output_variable: reader_conversation
- id: reread
  kind: invoke_agent
  agent: photo-reader
  task: photo-reread
  conversation_variable: reader_conversation
  input_variable: item
  output_variable: reading
- id: finish
  kind: end_workflow
  output_variable: reading
  output_name: result
