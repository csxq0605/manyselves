id: revise-report
version: 1.0.0
description: Copy one business baseline into a new Run, analyze input impact, revise assigned subsections, cross-review, aggregate and deliver
tasks:
- aggregate-existing
- cross-owner-review
interactions:
- revision-impact-decision
recovery:
- current-reporting-recovery
outputs:
- distribution-reporting-result
input_contract: public_revise_report_input
input_variable: request
output_contract: distribution_reporting_output
state:
  run-id: ''
  reporting-state: {}
  impact-analysis: {}
  needs-impact-confirm: false
actions:
- id: prepare-report-revision
  kind: invoke_tool
  tool: prepare-report-revision
  input_variables:
    run_id: run-id
    request: request
  output_variable: reporting-state
- id: revision-inputs-changed
  kind: invoke_tool
  tool: revision-inputs-changed
  input_variable: reporting-state
  output_variable: inputs-changed
- id: choose-revision-inputs
  kind: if
  condition:
    variable: inputs-changed
    operator: truthy
  then: project-revision-preparation
  otherwise: impact-mode-check
- id: project-revision-preparation
  kind: invoke_tool
  tool: project-revision-preparation
  input_variable: reporting-state
  output_variable: revision-preparation
- id: run-revision-preparation
  kind: subworkflow
  workflow: distribution-revision-preparation
  input_variable: revision-preparation
  child_input_variable: preparation-context
  child_output_name: result
  output_variable: revision-preparation
- id: attach-revision-preparation
  kind: invoke_tool
  tool: attach-revision-preparation
  input_variables:
    state: reporting-state
    preparation: revision-preparation
  output_variable: reporting-state
- id: impact-mode-check
  kind: invoke_tool
  tool: revision-impact-mode-enabled
  input_variable: reporting-state
  output_variable: impact-enabled
- id: choose-impact-path
  kind: if
  condition:
    variable: impact-enabled
    operator: truthy
  then: build-revision-impact
  otherwise: run-module-cohort
- id: build-revision-impact
  kind: invoke_tool
  tool: build-revision-impact
  input_variable: reporting-state
  output_variable: impact-analysis
- id: impact-needs-confirmation
  kind: invoke_tool
  tool: revision-impact-needs-confirmation
  input_variable: reporting-state
  output_variable: needs-impact-confirm
- id: choose-impact-confirmation
  kind: if
  condition:
    variable: needs-impact-confirm
    operator: truthy
  then: request-impact-decision
  otherwise: apply-impact-auto
- id: request-impact-decision
  kind: request_input
  interaction: revision-impact-decision
  output_variable: impact-decision
- id: apply-impact-after-decision
  kind: invoke_tool
  tool: apply-revision-impact
  input_variables:
    state: reporting-state
    analysis: impact-analysis
    decision: impact-decision
  output_variable: reporting-state
- id: continue-after-impact-decision
  kind: goto
  target: run-module-cohort
- id: apply-impact-auto
  kind: invoke_tool
  tool: apply-revision-impact
  input_variables:
    state: reporting-state
    analysis: impact-analysis
  output_variable: reporting-state
- id: run-module-cohort
  kind: subworkflow
  workflow: distribution-module-cohort
  input_variable: reporting-state
  child_input_variable: module-inputs
  child_output_name: result
  output_variable: module-results
- id: attach-module-results
  kind: invoke_tool
  tool: attach-module-results
  input_variables:
    reporting_state: reporting-state
    module_results: module-results
  output_variable: reporting-state
- id: run-cross
  kind: subworkflow
  workflow: distribution-cross-owner-cohort
  input_variables:
    reporting-state: reporting-state
  child_output_name: result
  output_variable: reporting-state
- id: prepare-revision-aggregate
  kind: invoke_tool
  tool: prepare-revision-aggregate
  input_variable: reporting-state
  output_variable: aggregate-context
- id: project-aggregate-editor-input
  kind: invoke_tool
  tool: project-aggregate-editor-input
  input_variable: aggregate-context
  output_variable: aggregate-editor-input
- id: create-aggregate-editor-conversation
  kind: create_conversation
  agent: aggregate-editor
  conversation_key: aggregate-existing
  mode: run
  output_variable: aggregate-conversation
- id: invoke-aggregate-editor
  kind: invoke_agent
  agent: aggregate-editor
  task: aggregate-existing
  conversation_variable: aggregate-conversation
  input_variable: aggregate-editor-input
  output_variable: edited-report
- id: project-aggregate-existing-handoff
  kind: invoke_tool
  tool: project-aggregate-existing-handoff
  input_variables:
    context: aggregate-context
    edited_report: edited-report
  output_variable: aggregate-handoff
- id: project-aggregate-existing-tail
  kind: invoke_tool
  tool: project-aggregate-existing-tail
  input_variable: aggregate-handoff
  output_variable: reporting-state
- id: run-final-review
  kind: subworkflow
  workflow: distribution-final-chapter-cohort
  input_variables:
    reporting-state: reporting-state
  child_output_name: result
  output_variable: reporting-state
- id: run-report-delivery
  kind: subworkflow
  workflow: distribution-report-delivery
  input_variables:
    reporting-state: reporting-state
  child_output_name: result
  output_variable: reporting-state
- id: publish-revised-report
  kind: publish_result
  output: distribution-reporting-result
  input_variable: reporting-state
  output_name: result
- id: finish-revised-report
  kind: end_workflow
  output_variable: reporting-state
  output_name: result
