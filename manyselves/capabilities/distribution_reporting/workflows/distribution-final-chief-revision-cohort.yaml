id: distribution-final-chief-revision-cohort
version: 1.0.0
description: File-defined affected-only parallel Join for Final Chief revision lanes
tasks:
- final-chief-chapter-revision
recovery:
- current-reporting-recovery
input_contract: declarative_final_review_cycle_context
output_contract: declarative_final_review_cycle_context
state:
  review: {}
  chapter-id-1: "1"
  chapter-id-3: "3"
  chapter-id-4: "4"
  revision-outcomes: {}
  completed-review-cycle: {}
actions:
- id: final-chief-revision-cohort
  kind: parallel
  branches:
    "1": execute-final-chief-revision-1
    "3": execute-final-chief-revision-3
    "4": execute-final-chief-revision-4
  join: join-final-chief-revision-cohort
  max_concurrency: 3
- id: execute-final-chief-revision-1
  kind: subworkflow
  workflow: distribution-final-chief-revision-1-lane
  input_variables:
    review: review
    chapter-id: chapter-id-1
  child_output_name: result
  output_variable: revision-outcome-1
- id: complete-final-chief-revision-1-branch
  kind: goto
  target: join-final-chief-revision-cohort
- id: execute-final-chief-revision-3
  kind: subworkflow
  workflow: distribution-final-chief-revision-3-lane
  input_variables:
    review: review
    chapter-id: chapter-id-3
  child_output_name: result
  output_variable: revision-outcome-3
- id: complete-final-chief-revision-3-branch
  kind: goto
  target: join-final-chief-revision-cohort
- id: execute-final-chief-revision-4
  kind: subworkflow
  workflow: distribution-final-chief-revision-4-lane
  input_variables:
    review: review
    chapter-id: chapter-id-4
  child_output_name: result
  output_variable: revision-outcome-4
- id: complete-final-chief-revision-4-branch
  kind: goto
  target: join-final-chief-revision-cohort
- id: join-final-chief-revision-cohort
  kind: join
  parallel: final-chief-revision-cohort
  inputs:
    "1": revision-outcome-1
    "3": revision-outcome-3
    "4": revision-outcome-4
  output_variable: revision-outcomes
- id: reduce-final-chief-revision-cohort
  kind: invoke_tool
  tool: reduce-final-chief-revision-cohort
  input_variables:
    review: review
    outcomes: revision-outcomes
  output_variable: completed-review-cycle
- id: finish-final-chief-revision-cohort
  kind: end_workflow
  output_variable: completed-review-cycle
  output_name: result
