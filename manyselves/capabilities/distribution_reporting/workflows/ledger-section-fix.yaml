id: ledger-section-fix
version: 1.0.0
description: One writer brings its sections in line with the rows the fact check had fixed, in its writing conversation
tasks:
- revise-sections
recovery:
- typed-turn-recovery
output_contract: ledger_section_set
state:
  item: null
  item_key: null
actions:
- id: resume-writer
  kind: resolve_conversation
