id: ledger-module-review
version: 2.0.0
description: The module lens - review one module's rows from its review packet in a conversation of its own
tasks:
- review-judgments
recovery:
- typed-turn-recovery
state:
  item: null
  item_key: null
actions:
- id: open-review
  kind: create_conversation
  agent: report-consultant
  conversation_key: review
  key_variable: item_key
  mode: run
  output_variable: review_conversation
- id: review
  kind: invoke_agent
  agent: report-consultant
  task: review-judgments
  conversation_variable: review_conversation
  input_variable: item
  output_variable: review
- id: finish
  kind: end_workflow
  output_variable: review
  output_name: result
