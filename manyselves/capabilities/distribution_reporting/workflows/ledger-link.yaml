id: ledger-link
version: 1.0.0
description: The cross-module linker reads one scope's flagged rows in full and proposes relations
tasks:
- link-rows
recovery:
- typed-turn-recovery
output_contract: ledger_link_proposals
state:
  item: null
  item_key: null
actions:
- id: open-linker
  kind: create_conversation
  agent: report-consultant
  conversation_key: linker
  key_variable: item_key
  mode: run
  output_variable: linker_conversation
- id: link
  kind: invoke_agent
  agent: report-consultant
  task: link-rows
  conversation_variable: linker_conversation
  input_variable: item
  output_variable: proposals
- id: finish
  kind: end_workflow
  output_variable: proposals
  output_name: result
