id: ledger-section-revise
version: 2.0.0
description: One writer revises once, on the editor's findings and the rows the fact check fixed, in its writing conversation; the program checks the revision once
tasks:
- revise-sections
recovery:
- typed-turn-recovery
output_contract: ledger_owner_result
state:
  item: null
  item_key: null
  revision: null
  recheck: null
  recheck_revision: null
actions:
- id: resume-writer
  kind: resolve_conversation
  agent: report-consultant
  conversation_key: writer
  key_variable: item_key
  mode: run
  output_variable: writer_conversation
- id: revision-input
  kind: set_variable
  variable: revision_input
  value_variable: item
  field: revision_input
- id: revise
  kind: invoke_agent
  agent: report-consultant
  task: revise-sections
  conversation_variable: writer_conversation
  input_variable: revision_input
  output_variable: revision
- id: item-findings
  kind: set_variable
  variable: item_findings
  value_variable: item
  field: findings
- id: findings
  kind: set_variable
  variable: merged
  value_variables:
    findings: item_findings
- id: recheck
  kind: invoke_tool
  tool: recheck-edit
  input_variables:
    item: item
    merged: merged
    revision: revision
  output_variable: recheck
- id: recheck-blocking
  kind: set_variable
  variable: recheck_blocking
  value_variable: recheck
  field: blocking
- id: recheck-route
  kind: if
  condition:
    variable: recheck_blocking
    operator: eq
    value: true
  then: recheck-input
  otherwise: close
- id: recheck-input
  kind: set_variable
  variable: recheck_revision_input
  value_variable: recheck
  field: revision_input
- id: revise-again
  kind: invoke_agent
  agent: report-consultant
  task: revise-sections
  conversation_variable: writer_conversation
  input_variable: recheck_revision_input
  output_variable: recheck_revision
- id: close
  kind: invoke_tool
  tool: close-edit
  input_variables:
    item: item
    merged: merged
    revision: revision
    recheck: recheck
    recheck_revision: recheck_revision
  output_variable: result
- id: finish
  kind: end_workflow
  output_variable: result
  output_name: result
