id: distribution-cross-owner-pipeline
version: 1.0.0
description: Reusable current Cross owner pipeline bound to Reporting behavior
tasks:
- cross-owner-runtime-initial-review
- cross-owner-module-2.1-revision-r1
- cross-owner-module-2.2-revision-r1
- cross-owner-module-2.3-revision-r1
- cross-owner-module-2.4-revision-r1
- cross-owner-module-2.5-revision-r1
- cross-owner-runtime-local-review
- cross-owner-runtime-recheck
gates: []
recovery:
- current-reporting-recovery
input_contract: reporting_tail_state
output_contract: declarative_cross_owner_pipeline_outcome
parameters:
- owner_module_id
- conversation_key
- revision_agent_id
- revision_task_id
- revision_conversation_key
- local_review_conversation_key
state:
  reporting-state: {}
  owner-module-id: "{owner_module_id}"
actions:
- id: prepare-current-cross-owner-initial
  kind: invoke_tool
  tool: prepare-current-cross-owner-initial
  input_variables:
    state: reporting-state
    owner_module_id: owner-module-id
  output_variable: owner-context
- id: cross-owner-initial-requires-agent
  kind: invoke_tool
  tool: cross-owner-initial-requires-agent
  input_variable: owner-context
  output_variable: should-invoke-cross-owner-initial
- id: choose-cross-owner-initial-source
  kind: if
  condition:
    variable: should-invoke-cross-owner-initial
    operator: truthy
  then: create-cross-owner-conversation
  otherwise: cross-owner-initial-has-findings
- id: create-cross-owner-conversation
  kind: create_conversation
  agent: cross-module-reviewer
  conversation_key: "{conversation_key}"
  mode: run
  output_variable: cross-owner-conversation
- id: invoke-current-cross-owner-initial
  kind: invoke_agent
  agent: cross-module-reviewer
  task: cross-owner-runtime-initial-review
  conversation_variable: cross-owner-conversation
  input_variable: owner-context
  output_variable: cross-owner-initial-agent-result
- id: accept-current-cross-owner-initial
  kind: invoke_tool
  tool: accept-current-cross-owner-initial
  input_variables:
    context: owner-context
    result: cross-owner-initial-agent-result
  output_variable: owner-context
- id: continue-after-cross-owner-initial
  kind: goto
  target: cross-owner-initial-has-findings
- id: cross-owner-initial-has-findings
  kind: invoke_tool
  tool: cross-owner-initial-has-findings
  input_variable: owner-context
  output_variable: owner-initial-has-findings
- id: choose-cross-owner-revision
  kind: if
  condition:
    variable: owner-initial-has-findings
    operator: truthy
  then: prepare-current-cross-owner-revision
  otherwise: complete-current-cross-owner-without-findings
- id: prepare-current-cross-owner-revision
  kind: invoke_tool
  tool: prepare-current-cross-owner-revision
  input_variable: owner-context
  output_variable: owner-context
- id: cross-owner-revision-requires-agent
  kind: invoke_tool
  tool: cross-owner-revision-requires-agent
  input_variable: owner-context
  output_variable: should-invoke-cross-owner-revision
- id: choose-cross-owner-revision-source
  kind: if
  condition:
    variable: should-invoke-cross-owner-revision
    operator: truthy
  then: create-cross-owner-revision-conversation
  otherwise: prepare-current-cross-owner-local-review
- id: create-cross-owner-revision-conversation
  kind: create_conversation
  agent: "{revision_agent_id}"
  conversation_key: "{revision_conversation_key}"
  mode: run
  output_variable: cross-owner-revision-conversation
- id: invoke-current-cross-owner-revision
  kind: invoke_agent
  agent: "{revision_agent_id}"
  task: "{revision_task_id}"
  conversation_variable: cross-owner-revision-conversation
  input_variable: owner-context
  output_variable: cross-owner-revision-agent-result
- id: accept-current-cross-owner-revision
  kind: invoke_tool
  tool: accept-current-cross-owner-revision
  input_variables:
    context: owner-context
    result: cross-owner-revision-agent-result
  output_variable: owner-context
- id: continue-after-cross-owner-revision
  kind: goto
  target: prepare-current-cross-owner-local-review
- id: prepare-current-cross-owner-local-review
  kind: invoke_tool
  tool: prepare-current-cross-owner-local-review
  input_variable: owner-context
  output_variable: owner-context
- id: cross-owner-local-review-requires-agent
  kind: invoke_tool
  tool: cross-owner-local-review-requires-agent
  input_variable: owner-context
  output_variable: should-invoke-cross-owner-local-review
- id: choose-cross-owner-local-review-source
  kind: if
  condition:
    variable: should-invoke-cross-owner-local-review
    operator: truthy
  then: create-cross-owner-local-review-conversation
  otherwise: prepare-current-cross-owner-recheck
- id: create-cross-owner-local-review-conversation
  kind: create_conversation
  agent: evidence-auditor
  conversation_key: "{local_review_conversation_key}"
  mode: run
  output_variable: cross-owner-local-review-conversation
- id: invoke-current-cross-owner-local-review
  kind: invoke_agent
  agent: evidence-auditor
  task: cross-owner-runtime-local-review
  conversation_variable: cross-owner-local-review-conversation
  input_variable: owner-context
  output_variable: cross-owner-local-review-agent-result
- id: accept-current-cross-owner-local-review
  kind: invoke_tool
  tool: accept-current-cross-owner-local-review
  input_variables:
    context: owner-context
    result: cross-owner-local-review-agent-result
  output_variable: owner-context
- id: continue-after-cross-owner-local-review
  kind: goto
  target: prepare-current-cross-owner-recheck
- id: prepare-current-cross-owner-recheck
  kind: invoke_tool
  tool: prepare-current-cross-owner-recheck
  input_variable: owner-context
  output_variable: owner-context
- id: cross-owner-recheck-requires-agent
  kind: invoke_tool
  tool: cross-owner-recheck-requires-agent
  input_variable: owner-context
  output_variable: should-invoke-cross-owner-recheck
- id: choose-cross-owner-recheck-source
  kind: if
  condition:
    variable: should-invoke-cross-owner-recheck
    operator: truthy
  then: create-cross-owner-recheck-conversation
  otherwise: advance-current-cross-owner-round
- id: create-cross-owner-recheck-conversation
  kind: create_conversation
  agent: cross-module-reviewer
  conversation_key: "{conversation_key}"
  mode: run
  output_variable: cross-owner-recheck-conversation
- id: invoke-current-cross-owner-recheck
  kind: invoke_agent
  agent: cross-module-reviewer
  task: cross-owner-runtime-recheck
  conversation_variable: cross-owner-recheck-conversation
  input_variable: owner-context
  output_variable: cross-owner-recheck-agent-result
- id: accept-current-cross-owner-recheck
  kind: invoke_tool
  tool: accept-current-cross-owner-recheck
  input_variables:
    context: owner-context
    result: cross-owner-recheck-agent-result
  output_variable: owner-context
- id: continue-after-cross-owner-recheck
  kind: goto
  target: advance-current-cross-owner-round
- id: advance-current-cross-owner-round
  kind: invoke_tool
  tool: advance-current-cross-owner-round
  input_variable: owner-context
  output_variable: owner-context
- id: cross-owner-round-needs-revision
  kind: invoke_tool
  tool: cross-owner-round-needs-revision
  input_variable: owner-context
  output_variable: owner-round-needs-revision
- id: choose-cross-owner-next-step
  kind: if
  condition:
    variable: owner-round-needs-revision
    operator: truthy
  then: prepare-current-cross-owner-revision
  otherwise: complete-current-cross-owner-pipeline
- id: complete-current-cross-owner-pipeline
  kind: invoke_tool
  tool: complete-current-cross-owner-pipeline
  input_variable: owner-context
  output_variable: owner-outcome
- id: finish-after-cross-owner-completion
  kind: goto
  target: finish-cross-owner-pipeline
- id: complete-current-cross-owner-without-findings
  kind: invoke_tool
  tool: complete-current-cross-owner-without-findings
  input_variable: owner-context
  output_variable: owner-outcome
- id: finish-after-cross-owner-no-finding-completion
  kind: goto
  target: finish-cross-owner-pipeline
- id: continue-current-cross-owner-pipeline
  kind: invoke_tool
  tool: continue-current-cross-owner-pipeline
  input_variable: owner-context
  output_variable: owner-outcome
- id: finish-cross-owner-pipeline
  kind: end_workflow
  output_variable: owner-outcome
  output_name: result
