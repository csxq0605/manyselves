id: ledger-chief-draft
version: 1.1.0
description: The chief merges actions and writes chapters 3 and 1 from the ledger, the program checking their tables; with joint review the facts are checked together with the writers' sections. In a revision a chapter the program carried over is used as the base version left it, and chapter 1 is written on its own when chapter 3 was carried over
tasks:
- chief-chapter-3
- revise-chief-actions
- chief-chapter-1
- chief-chapter-1-alone
recovery:
- typed-turn-recovery
output_contract: ledger_chief_chapters
state:
  final: null
  context: null
  chief_key: chief
  # Chapter 1 reads the chief input already in the conversation.
  chief_followup:
    note: 依据同上：上文的总编资料、输入和你提交的第三章
actions:
- id: open-chief
  kind: create_conversation
  agent: report-consultant
  conversation_key: writer
  key_variable: chief_key
  mode: run
  output_variable: chief_conversation
- id: chief-input
  kind: set_variable
  variable: chief_input
  value_variable: final
  field: chief_input
# A revision's carried-over chapters (null when written again).
- id: kept-3
  kind: set_variable
  variable: kept3
  value_variable: final
  field: kept.chapter3
- id: kept-1
  kind: set_variable
  variable: kept1
  value_variable: final
  field: kept.chapter1
- id: route-kept-3
  kind: if
  condition:
    variable: kept3
    operator: truthy
  then: use-kept-3
  otherwise: chapter-3
- id: use-kept-3
  kind: set_variable
  variable: chapter3
  value_variable: kept3
- id: kept-3-done
  kind: goto
  target: route-1
- id: chapter-3
  kind: invoke_agent
  agent: report-consultant
  task: chief-chapter-3
  conversation_variable: chief_conversation
  input_variable: chief_input
  output_variable: chapter3
- id: check-3
  kind: invoke_tool
  tool: check-chief-tables
  input_variables:
    ledger: final
    chapter3: chapter3
  output_variable: check3
- id: blocking-3
  kind: set_variable
  variable: blocking3
  value_variable: check3
  field: blocking
- id: route-3
  kind: if
  condition:
    variable: blocking3
    operator: eq
    value: true
  then: revise-3
  otherwise: route-1
- id: revise-3
  kind: invoke_agent
  agent: report-consultant
  task: revise-chief-actions
  conversation_variable: chief_conversation
  input_variable: check3
  output_variable: chapter3
# Chapter 1 carried over; or written on its own, from the chief input, when
# chapter 3 was carried over and is not in the conversation; or written on
# from chapter 3.
- id: route-1
  kind: condition_group
  branches:
  - condition:
      variable: kept1
      operator: truthy
    target: use-kept-1
  - condition:
      variable: kept3
      operator: truthy
    target: chapter-1-alone
  default: chapter-1
- id: use-kept-1
  kind: set_variable
  variable: chapter1
  value_variable: kept1
- id: kept-1-done
  kind: goto
  target: check-1
- id: chapter-1-alone
  kind: invoke_agent
  agent: report-consultant
  task: chief-chapter-1-alone
  conversation_variable: chief_conversation
  input_variable: chief_input
  output_variable: chapter1
- id: alone-done
  kind: goto
  target: check-1
- id: chapter-1
  kind: invoke_agent
  agent: report-consultant
  task: chief-chapter-1
  conversation_variable: chief_conversation
  input_variable: chief_followup
  output_variable: chapter1
- id: check-1
  kind: invoke_tool
  tool: check-chief-tables
  input_variables:
    ledger: final
    chapter3: chapter3
    chapter1: chapter1
  output_variable: check1
- id: collect
  kind: set_variable
  variable: outputs
  value_variables:
    chapter1: chapter1
    chapter3: chapter3
    check1: check1
- id: finish
  kind: end_workflow
  output_variable: outputs
  output_name: result
