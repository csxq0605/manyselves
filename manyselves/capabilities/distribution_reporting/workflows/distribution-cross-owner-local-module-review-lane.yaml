  tool: cross-owner-local-review-needs-revision
  input_variable: owner-context
  output_variable: should-revise-local-module
- id: choose-cross-owner-local-review-result
  kind: if
  condition:
    variable: should-revise-local-module
    operator: truthy
  then: prepare-current-cross-owner-local-module-revision
  otherwise: finish-cross-owner-local-module-review
- id: prepare-current-cross-owner-local-module-revision
  kind: invoke_tool
  tool: prepare-current-cross-owner-local-module-revision
  input_variable: owner-context
  output_variable: owner-context
- id: cross-owner-local-revision-requires-agent
