  tool: cross-owner-local-review-preflight-needs-revision
  input_variable: owner-context
  output_variable: should-revise-local-recheck-preflight
- id: choose-cross-owner-local-recheck-preflight
  kind: if
  condition:
    variable: should-revise-local-recheck-preflight
