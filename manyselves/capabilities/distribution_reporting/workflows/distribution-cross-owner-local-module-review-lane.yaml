- id: create-cross-owner-local-revision-conversation
  kind: create_conversation
  agent: "{revision_agent_id}"
  conversation_key: "{revision_conversation_key}"
  mode: run
  output_variable: cross-owner-local-revision-conversation
- id: invoke-current-cross-owner-local-module-revision
  kind: invoke_agent
  agent: "{revision_agent_id}"
  task: "{revision_task_id}"
  conversation_variable: cross-owner-local-revision-conversation
  input_variable: cross-owner-local-revision-agent-input
  output_variable: cross-owner-local-revision-result
- id: accept-current-cross-owner-local-module-revision
  kind: invoke_tool
  tool: accept-current-cross-owner-local-module-revision
  input_variables:
    context: owner-context
    result: cross-owner-local-revision-result
  output_variable: owner-context
- id: prepare-current-cross-owner-local-module-recheck
  kind: invoke_tool
  tool: prepare-current-cross-owner-local-module-recheck
  input_variable: owner-context
  output_variable: owner-context
- id: continue-after-cross-owner-local-module-recheck-preparation
  kind: goto
  target: cross-owner-local-recheck-preflight-needs-revision
- id: cross-owner-local-recheck-preflight-needs-revision
