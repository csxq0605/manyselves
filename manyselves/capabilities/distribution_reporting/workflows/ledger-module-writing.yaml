id: ledger-module-writing
version: 1.2.0
description: A writer writes one group of sections in a conversation of its own, from the group's material; in a revision the sections the program carried over from the base version come first as they were and are not written again
tasks:
- write-section
recovery:
- typed-turn-recovery
state:
  item: null
  item_key: null
  written: []
actions:
- id: open-writer
  kind: create_conversation
  agent: report-consultant
  conversation_key: writer
  key_variable: item_key
  mode: run
  output_variable: writer_conversation
# A revision's carried-over sections, with the base version's final text.
- id: kept
  kind: set_variable
  variable: written
  value_variable: item
  field: kept_sections
- id: sections
  kind: set_variable
  variable: sections
  value_variable: item
  field: sections
- id: each-section
  kind: for_each
  items_variable: sections
  item_variable: section
  body: write
  after: finish
- id: write
  kind: invoke_agent
  agent: report-consultant
  task: write-section
  conversation_variable: writer_conversation
  input_variable: section
  output_variable: section_text
- id: record
  kind: append_variable
  variable: written
  value_variable: section_text
- id: next-section
  kind: goto
  target: each-section
- id: finish
  kind: end_workflow
  output_variable: written
  output_name: result
