id: distribution-module-runtime-lane
version: 1.0.0
description: Reusable production module Lane bound to current Reporting behavior
tasks:
- module-2.1-authoring
- module-2.2-authoring
- module-2.3-authoring
- module-2.4-authoring
- module-2.5-authoring
- module-runtime-initial-review
- module-runtime-recheck
- module-runtime-main-exception
- module-2.1-runtime-revision
- module-2.2-runtime-revision
- module-2.3-runtime-revision
- module-2.4-runtime-revision
- module-2.5-runtime-revision
interactions:
- module-main-exception-decision
recovery:
- current-reporting-recovery
input_contract: reporting_tail_state
output_contract: declarative_module_lane_outcome
parameters:
- module_id
- author_id
- author_task_id
- author_conversation_key
- auditor_conversation_key
- revision_task_id
- revision_conversation_key
state:
  reporting-state: {}
  module-id: "{module_id}"
  lane-outcomes: {}
actions:
- id: start-current-module-lane
  kind: invoke_tool
  tool: start-current-module-lane
  input_variables:
    state: reporting-state
    module_id: module-id
    lane_outcomes: lane-outcomes
  output_variable: lane-context
- id: module-has-requested-revision
  kind: invoke_tool
  tool: module-has-requested-revision
  input_variable: lane-context
  output_variable: requested-revision
- id: choose-requested-revision
  kind: if
  condition:
    variable: requested-revision
    operator: truthy
  then: prepare-requested-module-revision
  otherwise: module-lane-retries-preflight-revision
- id: prepare-requested-module-revision
  kind: invoke_tool
  tool: prepare-requested-module-revision
  input_variable: lane-context
  output_variable: lane-context
- id: create-requested-revision-conversation
  kind: create_conversation
  agent: "{author_id}"
  conversation_key: "{revision_conversation_key}"
  mode: run
  output_variable: requested-revision-conversation
- id: invoke-requested-module-revision
  kind: invoke_agent
  agent: "{author_id}"
  task: "{revision_task_id}"
  conversation_variable: requested-revision-conversation
  input_variable: lane-context
  output_variable: requested-revision-result
- id: accept-requested-module-revision
  kind: invoke_tool
  tool: accept-requested-module-revision
  input_variables:
    context: lane-context
    result: requested-revision-result
  output_variable: lane-context
- id: review-requested-revision
  kind: goto
  target: prepare-current-module-review
- id: module-lane-retries-preflight-revision
  kind: invoke_tool
  tool: module-lane-retries-preflight-revision
  input_variable: lane-context
  output_variable: should-retry-module-preflight-revision
- id: choose-module-lane-retry
  kind: if
  condition:
    variable: should-retry-module-preflight-revision
    operator: truthy
  then: retry-module-preflight-revision-conversation
  otherwise: module-lane-has-deferred-main-exception
- id: retry-module-preflight-revision-conversation
  kind: create_conversation
  agent: "{author_id}"
  conversation_key: "{revision_conversation_key}"
  mode: run
  output_variable: retried-module-preflight-revision-conversation
- id: retry-current-module-preflight-revision
  kind: invoke_agent
  agent: "{author_id}"
  task: "{revision_task_id}"
  conversation_variable: retried-module-preflight-revision-conversation
  input_variable: lane-context
  output_variable: retried-module-preflight-revision-agent-result
- id: accept-retried-module-preflight-revision
  kind: invoke_tool
  tool: accept-current-module-preflight-revision
  input_variables:
    context: lane-context
    result: retried-module-preflight-revision-agent-result
  output_variable: lane-context
- id: module-preflight-revision-needs-recheck
  kind: invoke_tool
  tool: module-preflight-revision-needs-recheck
  input_variable: lane-context
  output_variable: should-resume-module-recheck
- id: choose-module-preflight-revision-return
