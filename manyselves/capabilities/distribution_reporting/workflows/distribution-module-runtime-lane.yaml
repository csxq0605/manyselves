id: distribution-module-runtime-lane
version: 1.0.0
description: Reusable production module Lane bound to current Reporting behavior
tasks:
- module-2.1-authoring
- module-2.2-authoring
- module-2.3-authoring
- module-2.4-authoring
- module-2.5-authoring
- module-runtime-initial-review
- module-runtime-recheck
- module-2.1-runtime-revision
- module-2.2-runtime-revision
- module-2.3-runtime-revision
- module-2.4-runtime-revision
- module-2.5-runtime-revision
gates: []
recovery:
- current-reporting-recovery
input_contract: reporting_tail_state
output_contract: declarative_module_lane_outcome
parameters:
- module_id
- author_id
- author_task_id
- author_conversation_key
- auditor_conversation_key
- revision_task_id
- revision_conversation_key
state:
  reporting-state: {}
  module-id: "{module_id}"
actions:
- id: start-current-module-lane
  kind: invoke_tool
  tool: start-current-module-lane
  input_variables:
    state: reporting-state
    module_id: module-id
  output_variable: lane-context
- id: prepare-current-module-authoring
  kind: invoke_tool
  tool: prepare-current-module-authoring
  input_variable: lane-context
  output_variable: lane-context
- id: module-authoring-requires-agent
  kind: invoke_tool
  tool: module-authoring-requires-agent
  input_variable: lane-context
  output_variable: should-invoke-module-author
- id: choose-module-authoring-source
  kind: if
  condition:
    variable: should-invoke-module-author
    operator: truthy
  then: create-module-author-conversation
  otherwise: resume-current-module-authoring
- id: create-module-author-conversation
  kind: create_conversation
  agent: "{author_id}"
  conversation_key: "{author_conversation_key}"
  mode: run
  output_variable: module-author-conversation
- id: invoke-current-module-author
  kind: invoke_agent
  agent: "{author_id}"
  task: "{author_task_id}"
  conversation_variable: module-author-conversation
  input_variable: lane-context
  output_variable: module-author-result
- id: accept-current-module-authoring
  kind: invoke_tool
  tool: accept-current-module-authoring
  input_variables:
    context: lane-context
    result: module-author-result
  output_variable: lane-context
- id: continue-after-module-author
  kind: goto
  target: module-lane-can-review
- id: resume-current-module-authoring
  kind: invoke_tool
  tool: resume-current-module-authoring
  input_variable: lane-context
  output_variable: lane-context
- id: module-lane-can-review
  kind: invoke_tool
  tool: module-lane-can-review
  input_variable: lane-context
  output_variable: should-review-module-lane
- id: choose-module-lane-review
  kind: if
  condition:
    variable: should-review-module-lane
    operator: truthy
  then: prepare-current-module-review
  otherwise: complete-current-module-lane
- id: prepare-current-module-review
  kind: invoke_tool
  tool: prepare-current-module-review
  input_variable: lane-context
  output_variable: lane-context
- id: module-review-requires-agent
  kind: invoke_tool
  tool: module-review-requires-agent
  input_variable: lane-context
  output_variable: should-invoke-module-reviewer
- id: choose-module-review-source
  kind: if
  condition:
    variable: should-invoke-module-reviewer
    operator: truthy
  then: create-module-reviewer-conversation
  otherwise: continue-current-module-review
- id: create-module-reviewer-conversation
  kind: create_conversation
  agent: evidence-auditor
  conversation_key: "{auditor_conversation_key}"
  mode: run
  output_variable: module-reviewer-conversation
- id: invoke-current-module-reviewer
  kind: invoke_agent
  agent: evidence-auditor
  task: module-runtime-initial-review
  conversation_variable: module-reviewer-conversation
  input_variable: lane-context
  output_variable: module-review-agent-result
- id: accept-current-module-review
  kind: invoke_tool
  tool: accept-current-module-review
  input_variables:
    context: lane-context
    result: module-review-agent-result
  output_variable: lane-context
- id: continue-after-module-review
  kind: goto
  target: module-review-needs-revision
- id: module-review-needs-revision
  kind: invoke_tool
  tool: module-review-needs-revision
  input_variable: lane-context
  output_variable: should-revise-module
- id: choose-module-review-revision
  kind: if
  condition:
    variable: should-revise-module
    operator: truthy
  then: prepare-current-module-revision
  otherwise: continue-current-module-review
- id: prepare-current-module-revision
  kind: invoke_tool
  tool: prepare-current-module-revision
  input_variable: lane-context
  output_variable: lane-context
- id: create-module-revision-conversation
  kind: create_conversation
  agent: "{author_id}"
  conversation_key: "{revision_conversation_key}"
  mode: run
  output_variable: module-revision-conversation
- id: invoke-current-module-revision
  kind: invoke_agent
  agent: "{author_id}"
  task: "{revision_task_id}"
  conversation_variable: module-revision-conversation
  input_variable: lane-context
  output_variable: module-revision-agent-result
- id: accept-current-module-revision
  kind: invoke_tool
  tool: accept-current-module-revision
  input_variables:
    context: lane-context
    result: module-revision-agent-result
  output_variable: lane-context
- id: continue-after-module-revision
  kind: goto
  target: prepare-current-module-recheck
- id: prepare-current-module-recheck
  kind: invoke_tool
  tool: prepare-current-module-recheck
  input_variable: lane-context
  output_variable: lane-context
- id: module-recheck-requires-agent
  kind: invoke_tool
  tool: module-recheck-requires-agent
  input_variable: lane-context
  output_variable: should-invoke-module-recheck
- id: choose-module-recheck-source
  kind: if
  condition:
    variable: should-invoke-module-recheck
    operator: truthy
  then: create-module-recheck-conversation
  otherwise: continue-current-module-review
- id: create-module-recheck-conversation
  kind: create_conversation
  agent: evidence-auditor
  conversation_key: "{auditor_conversation_key}"
  mode: run
  output_variable: module-recheck-conversation
- id: invoke-current-module-recheck
  kind: invoke_agent
  agent: evidence-auditor
  task: module-runtime-recheck
  conversation_variable: module-recheck-conversation
  input_variable: lane-context
  output_variable: module-recheck-agent-result
- id: accept-current-module-recheck
  kind: invoke_tool
  tool: accept-current-module-recheck
  input_variables:
    context: lane-context
    result: module-recheck-agent-result
  output_variable: lane-context
- id: continue-after-module-recheck
  kind: goto
  target: continue-current-module-review
- id: continue-current-module-review
  kind: invoke_tool
  tool: continue-current-module-review
  input_variable: lane-context
  output_variable: lane-context
- id: complete-current-module-lane
  kind: invoke_tool
  tool: complete-current-module-lane
  input_variable: lane-context
  output_variable: lane-outcome
- id: finish-module-lane
  kind: end_workflow
  output_variable: lane-outcome
  output_name: result
