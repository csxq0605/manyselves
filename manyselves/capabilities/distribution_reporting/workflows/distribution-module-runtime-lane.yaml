- id: request-module-main-user-input
  kind: request_input
  interaction: module-main-exception-decision
  output_variable: module-main-exception-user-input
- id: apply-module-main-user-input
  kind: invoke_tool
  tool: apply-current-module-main-exception-user-input
  input_variables:
    context: lane-context
    input: module-main-exception-user-input
  output_variable: lane-context
- id: continue-after-module-main-user-input
  kind: goto
  target: route-current-module-after-main-exception
- id: route-current-module-after-main-exception
  kind: invoke_tool
  tool: route-current-module-after-main-exception
  input_variable: lane-context
  output_variable: lane-context
- id: continue-after-routing-module-main-exception
