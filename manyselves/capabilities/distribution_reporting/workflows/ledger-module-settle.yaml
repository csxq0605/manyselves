id: ledger-module-settle
version: 2.1.0
description: One judging group's review, the three lenses merged by row; the author revises only on blocking findings, the program checks the changed rows and the group's record coverage again, and sends them back while they still fail, at most twice
tasks:
- revise-judgments
recovery:
- typed-turn-recovery
output_contract: ledger_owner_result
state:
  item: null
  item_key: null
  revision: null
  second_revision: null
  third_revision: null
actions:
- id: lens-review
  kind: set_variable
  variable: review
  value_variable: item
  field: review
- id: merge
  kind: invoke_tool
  tool: merge-review-findings
  input_variables:
    item: item
    review: review
  output_variable: merged
- id: revise-needed
  kind: set_variable
  variable: revise
  value_variable: merged
  field: revise
- id: route
  kind: if
  condition:
    variable: revise
    operator: eq
    value: true
  then: resume-author
  otherwise: close
- id: resume-author
  kind: resolve_conversation
  agent: report-consultant
  conversation_key: author
  key_variable: item_key
  mode: run
  output_variable: author_conversation
- id: revision-input
  kind: set_variable
  variable: revision_input
  value_variable: merged
  field: revision_input
- id: revise
  kind: invoke_agent
  agent: report-consultant
  task: revise-judgments
  conversation_variable: author_conversation
  input_variable: revision_input
  output_variable: revision
# The program's row checks run again on the rows the revision changed.
- id: recheck
  kind: invoke_tool
  tool: recheck-judgments
  input_variables:
    item: item
    revision: revision
  output_variable: recheck
- id: recheck-blocking
  kind: set_variable
  variable: recheck_blocking
  value_variable: recheck
  field: blocking
- id: route-recheck
  kind: if
  condition:
    variable: recheck_blocking
    operator: eq
    value: true
  then: recheck-input
  otherwise: close
- id: recheck-input
  kind: set_variable
  variable: recheck_input
  value_variable: recheck
  field: revision_input
- id: revise-again
  kind: invoke_agent
  agent: report-consultant
  task: revise-judgments
  conversation_variable: author_conversation
  input_variable: recheck_input
  output_variable: second_revision
# The second revision is checked the same way, on both revisions together:
# a record either of them dropped goes back once more.
- id: recheck-again
  kind: invoke_tool
  tool: recheck-judgments
  input_variables:
    item: item
    revision: revision
    second_revision: second_revision
  output_variable: recheck_again
- id: recheck-again-blocking
  kind: set_variable
  variable: recheck_again_blocking
  value_variable: recheck_again
  field: blocking
- id: route-recheck-again
  kind: if
  condition:
    variable: recheck_again_blocking
    operator: eq
    value: true
  then: recheck-again-input
  otherwise: close
- id: recheck-again-input
  kind: set_variable
  variable: recheck_again_input
  value_variable: recheck_again
  field: revision_input
- id: revise-last
  kind: invoke_agent
  agent: report-consultant
  task: revise-judgments
  conversation_variable: author_conversation
  input_variable: recheck_again_input
  output_variable: third_revision
- id: close
  kind: invoke_tool
  tool: close-review
  input_variables:
    item: item
    merged: merged
    revision: revision
    second_revision: second_revision
    third_revision: third_revision
  output_variable: result
- id: finish
  kind: end_workflow
  output_variable: result
  output_name: result
