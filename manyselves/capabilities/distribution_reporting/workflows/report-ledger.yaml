id: report-ledger
version: 2.0.1
description: Judge into a ledger from object dossiers, link across modules, review through three lenses, plan the story lines, write once, then check and deliver
tasks:
- plan-storyline
recovery:
- typed-turn-recovery
input_contract: reporting_tool_input
input_variable: state
output_contract: distribution_reporting_output
state:
  revision: null
  context: {}
  ledger: {}
  final: {}
actions:
- id: prepare
  kind: invoke_tool
  tool: prepare-ledger-context
  input_variables:
    state: state
    revision: revision
  output_variable: context
# Each judge reads its own module's records, the other modules' records on
# the same objects and the project-level records, in a conversation of its own.
- id: judge-items
  kind: set_variable
  variable: judge_items
  value_variable: context
  field: judge_items
- id: judge-modules
  kind: map
  items_variable: judge_items
  key_field: module_id
  workflow: ledger-module-judgment
  key_input_variable: item_key
  output_variable: judgments
  max_concurrency: 5
- id: build-ledger
  kind: invoke_tool
  tool: build-judgment-ledger
  input_variables:
    context: context
    judgments: judgments
  output_variable: built
- id: link-items
  kind: set_variable
  variable: link_items
  value_variable: built
  field: link_items
# Photos are read again while the linker and the authors relate the rows:
# the choice of photos rests on the rows' own dispositions, not on relations.
- id: plan-reread
  kind: invoke_tool
  tool: plan-photo-reread
  input_variables:
    ledger: built
  output_variable: reread_plan
- id: reread-items
  kind: set_variable
  variable: reread_items
  value_variable: reread_plan
  field: reread_items
- id: relate-and-reread
  kind: parallel
  branches:
    relate: link-rows
    reread: reread-photos
  join: join-relate
  max_concurrency: 2
# The linker reads every flagged row in full (split by site when large);
# each author then confirms or declines its proposals next to what it saw.
- id: link-rows
  kind: map
  items_variable: link_items
  key_field: pack_id
  workflow: ledger-link
  key_input_variable: item_key
  output_variable: links
  max_concurrency: 6
- id: plan-relate
  kind: invoke_tool
  tool: plan-judgment-relate
  input_variables:
    context: context
    ledger: built
    links: links
  output_variable: relate_plan
- id: relate-items
  kind: set_variable
  variable: relate_items
  value_variable: relate_plan
  field: relate_items
- id: relate-modules
  kind: map
  items_variable: relate_items
  key_field: module_id
  workflow: ledger-module-relate
  key_input_variable: item_key
  output_variable: relations
  max_concurrency: 5
- id: relate-done
  kind: goto
  target: join-relate
- id: reread-photos
  kind: map
  items_variable: reread_items
  key_field: photo_id
  workflow: ledger-photo-reread
  key_input_variable: item_key
  output_variable: rereads
  errors_variable: reread_errors
  max_concurrency: 4
- id: reread-done
  kind: goto
  target: join-relate
- id: join-relate
  kind: join
  parallel: relate-and-reread
  inputs:
    relate: relations
    reread: rereads
  output_variable: related_and_reread
- id: relations-value
  kind: set_variable
  variable: relations
  value_variable: related_and_reread
  field: relate
- id: rereads-value
  kind: set_variable
  variable: rereads
  value_variable: related_and_reread
  field: reread
- id: apply-relations
  kind: invoke_tool
  tool: apply-judgment-relations
  input_variables:
    context: context
    ledger: built
    relations: relations
  output_variable: related
- id: apply-reread
  kind: invoke_tool
  tool: apply-photo-reread
  input_variables:
    ledger: related
    rereads: rereads
  output_variable: ledger
# Three lenses, each in conversations of their own: every module's rows with
# what they cite, objects several modules judged, and the relations.
- id: plan-review
  kind: invoke_tool
  tool: plan-judgment-review
  input_variables:
    context: context
    ledger: ledger
  output_variable: review_plan
- id: review-items
  kind: set_variable
  variable: review_items
  value_variable: review_plan
  field: review_items
- id: object-items
  kind: set_variable
  variable: object_items
  value_variable: review_plan
  field: object_items
- id: relation-items
  kind: set_variable
  variable: relation_items
  value_variable: review_plan
  field: relation_items
- id: review-lenses
  kind: parallel
  branches:
    modules: review-modules
    objects: review-objects
    relations: review-relations
  join: join-review
  max_concurrency: 3
- id: review-modules
  kind: map
  items_variable: review_items
  key_field: module_id
  workflow: ledger-module-review
  key_input_variable: item_key
  output_variable: module_reviews
  max_concurrency: 5
  # Every module's review opens with the same conflict dossiers; the first
  # goes ahead so the others can reuse that cached prefix.
  lead_seconds: 30
- id: modules-done
  kind: goto
  target: join-review
- id: review-objects
  kind: map
  items_variable: object_items
  key_field: batch_id
  workflow: ledger-object-review
  key_input_variable: item_key
  output_variable: object_reviews
  max_concurrency: 6
- id: objects-done
  kind: goto
  target: join-review
- id: review-relations
  kind: map
  items_variable: relation_items
  key_field: batch_id
  workflow: ledger-relation-review
  key_input_variable: item_key
  output_variable: relation_reviews
  max_concurrency: 6
- id: relations-done
  kind: goto
  target: join-review
- id: join-review
  kind: join
  parallel: review-lenses
  inputs:
    modules: module_reviews
    objects: object_reviews
    relations: relation_reviews
  output_variable: lens_reviews
- id: module-reviews-value
  kind: set_variable
  variable: module_reviews
  value_variable: lens_reviews
  field: modules
- id: object-reviews-value
  kind: set_variable
  variable: object_reviews
  value_variable: lens_reviews
  field: objects
- id: relation-reviews-value
  kind: set_variable
  variable: relation_reviews
  value_variable: lens_reviews
  field: relations
- id: gather-reviews
  kind: invoke_tool
  tool: gather-judgment-reviews
  input_variables:
    plan: review_plan
    ledger: ledger
    module_reviews: module_reviews
    object_reviews: object_reviews
    relation_reviews: relation_reviews
  output_variable: gathered
- id: settle-items
  kind: set_variable
  variable: settle_items
  value_variable: gathered
  field: settle_items
- id: settle-modules
  kind: map
  items_variable: settle_items
  key_field: module_id
  workflow: ledger-module-settle
  key_input_variable: item_key
  output_variable: reviews
  max_concurrency: 5
- id: finalize-ledger
  kind: invoke_tool
  tool: finalize-judgment-ledger
  input_variables:
    context: context
    ledger: ledger
    reviews: reviews
  output_variable: settled
# The story lines are settled before any prose, so each section carries its
# end of a cross-module line and the chief starts from the same lines.
- id: story-input
  kind: set_variable
  variable: story_input
  value_variable: settled
  field: story_input
- id: open-story
  kind: create_conversation
  agent: report-consultant
  conversation_key: story
  mode: run
  output_variable: story_conversation
- id: plan-story
  kind: invoke_agent
  agent: report-consultant
  task: plan-storyline
  conversation_variable: story_conversation
  input_variable: story_input
  output_variable: story
- id: apply-story
  kind: invoke_tool
  tool: apply-story-lines
  input_variables:
    ledger: settled
    story: story
  output_variable: final
- id: writing-items
  kind: set_variable
  variable: writing_items
  value_variable: final
  field: writing_items
- id: draft
  kind: parallel
  branches:
    writing: write-modules
    chief: chief-summary
  join: join-draft
  max_concurrency: 2
- id: write-modules
  kind: map
  items_variable: writing_items
  key_field: group_id
  workflow: ledger-module-writing
  key_input_variable: item_key
  output_variable: written
  max_concurrency: 8
# Module sections are checked and edited while the chief writes; the chief's
# own edit pass runs inside ledger-chief, before its fact check.
- id: check-report
  kind: invoke_tool
  tool: check-report
  input_variables:
    ledger: final
    written: written
  output_variable: checked
- id: edit-items
  kind: set_variable
  variable: edit_items
  value_variable: checked
  field: edit_items
- id: edit-pass
  kind: map
  items_variable: edit_items
  key_field: owner
  workflow: ledger-edit-pass
  key_input_variable: item_key
  output_variable: edits
  max_concurrency: 8
- id: writing-done
  kind: goto
  target: join-draft
- id: chief-summary
  kind: subworkflow
  workflow: ledger-chief
  input_variables:
    final: final
    context: context
  output_variable: chief
- id: chief-done
  kind: goto
  target: join-draft
- id: join-draft
  kind: join
  parallel: draft
  inputs:
    writing: edits
    chief: chief
  output_variable: drafts
- id: module-edits
  kind: set_variable
  variable: edits
  value_variable: drafts
  field: writing
- id: chief-outputs
  kind: set_variable
  variable: chief_outputs
  value_variable: drafts
  field: chief
- id: compose
  kind: invoke_tool
  tool: compose-report
  input_variables:
    state: state
    ledger: final
    chief: chief_outputs
    edits: edits
    reviews: reviews
  output_variable: delivered
- id: finish
  kind: end_workflow
  output_variable: delivered
  output_name: result
