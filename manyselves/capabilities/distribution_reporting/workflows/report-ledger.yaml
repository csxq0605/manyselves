id: report-ledger
version: 5.0.0
description: Judge into a ledger, each author relating its rows right after; review the modules, the shared objects and the cross-module relations at once, the cross-module review proposing what the authors missed; settle findings and proposals per group in one revision; write once; edit and fact-check the same draft at once, the chief fixing once and each writer revising once
tasks: []
recovery:
- typed-turn-recovery
input_contract: reporting_tool_input
input_variable: state
output_contract: distribution_reporting_output
state:
  revision: null
  context: {}
  ledger: {}
  final: {}
actions:
- id: prepare
  kind: invoke_tool
  tool: prepare-ledger-context
  input_variables:
    state: state
    revision: revision
  output_variable: context
# Each judge reads its own module's records, the other modules' records on
# the same objects and the project-level records, in a conversation of its own.
- id: judge-items
  kind: set_variable
  variable: judge_items
  value_variable: context
  field: judge_items
- id: judge-modules
  kind: map
  items_variable: judge_items
  key_field: group_id
  workflow: ledger-module-judgment
  key_input_variable: item_key
  output_variable: judgments
  max_concurrency: 5
  lead_seconds: 5
- id: build-ledger
  kind: invoke_tool
  tool: build-judgment-ledger
  input_variables:
    context: context
    judgments: judgments
  output_variable: built
- id: own-items
  kind: set_variable
  variable: own_items
  value_variable: built
  field: relate_items
# Each author relates its rows right after judging, in its judging
# conversation, to the rows on its objects and the same room's flagged rows.
- id: plan-relate
  kind: invoke_tool
  tool: plan-judgment-relate
  input_variables:
    context: context
    ledger: built
    own_items: own_items
  output_variable: relate_plan
- id: relate-items
  kind: set_variable
  variable: relate_items
  value_variable: relate_plan
  field: relate_items
# Photos are read again while the rows are related: the choice of photos
# rests on the rows' own dispositions, not on relations.
- id: plan-reread
  kind: invoke_tool
  tool: plan-photo-reread
  input_variables:
    ledger: built
  output_variable: reread_plan
- id: reread-items
  kind: set_variable
  variable: reread_items
  value_variable: reread_plan
  field: reread_items
- id: relate-and-reread
  kind: parallel
  branches:
    relate: relate-groups
    reread: reread-photos
  join: join-relate
  max_concurrency: 2
- id: relate-groups
  kind: map
  items_variable: relate_items
  key_field: group_id
  workflow: ledger-module-relate
  key_input_variable: item_key
  output_variable: own_relations
  max_concurrency: 8
- id: relate-done
  kind: goto
  target: join-relate
- id: reread-photos
  kind: map
  items_variable: reread_items
  key_field: photo_id
  workflow: ledger-photo-reread
  key_input_variable: item_key
  output_variable: rereads
  errors_variable: reread_errors
  max_concurrency: 4
- id: reread-done
  kind: goto
  target: join-relate
- id: join-relate
  kind: join
  parallel: relate-and-reread
  inputs:
    relate: own_relations
    reread: rereads
  output_variable: related_and_reread
- id: own-relations-value
  kind: set_variable
  variable: own_relations
  value_variable: related_and_reread
  field: relate
- id: rereads-value
  kind: set_variable
  variable: rereads
  value_variable: related_and_reread
  field: reread
- id: apply-relations
  kind: invoke_tool
  tool: apply-judgment-relations
  input_variables:
    context: context
    ledger: built
    own: own_relations
  output_variable: related
- id: apply-reread
  kind: invoke_tool
  tool: apply-photo-reread
  input_variables:
    ledger: related
    rereads: rereads
  output_variable: ledger
# Three reviews at once: each module's rows with what they cite; the objects
# several modules judged; and the cross-module review, which checks the
# relations and proposes the ones the authors missed.  Every batch map sends
# its first request alone, so the others reuse the opening it sent.
- id: plan-review
  kind: invoke_tool
  tool: plan-judgment-review
  input_variables:
    context: context
    ledger: ledger
  output_variable: review_plan
- id: review-items
  kind: set_variable
  variable: review_items
  value_variable: review_plan
  field: review_items
- id: object-items
  kind: set_variable
  variable: object_items
  value_variable: review_plan
  field: object_items
- id: cross-items
  kind: set_variable
  variable: cross_items
  value_variable: review_plan
  field: cross_items
- id: review-lenses
  kind: parallel
  branches:
    modules: review-modules
    objects: review-objects
    cross: review-cross
  join: join-review
  max_concurrency: 3
- id: review-modules
  kind: map
  items_variable: review_items
  key_field: module_id
  workflow: ledger-module-review
  key_input_variable: item_key
  output_variable: module_reviews
  max_concurrency: 5
  lead_seconds: 5
- id: modules-done
  kind: goto
  target: join-review
- id: review-objects
  kind: map
  items_variable: object_items
  key_field: batch_id
  workflow: ledger-object-review
  key_input_variable: item_key
  output_variable: object_reviews
  max_concurrency: 6
  lead_seconds: 5
- id: objects-done
  kind: goto
  target: join-review
- id: review-cross
  kind: map
  items_variable: cross_items
  key_field: batch_id
  workflow: ledger-cross-review
  key_input_variable: item_key
  output_variable: cross_reviews
  max_concurrency: 12
  lead_seconds: 5
- id: cross-done
  kind: goto
  target: join-review
- id: join-review
  kind: join
  parallel: review-lenses
  inputs:
    modules: module_reviews
    objects: object_reviews
    cross: cross_reviews
  output_variable: lens_reviews
- id: module-reviews-value
  kind: set_variable
  variable: module_reviews
  value_variable: lens_reviews
  field: modules
- id: object-reviews-value
  kind: set_variable
  variable: object_reviews
  value_variable: lens_reviews
  field: objects
- id: cross-reviews-value
  kind: set_variable
  variable: cross_reviews
  value_variable: lens_reviews
  field: cross
# The findings merged by row, and the proposals that stand, go to the
# authors: each settles both in one revision.
- id: gather-reviews
  kind: invoke_tool
  tool: gather-judgment-reviews
  input_variables:
    plan: review_plan
    ledger: ledger
    module_reviews: module_reviews
    object_reviews: object_reviews
    cross_reviews: cross_reviews
  output_variable: gathered
- id: settle-items
  kind: set_variable
  variable: settle_items
  value_variable: gathered
  field: settle_items
- id: settle-modules
  kind: map
  items_variable: settle_items
  key_field: group_id
  workflow: ledger-module-settle
  key_input_variable: item_key
  output_variable: reviews
  max_concurrency: 5
- id: finalize-ledger
  kind: invoke_tool
  tool: finalize-judgment-ledger
  input_variables:
    context: context
    ledger: ledger
    reviews: reviews
  output_variable: settled
# The story lines are the relations that hold, joined by the program, settled
# before any prose so each section carries its end of a line and the chief
# starts from the same lines.
- id: apply-story
  kind: invoke_tool
  tool: apply-story-lines
  input_variables:
    ledger: settled
  output_variable: final
- id: writing-items
  kind: set_variable
  variable: writing_items
  value_variable: final
  field: writing_items
- id: draft
  kind: parallel
  branches:
    writing: write-modules
    chief: chief-summary
  join: join-draft
  max_concurrency: 2
- id: write-modules
  kind: map
  items_variable: writing_items
  key_field: group_id
  workflow: ledger-module-writing
  key_input_variable: item_key
  output_variable: written
  max_concurrency: 8
  lead_seconds: 5
# Module sections are checked and edited while the chief writes; the chief's
# chapters are checked by the program and the fact check inside ledger-chief.
- id: check-report
  kind: invoke_tool
  tool: check-report
  input_variables:
    ledger: final
    written: written
  output_variable: checked
- id: edit-items
  kind: set_variable
  variable: edit_items
  value_variable: checked
  field: edit_items
- id: edit-pass
  kind: map
  items_variable: edit_items
  key_field: owner
  workflow: ledger-edit-pass
  key_input_variable: item_key
  output_variable: edits
  max_concurrency: 8
  lead_seconds: 5
- id: writing-done
  kind: goto
  target: join-draft
- id: chief-summary
  kind: subworkflow
  workflow: ledger-chief
  input_variables:
    final: final
    context: context
  output_variable: chief
- id: chief-done
  kind: goto
  target: join-draft
- id: join-draft
  kind: join
  parallel: draft
  inputs:
    writing: edits
    chief: chief
  output_variable: drafts
- id: module-edits
  kind: set_variable
  variable: edits
  value_variable: drafts
  field: writing
- id: chief-checked
  kind: set_variable
  variable: chief_checked
  value_variable: drafts
  field: chief
- id: row-fix-items
  kind: set_variable
  variable: row_fix_items
  value_variable: chief_checked
  field: row_fix_items
# The chief fixes chapters 1 and 3 once while the authors fix the rows that
# carry the same errors; then each writer revises once, on the editor's
# findings and the sections resting on the fixed rows.
- id: finish-draft
  kind: parallel
  branches:
    chief: chief-finish
    rows: fix-rows
  join: join-finish
  max_concurrency: 2
- id: chief-finish
  kind: subworkflow
  workflow: ledger-chief-finish
  input_variables:
    final: final
    context: context
    checked: chief_checked
  output_variable: chief_outputs
- id: chief-finish-done
  kind: goto
  target: join-finish
- id: fix-rows
  kind: map
  items_variable: row_fix_items
  key_field: group_id
  workflow: ledger-row-fix
  key_input_variable: item_key
  output_variable: row_fixes
  max_concurrency: 5
- id: apply-row-fixes
  kind: invoke_tool
  tool: apply-row-fixes
  input_variables:
    ledger: final
    fixes: row_fixes
    edits: edits
  output_variable: row_fixed
- id: section-revise-items
  kind: set_variable
  variable: section_revise_items
  value_variable: row_fixed
  field: section_revise_items
- id: revise-sections
  kind: map
  items_variable: section_revise_items
  key_field: owner
  workflow: ledger-section-revise
  key_input_variable: item_key
  output_variable: section_revisions
  max_concurrency: 8
- id: merge-section-revisions
  kind: invoke_tool
  tool: merge-section-fixes
  input_variables:
    edits: edits
    fixes: section_revisions
  output_variable: merged_edits
- id: rows-result
  kind: set_variable
  variable: rows_result
  value_variables:
    fixed: row_fixed
    merged: merged_edits
    row_fixes: row_fixes
- id: rows-done
  kind: goto
  target: join-finish
- id: join-finish
  kind: join
  parallel: finish-draft
  inputs:
    chief: chief_outputs
    rows: rows_result
  output_variable: finished
- id: chief-outputs
  kind: set_variable
  variable: chief_outputs
  value_variable: finished
  field: chief
- id: rows-value
  kind: set_variable
  variable: rows_result
  value_variable: finished
  field: rows
- id: fixed-value
  kind: set_variable
  variable: row_fixed
  value_variable: rows_result
  field: fixed
- id: fixed-ledger
  kind: set_variable
  variable: final
  value_variable: row_fixed
  field: ledger
- id: merged-value
  kind: set_variable
  variable: merged_edits
  value_variable: rows_result
  field: merged
- id: merged-edits
  kind: set_variable
  variable: edits
  value_variable: merged_edits
  field: edits
- id: compose
  kind: invoke_tool
  tool: compose-report
  input_variables:
    state: state
    ledger: final
    chief: chief_outputs
    edits: edits
    reviews: reviews
  output_variable: delivered
- id: finish
  kind: end_workflow
  output_variable: delivered
  output_name: result
