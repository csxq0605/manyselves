id: report-ledger
version: 1.3.0
description: Judge into a ledger first, relate across modules, review each row with what it cites, write once, then check and deliver
tasks:
- read-project
- read-ledger
recovery:
- typed-turn-recovery
input_contract: reporting_tool_input
input_variable: state
output_contract: distribution_reporting_output
state:
  revision: null
  context: {}
  ledger: {}
  final: {}
actions:
- id: prepare
  kind: invoke_tool
  tool: prepare-ledger-context
  input_variables:
    state: state
    revision: revision
  output_variable: context
- id: shared-context
  kind: set_variable
  variable: shared
  value_variable: context
  field: shared
- id: open-shared
  kind: create_conversation
  agent: report-consultant
  conversation_key: shared
  mode: run
  output_variable: shared_conversation
- id: read-project
  kind: invoke_agent
  agent: report-consultant
  task: read-project
  conversation_variable: shared_conversation
  input_variable: shared
  output_variable: project_reading
- id: module-briefs
  kind: set_variable
  variable: modules
  value_variable: context
  field: modules
- id: judge-modules
  kind: map
  items_variable: modules
  key_field: module_id
  workflow: ledger-module-judgment
  key_input_variable: item_key
  input_variables:
    shared_conversation: shared_conversation
  output_variable: judgments
  max_concurrency: 5
- id: build-ledger
  kind: invoke_tool
  tool: build-judgment-ledger
  input_variables:
    context: context
    judgments: judgments
  output_variable: built
- id: relate-items
  kind: set_variable
  variable: relate_items
  value_variable: built
  field: relate_items
# Photos are read again while the authors relate their rows: the choice of
# photos rests on the rows' own dispositions, not on the relations.
- id: plan-reread
  kind: invoke_tool
  tool: plan-photo-reread
  input_variables:
    ledger: built
  output_variable: reread_plan
- id: reread-items
  kind: set_variable
  variable: reread_items
  value_variable: reread_plan
  field: reread_items
- id: relate-and-reread
  kind: parallel
  branches:
    relate: relate-modules
    reread: reread-photos
  join: join-relate
  max_concurrency: 2
- id: relate-modules
  kind: map
  items_variable: relate_items
  key_field: module_id
  workflow: ledger-module-relate
  key_input_variable: item_key
  output_variable: relations
  max_concurrency: 5
- id: relate-done
  kind: goto
  target: join-relate
- id: reread-photos
  kind: map
  items_variable: reread_items
  key_field: photo_id
  workflow: ledger-photo-reread
  key_input_variable: item_key
  output_variable: rereads
  errors_variable: reread_errors
  max_concurrency: 4
- id: reread-done
  kind: goto
  target: join-relate
- id: join-relate
  kind: join
  parallel: relate-and-reread
  inputs:
    relate: relations
    reread: rereads
  output_variable: related_and_reread
- id: relations-value
  kind: set_variable
  variable: relations
  value_variable: related_and_reread
  field: relate
- id: rereads-value
  kind: set_variable
  variable: rereads
  value_variable: related_and_reread
  field: reread
- id: apply-relations
  kind: invoke_tool
  tool: apply-judgment-relations
  input_variables:
    context: context
    ledger: built
    relations: relations
  output_variable: related
- id: apply-reread
  kind: invoke_tool
  tool: apply-photo-reread
  input_variables:
    ledger: related
    rereads: rereads
  output_variable: ledger
- id: ledger-snapshot
  kind: set_variable
  variable: ledger_snapshot
  value_variable: ledger
  field: snapshot
- id: open-review-base
  kind: fork_conversation
  source_variable: shared_conversation
  conversation_key: review-base
  mode: run
  output_variable: review_base
- id: read-ledger
  kind: invoke_agent
  agent: report-consultant
  task: read-ledger
  conversation_variable: review_base
  input_variable: ledger_snapshot
  output_variable: ledger_reading
- id: review-items
  kind: set_variable
  variable: review_items
  value_variable: ledger
  field: review_items
- id: review-modules
  kind: map
  items_variable: review_items
  key_field: module_id
  workflow: ledger-module-review
  key_input_variable: item_key
  output_variable: reviews
  max_concurrency: 5
- id: finalize-ledger
  kind: invoke_tool
  tool: finalize-judgment-ledger
  input_variables:
    context: context
    ledger: ledger
    reviews: reviews
  output_variable: final
- id: writing-items
  kind: set_variable
  variable: writing_items
  value_variable: final
  field: writing_items
- id: draft
  kind: parallel
  branches:
    writing: write-modules
    chief: chief-summary
  join: join-draft
  max_concurrency: 2
- id: write-modules
  kind: map
  items_variable: writing_items
  key_field: module_id
  workflow: ledger-module-writing
  key_input_variable: item_key
  output_variable: written
  max_concurrency: 5
# Module sections are checked and edited while the chief writes; the chief's
# own edit pass runs inside ledger-chief, before its fact check.
- id: check-report
  kind: invoke_tool
  tool: check-report
  input_variables:
    ledger: final
    written: written
  output_variable: checked
- id: edit-items
  kind: set_variable
  variable: edit_items
  value_variable: checked
  field: edit_items
- id: edit-pass
  kind: map
  items_variable: edit_items
  key_field: owner
  workflow: ledger-edit-pass
  key_input_variable: item_key
  input_variables:
    review_base: review_base
  output_variable: edits
  max_concurrency: 6
- id: writing-done
  kind: goto
  target: join-draft
- id: chief-summary
  kind: subworkflow
  workflow: ledger-chief
  input_variables:
    review_base: review_base
    final: final
    context: context
  output_variable: chief
- id: chief-done
  kind: goto
  target: join-draft
- id: join-draft
  kind: join
  parallel: draft
  inputs:
    writing: edits
    chief: chief
  output_variable: drafts
- id: module-edits
  kind: set_variable
  variable: edits
  value_variable: drafts
  field: writing
- id: chief-outputs
  kind: set_variable
  variable: chief_outputs
  value_variable: drafts
  field: chief
- id: compose
  kind: invoke_tool
  tool: compose-report
  input_variables:
    state: state
    ledger: final
    chief: chief_outputs
    edits: edits
    reviews: reviews
  output_variable: delivered
- id: finish
  kind: end_workflow
  output_variable: delivered
  output_name: result
