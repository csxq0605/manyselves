id: ledger-module-judgment
version: 1.1.0
description: One module's author judges its objects in a conversation of its own, from its materials
tasks:
- judge-module
recovery:
- typed-turn-recovery
output_contract: ledger_judgment_set
state:
  item: null
  item_key: null
actions:
- id: open-author
  kind: create_conversation
  agent: report-consultant
  conversation_key: author
  key_variable: item_key
  mode: run
  output_variable: author_conversation
- id: judge
  kind: invoke_agent
  agent: report-consultant
  task: judge-module
  conversation_variable: author_conversation
  input_variable: item
  output_variable: judgment
- id: finish
  kind: end_workflow
  output_variable: judgment
  output_name: result
