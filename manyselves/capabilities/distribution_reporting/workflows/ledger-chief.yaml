id: ledger-chief
version: 5.0.0
description: The chief merges actions and writes chapters 3 and 1 from the ledger; chapters 1 and 3 are fact-checked in small packets while the program checks their tables and text. The one fix and chapter 4 follow in ledger-chief-finish, while the authors fix the rows that carry the same errors
tasks:
- chief-chapter-3
- revise-chief-actions
- chief-chapter-1
recovery:
- typed-turn-recovery
output_contract: ledger_chief_checked
state:
  final: null
  context: null
  chief_key: chief
  # Chapter 1 reads the chief input already in the conversation.
  chief_followup:
    note: 依据同上：上文的总编资料、输入和你提交的第三章
actions:
- id: open-chief
  kind: create_conversation
  agent: report-consultant
  conversation_key: writer
  key_variable: chief_key
  mode: run
  output_variable: chief_conversation
- id: chief-input
  kind: set_variable
  variable: chief_input
  value_variable: final
  field: chief_input
- id: chapter-3
  kind: invoke_agent
  agent: report-consultant
  task: chief-chapter-3
  conversation_variable: chief_conversation
  input_variable: chief_input
  output_variable: chapter3
- id: check-3
  kind: invoke_tool
  tool: check-chief-tables
  input_variables:
    ledger: final
    chapter3: chapter3
  output_variable: check3
- id: blocking-3
  kind: set_variable
  variable: blocking3
  value_variable: check3
  field: blocking
- id: route-3
  kind: if
  condition:
    variable: blocking3
    operator: eq
    value: true
  then: revise-3
  otherwise: chapter-1
- id: revise-3
  kind: invoke_agent
  agent: report-consultant
  task: revise-chief-actions
  conversation_variable: chief_conversation
  input_variable: check3
  output_variable: chapter3
- id: chapter-1
  kind: invoke_agent
  agent: report-consultant
  task: chief-chapter-1
  conversation_variable: chief_conversation
  input_variable: chief_followup
  output_variable: chapter1
- id: check-1
  kind: invoke_tool
  tool: check-chief-tables
  input_variables:
    ledger: final
    chapter3: chapter3
    chapter1: chapter1
  output_variable: check1
# Chapter 1 is fact-checked as written; the program's findings on its
# tables join the fact check's, for the one fix.
- id: plan-facts
  kind: invoke_tool
  tool: plan-chief-facts
  input_variables:
    ledger: final
    chapter3: chapter3
    chapter1: chapter1
  output_variable: fact_plan
- id: fact-items
  kind: set_variable
  variable: fact_items
  value_variable: fact_plan
  field: fact_items
- id: fact-check
  kind: map
  items_variable: fact_items
  key_field: packet_id
  workflow: ledger-chief-fact-check
  key_input_variable: item_key
  output_variable: fact_results
  errors_variable: fact_errors
  max_concurrency: 32
  lead_seconds: 5
- id: apply-facts
  kind: invoke_tool
  tool: apply-chief-facts
  input_variables:
    packets: fact_items
    results: fact_results
    ledger: final
    chapter1: chapter1
    chapter3: chapter3
    check1: check1
  output_variable: fact_checks
- id: fact-check-value
  kind: set_variable
  variable: fact_check
  value_variable: fact_checks
  field: check
- id: fact-blocking
  kind: set_variable
  variable: fact_blocking
  value_variable: fact_checks
  field: blocking
- id: row-fix-items
  kind: set_variable
  variable: row_fix_items
  value_variable: fact_checks
  field: row_fix_items
- id: collect
  kind: set_variable
  variable: outputs
  value_variables:
    chapter1: chapter1
    chapter3: chapter3
    fact_check: fact_check
    fact_blocking: fact_blocking
    row_fix_items: row_fix_items
- id: finish
  kind: end_workflow
  output_variable: outputs
  output_name: result
