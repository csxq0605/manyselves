id: ledger-chief
version: 2.0.0
description: The chief merges actions and writes chapters 3, 1 and 4 from the ledger; chapters 1 and 3 are fact-checked in small packets, the program checks their text, and the chief fixes both in one turn
tasks:
- chief-chapter-3
- revise-chief-actions
- chief-chapter-1
- revise-chief-overview
- revise-chief-facts
- chief-chapter-4
recovery:
- typed-turn-recovery
output_contract: ledger_chief_outputs
state:
  final: null
  context: null
  chief_key: chief
  chapter4: null
  chief_fix: null
  # Chapter 1 reads the chief input already in the conversation.
  chief_followup:
    note: 依据同上：上文的总编资料、输入和你提交的第三章
actions:
- id: open-chief
  kind: create_conversation
  agent: report-consultant
  conversation_key: writer
  key_variable: chief_key
  mode: run
  output_variable: chief_conversation
- id: chief-input
  kind: set_variable
  variable: chief_input
  value_variable: final
  field: chief_input
- id: chapter-3
  kind: invoke_agent
  agent: report-consultant
  task: chief-chapter-3
  conversation_variable: chief_conversation
  input_variable: chief_input
  output_variable: chapter3
- id: check-3
  kind: invoke_tool
  tool: check-chief-tables
  input_variables:
    ledger: final
    chapter3: chapter3
  output_variable: check3
- id: blocking-3
  kind: set_variable
  variable: blocking3
  value_variable: check3
  field: blocking
- id: route-3
  kind: if
  condition:
    variable: blocking3
    operator: eq
    value: true
  then: revise-3
  otherwise: chapter-1
- id: revise-3
  kind: invoke_agent
  agent: report-consultant
  task: revise-chief-actions
  conversation_variable: chief_conversation
  input_variable: check3
  output_variable: chapter3
- id: chapter-1
  kind: invoke_agent
  agent: report-consultant
  task: chief-chapter-1
  conversation_variable: chief_conversation
  input_variable: chief_followup
  output_variable: chapter1
- id: check-1
  kind: invoke_tool
  tool: check-chief-tables
  input_variables:
    ledger: final
    chapter3: chapter3
    chapter1: chapter1
  output_variable: check1
- id: blocking-1
  kind: set_variable
  variable: blocking1
  value_variable: check1
  field: blocking
- id: route-1
  kind: if
  condition:
    variable: blocking1
    operator: eq
    value: true
  then: revise-1
  otherwise: plan-facts
- id: revise-1
  kind: invoke_agent
  agent: report-consultant
  task: revise-chief-overview
  conversation_variable: chief_conversation
  input_variable: check1
  output_variable: chapter1
- id: plan-facts
  kind: invoke_tool
  tool: plan-chief-facts
  input_variables:
    ledger: final
    chapter3: chapter3
    chapter1: chapter1
  output_variable: fact_plan
- id: fact-items
  kind: set_variable
  variable: fact_items
  value_variable: fact_plan
  field: fact_items
- id: fact-check
  kind: map
  items_variable: fact_items
  key_field: packet_id
  workflow: ledger-chief-fact-check
  key_input_variable: item_key
  output_variable: fact_results
  errors_variable: fact_errors
  max_concurrency: 32
- id: apply-facts
  kind: invoke_tool
  tool: apply-chief-facts
  input_variables:
    packets: fact_items
    results: fact_results
    ledger: final
    chapter1: chapter1
    chapter3: chapter3
  output_variable: fact_checks
- id: fact-check-value
  kind: set_variable
  variable: fact_check
  value_variable: fact_checks
  field: check
- id: fact-blocking
  kind: set_variable
  variable: fact_blocking
  value_variable: fact_checks
  field: blocking
- id: route-fact
  kind: if
  condition:
    variable: fact_blocking
    operator: eq
    value: true
  then: fix
  otherwise: apply-fix
# Chapters 1 and 3 are fixed in one turn of the chief, on the version checked;
# the answer holds only what changes.
- id: fix
  kind: invoke_agent
  agent: report-consultant
  task: revise-chief-facts
  conversation_variable: chief_conversation
  input_variable: fact_check
  output_variable: chief_fix
- id: apply-fix
  kind: invoke_tool
  tool: apply-chief-fix
  input_variables:
    ledger: final
    chapter1: chapter1
    chapter3: chapter3
    fix: chief_fix
  output_variable: draft
- id: settle-1
  kind: set_variable
  variable: chapter1
  value_variable: draft
  field: chapter1
- id: settle-3
  kind: set_variable
  variable: chapter3
  value_variable: draft
  field: chapter3
- id: settle-texts
  kind: set_variable
  variable: texts
  value_variable: draft
  field: texts
- id: settle-declined
  kind: set_variable
  variable: declined
  value_variable: draft
  field: declined
- id: topic-flag
  kind: set_variable
  variable: has_topic
  value_variable: context
  field: has_special_topic
- id: route-4
  kind: if
  condition:
    variable: has_topic
    operator: eq
    value: true
  then: topic-input
  otherwise: collect
- id: topic-input
  kind: set_variable
  variable: topic_input
  value_variable: context
  field: special_topic_input
- id: chapter-4
  kind: invoke_agent
  agent: report-consultant
  task: chief-chapter-4
  conversation_variable: chief_conversation
  input_variable: topic_input
  output_variable: chapter4
- id: collect
  kind: set_variable
  variable: outputs
  value_variables:
    chapter1: chapter1
    chapter3: chapter3
    chapter4: chapter4
    texts: texts
    fact_check: fact_check
    declined: declined
- id: finish
  kind: end_workflow
  output_variable: outputs
  output_name: result
