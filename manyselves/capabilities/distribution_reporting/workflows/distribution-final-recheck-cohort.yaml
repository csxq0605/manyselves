id: distribution-final-recheck-cohort
version: 1.0.0
description: File-defined affected-only parallel Join for Final Auditor recheck lanes
tasks:
- final-chapter-recheck
gates: []
recovery:
- current-reporting-recovery
input_contract: declarative_final_review_cycle_context
output_contract: declarative_final_review_cycle_context
state:
  review: {}
  chapter-id-1: "1"
  chapter-id-3: "3"
  chapter-id-4: "4"
  recheck-outcomes: {}
  completed-review-cycle: {}
actions:
- id: final-recheck-cohort
  kind: parallel
  branches:
    "1": execute-final-recheck-1
    "3": execute-final-recheck-3
    "4": execute-final-recheck-4
  join: join-final-recheck-cohort
  max_concurrency: 3
- id: execute-final-recheck-1
  kind: subworkflow
  workflow: distribution-final-recheck-1-lane
  input_variables:
    review: review
    chapter-id: chapter-id-1
  child_output_name: result
  output_variable: recheck-outcome-1
- id: complete-final-recheck-1-branch
  kind: goto
  target: join-final-recheck-cohort
- id: execute-final-recheck-3
  kind: subworkflow
  workflow: distribution-final-recheck-3-lane
  input_variables:
    review: review
    chapter-id: chapter-id-3
  child_output_name: result
  output_variable: recheck-outcome-3
- id: complete-final-recheck-3-branch
  kind: goto
  target: join-final-recheck-cohort
- id: execute-final-recheck-4
  kind: subworkflow
  workflow: distribution-final-recheck-4-lane
  input_variables:
    review: review
    chapter-id: chapter-id-4
  child_output_name: result
  output_variable: recheck-outcome-4
- id: complete-final-recheck-4-branch
  kind: goto
  target: join-final-recheck-cohort
- id: join-final-recheck-cohort
  kind: join
  parallel: final-recheck-cohort
  inputs:
    "1": recheck-outcome-1
    "3": recheck-outcome-3
    "4": recheck-outcome-4
  output_variable: recheck-outcomes
- id: reduce-final-recheck-cohort
  kind: invoke_tool
  tool: reduce-final-recheck-cohort
  input_variables:
    review: review
    outcomes: recheck-outcomes
  output_variable: completed-review-cycle
- id: finish-final-recheck-cohort
  kind: end_workflow
  output_variable: completed-review-cycle
  output_name: result
