id: distribution-observation-consolidation
version: 1.0.0
description: Joint review over per-object dossiers, then program consolidation of module judgments
tasks:
- cross-owner-review
recovery:
- current-reporting-recovery
input_contract: reporting_tail_state
output_contract: reporting_tail_state
state:
  reporting-state: {}
actions:
- id: build-joint-dossiers
  kind: invoke_tool
  tool: build-joint-dossiers
  input_variable: reporting-state
  output_variable: reporting-state
- id: run-joint-review
  kind: subworkflow
  workflow: distribution-cross-owner-cohort
  input_variables:
    reporting-state: reporting-state
  child_output_name: result
  output_variable: reporting-state
- id: consolidate-observation-ledger
  kind: invoke_tool
  tool: consolidate-observation-ledger
  input_variable: reporting-state
  output_variable: reporting-state
- id: finish-observation-consolidation
  kind: end_workflow
  output_variable: reporting-state
  output_name: result
