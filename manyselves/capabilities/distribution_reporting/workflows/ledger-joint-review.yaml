id: ledger-joint-review
version: 1.0.0
description: One writer's sections and the chapter 1 and 3 units on its rows, edited and fact-checked in one fresh conversation
tasks:
- review-joint
recovery:
- typed-turn-recovery
output_contract: ledger_grounded_findings
state:
  item: null
  item_key: null
actions:
- id: open-review
  kind: create_conversation
  agent: report-consultant
  conversation_key: joint-review
  key_variable: item_key
  mode: run
  output_variable: review_conversation
- id: joint-review
  kind: invoke_agent
  agent: report-consultant
  task: review-joint
  conversation_variable: review_conversation
  input_variable: item
  output_variable: findings
- id: finish
  kind: end_workflow
  output_variable: findings
  output_name: result
