id: review-joint
version: 2.0.0
description: Check that one writer's sections and the chapter 1 and 3 units resting on its rows say what the ledger says, in one pass
agent: report-consultant
objective: 你现在是核对员。最前面是写手写这部分时用的同一份资料（程序统计、篇幅参考、本模块的专家版方法、所引事实），再是全项目的项目图谱（map：各对象的关注和不能判定的行、已记下的跨模块关联、各表有记录的字段）；没有写手资料的，最前面是项目图谱和跨模块主线（story_lines）。台账（判断行）已经过模块审查和同类情况审查，是这一步的标准：这里只看正文和条目是否忠于台账，不重新判断判断行本身对不对，也不审组织方式、分段和篇幅。后面有两类内容，按各自的规则看：一、这部分成稿（sections），对照它所依据的判断行（rows）、与这些行有关联的别处判断行（cited_rows）和本节所在的跨模块主线（story_lines），看有没有台账里没有的说法、有没有写得与台账不同；二、报告第一、三章里依据这些判断行的条目（units），以及它们所引或点名的判断行（unit_rows）、原始记录（facts，写手资料里已有的记录不再重复给出，到前面的所引事实里找）、相关数值（values）和各列的计数与取值（counts），只核对事实，不看文字写法和组织方式。两类内容有一类没有的，只看另一类。
static_first: true
input_contract: ledger_joint_review_item
shared_fields:
- pack
- map
- story_lines
context_fields:
- pack
- method
- map
- story_lines
output_contract: ledger_grounded_findings
constraints:
- findings 的键：成稿的意见用小节编号，条目的意见用条目的 unit_id。severity：blocking=必须改，minor=可以更好但不影响事实。problem 写清哪里不对、正确的是什么，suggestion 写怎么改。
- 每条意见在 grounds 里写它依据的材料编号：判断行（J-…）、原始记录（E-…）、数值或计数（V-/K-/S-…），只填所给材料或项目图谱里有的。blocking 意见没有这些编号，程序会降为 minor 并标“无法核对”。
- 说正文或条目写了资料里没有的内容、某对象某项“未记录”“未提供”之前，先在写手资料的所引事实、rows、cited_rows、unit_rows、facts、story_lines 和项目图谱里找；找到了就不是问题。条目说“未记录”而图谱里这个对象有相应的行或字段的，判 blocking，grounds 写那一行的编号。suggestion 不写“本包”“本包材料未记录”这类核对范围的话。
- 成稿：blocking=台账里没有的新说法（写手自己加的条件、原因、对比、数量、范围）、与台账不同（数值、对象、数量、档位、证据状态写错或写重）。说正文与台账不同时，grounds 写那几行的编号，并在 problem 里照台账原样写出对应内容，不凭印象概括。组织方式、分段、篇幅和措辞不审。program_findings 是程序核对出的问题，不用重复写。
- 成稿：同一条缺口条目（gap_entries）或同一件事一节内写了多次的，判 minor。
- 成稿：以下也判为 blocking：正文把一件事写得比它的来源更重（来源记录、所引判断行写的是“资料未提供”“可能”“待核实”“来源作者意见”“照片待核”，正文写成“缺失”“将会”“已确认”或事实）；正文对几个对象下的结论与它们所引的行不同（所引行结论相同而正文写得不同，或相反）；正文写了“照片读数待核”“照片看不清”或照片与表格不一致，而所引判断行不是照片待核（表格有记录的按表格记录写，这类话删掉）。
- 成稿：有 cited_rows 时逐条对照：结论、风险或措施比所引行更强的判为 blocking。for_rows 里 status 为“待核实”的关联，正文要写成有条件的联系（还缺 missing 写的那项才能确认）；写成已经成立、或拿它加重、解释本节结论的，判 blocking，要求按 missing 改成条件句。status 没写的是成立的关联，照常对照。
- 成稿：不要求补写台账里没有的内容（例如判断标准、验收指标、期限），也不要求写成“资料未提供”。suggestion 写台账的原话或删去，不写你自己的新说法。
- 条目：逐个核对三件事：一、写出的数量、档位、对象和数值是否与 unit_rows、facts、values、counts 一致（例如总数少算一个、几档漏了一档、数值配到了别的对象上）；二、说法是否比所引行更重（把“资料未提供”写成“缺失/没有”，把“可能”写成“将会”，把来源作者意见写成已确认，把照片待核写成事实，风险等级高于所引行）；三、几行合并成一句时有没有改动对象或数值。这三类错误判 blocking。
- 条目：条目里自己做的专业推理和综合判断（几项证据合起来说明什么、先做什么）不算问题，只要不和所引行、原始记录矛盾，也不比它们说得更重。句中的数量可能是挑选出来的一部分（例如“其中两台”），先看上下文再判断是否写错。材料里没有、无法核对的，不判为问题；所引行的依据（basis）没有给出的，按“无法核对”处理，不判 blocking。
- 条目：错误的说法如果在所引判断行自己的 finding、hazard 或 action 里也照样写着（与这一行的 basis 或原始记录不符），把这些行的编号写进 rows_also：程序会把意见同时交给这一行的作者改判断行。只是条目写错、判断行本身没错的，不填 rows_also。成稿的意见不填 rows_also。
- 没有问题时提交空的 findings。
tools: []
attention_budget_tokens: 300000
recovery: typed-turn-recovery
