id: relate-judgments
version: 1.0.0
description: Decide which other modules' rows bear on this module's rows, before review
agent: report-consultant
objective: 五个模块都判断完了。flagged_elsewhere 是别的模块判为关注或不能判定的全部行，related 是别的模块对你这些对象的判断。看它们是否加重、解释或改变了你刚才提交的判断行的结论，按知识库的关联方法决定连不连。
input_contract: ledger_relation_input
output_contract: ledger_relation_set
context_fields:
- relation_method
constraints:
- relation_method 是知识库的跨知识单元关联方法，relation_names 是它列出的候选关系。flagged_elsewhere 每行一句（行编号 小节｜对象｜检查点（处置）：发现）；related 的键是本模块的行，值是别的模块对同一主体的判断，同一主体可能只是同一个房间或同一张表的同一行，不等于同一台设备。
- 只有能归到 relation_names 里某一条、且两边的事实能看出这条关系要核实的条件时才连，例如负荷率低可以排除过载致热，谐波可以加重变压器发热的后果。只是同一房间、同一次检查、同一个计划或制度的不连；条件核实不了就不连。
- relations 的键是本模块的判断行编号，值是这一行的关联，每条写：row_id（所引的别的模块的行）、relation（照抄 relation_names 里的名称）、reason（一句话：两边哪项事实满足条件，对本行结论有什么作用）。不连的行不写。
- 这一步只记关联，不改判断行本身；关联会交给审查核对理由。不替别的模块下结论，不复述它的论证。程序会删掉所引行不存在、属于本模块，或 relation 不在 relation_names 里的关联。
tools: []
recovery: typed-turn-recovery
