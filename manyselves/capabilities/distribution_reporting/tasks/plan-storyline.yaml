id: plan-storyline
version: 1.0.0
description: Settle the report's cross-module lines of evidence before any prose is written
agent: report-consultant
objective: 判断、关联和审查都已定下。你现在做主线规划：上面是项目图谱（含已审定的关联）；输入 rows 是全部关注和不能判定的判断行（basis 截短），object_chains 是同一对象被几个模块判断的证据链，same_observation 是同一单元格在几个小节的判断。找出全报告要贯穿的跨模块证据主线，交给各节撰稿人和总编。
input_contract: ledger_story_input
output_contract: ledger_story_plan
context_fields:
- map
constraints:
- 一条主线是几个模块的判断行合起来说明的一件事：例如几个视角相互印证同一问题、一处的数据排除了另一处的某种原因、一处的缺口使另一处的风险无法排除。只用已经记下的关联（图谱里“已记下的跨模块关联”）和同一对象上的几行判断，不新增关联、不新增事实。
- row_ids 至少两行、至少两个模块，按论证顺序排；conclusion 写这几行合起来能说明什么，措辞不强于链上最弱一行的 evidence_status（资料未提供不写成缺失，可能不写成将会，来源作者意见注明出处，照片待核不写成事实）。
- same_observation 的一组是同一条记录的几个视角，不当作相互印证。
- section_notes 可选，给链上某一节写这一端时的一句提示（引哪一端、标“详见 2.x.x”）。
- 合不出结论的不写；条数按实际，没有主线时提交空的 lines。
- title 和 conclusion 给读者看，不写编号、知识单元，也不写审查、台账、卷宗、关联这类流程用语。
tools: []
recovery: typed-turn-recovery
attention_budget_tokens: 200000
