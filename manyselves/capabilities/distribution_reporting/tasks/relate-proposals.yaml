id: relate-proposals
version: 1.0.0
description: Weigh the linker's proposals on this group's rows, each next to the other end's row and the facts it cites
agent: report-consultant
objective: 跨模块专员看过全部关注和不能判定的行，对你这些行提出了下面的关联。proposed 的键是本模块的行，值是对这一行的提议，每条带着另一端那一行的全文（other_row），facts 是另一端所引的事实原文。逐条按本次的实际情况判断：两边的事实确实满足这条关系要核实的条件，就写进 relations；不成立的写进 declined_proposals，一句理由。
input_contract: ledger_proposal_input
output_contract: ledger_relation_set
context_fields:
- facts
constraints:
- 专员只是提议，不因为是专员提的就采纳。判断用你自己的行、另一端的行（other_row）和 facts 里的原文；另一端的结论以它的行为准，不替别的模块下结论。
- relations 只写这一步新采纳的关联，你上一步已经连上的不再写。每条写：row_id（另一端的行编号）、relation（知识库的候选关系照抄 relation_names 里的名称；知识库未收录的自拟简短名称，并写 mechanism 和 condition）、reason（一句话：两边哪项事实满足条件，对本行结论有什么作用）。
- 两边的事实指向这条关系、但条件里有一项本次资料核实不了时，可以写成 status 为“待核实”，在 missing 写明还缺哪项条件、补充什么能确认；写不出缺什么的就写进 declined_proposals。
- 这一步只记关联，不改判断行本身；关联会交给审查核对理由。
tools: []
attention_budget_tokens: 250000
recovery: typed-turn-recovery
