id: chief-chapter-3
version: 1.0.0
description: Merge the ledger's actions into the 3.2 quick reference and write 3.1
agent: report-consultant
objective: 你现在是总编。依据判断台账（含 changed_rows 里返修后的行）写第三章：3.1 风险/问题汇总与概览，以及 3.2 改善行动速查表的结构化行。
input_contract: ledger_chief_input
output_contract: ledger_chief_chapter_3
constraints:
- 参考共享资料“专家版方法”里第三章的“章节综合”“写法”和“范例”。文字字段只写文字，不画表；表格由系统按结构化字段生成。
- actions 的每一行把同类行动归并成一条，row_ids 写它覆盖的全部判断行；action_row_ids 里的每一行都要被某条 action 覆盖一次。
- 优先级和时限沿用判断行给出的结果；合并时“发现问题”列全覆盖对象，不用其中一项代表全部。
- 第三章只有 3.1 和 3.2 两节，不另设下级小节。3.1 不重写第二章的论证，不写证据边界或口径说明。
- 合并行动时分别保留每个检查项目的对象集合和例外，不用其中一项的数量代表全部；房间、设备件数、资料项数各用各自的分母。未确认原因的对象安排核查，不写成已确认故障的修复；无需处理的对象不强行生成整改。
- 先后顺序只在有来源支持时写成硬性前置；同属管理改进或来自同一模块，不足以说明必须先做前一项。
- removed_row_ids 里的行已经删除，不再引用。
- 每条结论不能强于所引判断行的 evidence_status：资料未提供不写成缺失或没有，可能不写成将会，来源作者意见注明出处，照片待核不写成事实。摘要只引用第二章已定的结论，不复述论证。
tools: []
recovery: typed-turn-recovery