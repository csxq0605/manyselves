id: chief-chapter-3
version: 1.9.0
description: Merge the ledger's actions into the 3.2 quick reference and write 3.1
agent: report-consultant
objective: 你现在是总编。上面是委托与报告结构、程序统计、篇幅参考、第一章和第三章的专家版方法，以及项目图谱（各配电房、对象、各模块的关注和不能判定行、已审定的关联）。rows 是全部关注和不能判定的判断行（终版，basis 截短），module_counts 是各模块各种处置的行数，story_lines 是写正文前已定的跨模块主线。依据这些写第三章：3.1 风险/问题汇总与概览（两层，一行一项），以及 3.2 改善行动速查表每组的文字。
input_contract: ledger_chief_input
context_fields:
- assignment
- skill
- map
output_contract: ledger_chief_chapter_3
constraints:
- same_observation 里每一组是引用了同一条现场记录（同一张表的同一格）的几个小节的判断：它是一条记录、一个问题，只算一项、只写一个当前定级，可以说明它从几个角度看各意味着什么，但不写成几项缺陷，也不当作两条记录相互印证。
- 参考上面专家版方法里第三章的“章节综合”“写法”和“范例”。文字字段只写文字，不画表；表格由系统按结构化字段生成。
- 数量、档位和表格里的数值写占位符，由程序填值：value_slots 是台账层面的数量（各维度有问题、不能判定的对象数，行动项数）和各检查项的计数，事实和计算的占位符见上面的“程序统计”；不自己数，也不把几处的数合并成新的数量；数量占位符只填一个数字，量词接着写。其他数字照常写。
- action_groups 是程序按优先级和检查项分好、排好的行动组（组编号、优先级、检查项、覆盖的判断行、对象、措施、时限）。actions 里每组写一条，group_id 照抄；组的划分、先后和优先级由程序定，不改。
- 时限沿用判断行给出的结果；一组里判断行的时限不止一种时，在 interim 写明几项措施的先后，以及最晚的一项完成前、期间（例如下一次作业）按什么做，每项措施用它所在判断行的时限，不合并成区间、不另定期限，程序会核对这一格写了没有、写的时限是不是组内判断行给的；组内时限只有一种时 interim 留空。“发现问题”覆盖本组全部对象，不用其中一项代表全部；“风险与危害”写成“若〈条件〉，可能〈后果〉”，条件取自所引行的 hazard_conditions。
- 第三章只有 3.1 和 3.2 两节，不另设下级小节。3.1 不重写第二章的论证，不写证据边界或口径说明。
- 3.1 分两层：risk_summary 是“风险汇总如下”的条目，risk_details 是“详述见下”按评估维度列的要点；两层都是每条一句、一行。每条风险写成“现状 → 后果”：现状取自所引判断行，后果取自该行的 hazard；不能判定的行写缺什么资料、因此哪项风险还无法排除。
- 不写审查、卷宗、台账、返修等流程用语，也不写免责句。
- 一组里有几种措施时分别写清各自的对象，不用其中一项代表全部；房间、设备件数、资料项数各用各自的分母。未确认原因的对象安排核查，不写成已确认故障的修复。
- 先后顺序只在有来源支持时写成硬性前置；同属管理改进或来自同一模块，不足以说明必须先做前一项。
- 3.1 要有取舍：先写为什么这几项要优先处理（风险等级、影响范围、证据是否相互印证），多项证据合起来支持什么明确判断就直接写，指出哪项复测或补充检查的结果会改变处理方案。来源和限制集中写在相关条目或备注里一次，不逐条重复“待核实”“资料未提供”。
- object_chains 是程序挑出的对象证据链：同一对象被两个以上模块判断、至少一条有问题或不能判定。level 是程序按表格结构给的对象层级：“同一记录行”是表中同一行记录的同一设备单元；“同一对象名称”只说明名称相同，可能是同一设备单元，也可能只是同一配电场所的同名条目，措辞按层级写（例如“同一设备单元”“同一配电场所”），不写成“同一柜”。逐条看所列判断行（内容见 rows），能合起来说明问题的写一条 cross_findings：几个视角相互印证、哪些原因可以排除、共同指向什么、先做什么。只能由所引行推出，不新增事实或结论，措辞不强于所引行。合不出结论的对象不写。
- story_lines 是主线规划已定的跨模块证据链，第二章各节已按它交代；cross_findings 先从这些主线写起，再看 object_chains 里还有没有合得出结论的对象。
- 每条 cross_findings 的 conclusion 一句、一行，程序把它作为“风险汇总”的一条写进 3.1（前面加 subject），risk_summary 里不再重写。同一种叠加（例如同样两项缺陷）出现在几个对象上时合成一条，subject 列出这几个对象，不按对象重复写。理由只用所引判断行写着的事实，不加行里没有的说法。
- unresolved_conflicts 是返修后仍然冲突的事实：在 risk_summary 里各写一条，如实写明两边结论不一致、需要核实，不替任何一边下结论。
- gap_entries 是程序合并好的资料缺口，一条一项：rows 里不能判定行的 gap 只给 gap_id，内容见 gap_entries。写到缺口时按条目写，用它的 wording 和 objects，与第二章说法一致；同一条缺口在本章只写一次，不逐对象、逐行重复。只有 wording 里有“未提供”的条目才写“未提供”，其他条目按 wording 写“未填写”“有记录读数，缺判定所需的参数”等，不换成别的说法；条目带 affects 的，写这条缺口时可以一并说明还影响哪几处判断。same_room 是同一配电房里分属不同专题、各自成立的问题（每个配电房一项，列出行号）：它们不是互相加重的关联，安排措施时可以按配电房合并整改和验收，但不要写成一处问题加重另一处。
- 每条结论不能强于所引判断行的 evidence_status：资料未提供不写成缺失或没有，可能不写成将会，来源作者意见注明出处，照片待核不写成事实。摘要只引用第二章已定的结论，不复述论证。
tools: []
attention_budget_tokens: 200000
recovery: typed-turn-recovery