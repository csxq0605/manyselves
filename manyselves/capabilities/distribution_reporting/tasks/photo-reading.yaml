id: photo-reading
version: 1.0.0
description: Copy what one project photo shows, given where it sits in the table
agent: photo-reader
objective: 看这张现场照片，把图中能看到的字符和内容照原样抄下来。是否与表格记录相符由程序比对，你不用判断。
input_contract: photo_reading_input
output_contract: photo_reading_submission
image:
  path_field: photo_path
  media_type_field: media_type
constraints:
- 先看 photo_sheet、photo_cell、column_header 和 records：这张图附在表格哪一行、哪一列，这一列为什么附图（例如超过某个值才附图）。据此知道该在图里找什么，但抄写只写图中实际可见的字符，不把记录里的值当成图中读数。
- transcription 逐项抄写：屏幕或仪表上的读数和符号、铭牌、标签、记录表各栏（空白栏也抄，text 写空）。每项标 legible；不能确定的字符写 legible=false，不要猜。
- photo_date 写照片水印或屏幕上显示的日期时间，原样照抄；没有就不填。
- visible 用一两句话写照片拍的是什么设备、什么部位、可见状态。不推测看不到的部分，不引用标准，不下合格或不合格的结论。
- 照片看不清、打不开或可能有安全隐患需要人看时，needs_review 写 true。
tools: []
recovery: typed-turn-recovery
