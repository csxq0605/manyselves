id: chief-chapter-1
version: 1.5.0
description: Write chapter 1 from the ledger and the chapter 3 just settled
agent: report-consultant
objective: 继续作为总编，依据上文的总编资料和输入（rows、module_counts、story_lines、object_chains、same_observation、value_slots 等）以及你提交的第三章，写第一章：1.1 评估背景、1.2 健康度总览（总体评价加三张表的结构化行）、1.3 各区域执行摘要。输入没有重发，按上文的为准。
input_contract: ledger_chief_followup
output_contract: ledger_chief_chapter_1
constraints:
- same_observation 里每一组是同一个表格单元格在几个小节的判断：它是一条记录、一个问题，只算一项、只写一个当前定级，可以说明它从几个角度看各意味着什么，但不写成几项缺陷，也不当作两条记录相互印证。
- 不写审查、卷宗、台账、返修等流程用语，也不写免责句。
- 参考上文专家版方法里第一章的“章节综合”“写法”和“范例”。文字字段只写文字，不画表；表格由系统按结构化字段生成。
- dimension_health 每个评估维度（模块）一行；module_id 填模块编号。
- key_risks 按实际条数，row_ids 写依据的判断行；行动建议与第三章一致。第三章有跨模块综合结论（cross_findings）时，涉及同一对象的风险按综合结论写成一条，row_ids 沿用。
- phases 由第三章行动组的建议时限归并；没有时限的行动放“时限待定”，不自行补时间。
- 总体评价和区域摘要要有取舍：为什么这几项优先、多项证据合起来支持什么判断、哪项复测结果会改变方案；来源和限制集中交代一次，不逐句加限定。
- 不能把未知写成良好，不用多数正常覆盖少数异常。区域摘要可以合并同类事项，但保留覆盖的对象和主要例外。
- 数量、档位和对象名单用占位符（value_slots 里的台账数量和各检查项的计数，或上文“程序统计”里的〔K-…〕〔S-…〕〔S-…:取值〕），不自己数，也不把正文里的数重新归纳成新的数量；数量占位符只填一个数字，量词接着写（“〔K-0040〕个单元”）；其他数字照常写。区域归属按事实里的对象写，不把全站数量写成某个区域的数量。同一措施在第一章、第三章各出现一次，不在总体评价、摘要和表之间反复改写。
- 每条结论不能强于所引判断行的 evidence_status：资料未提供不写成缺失或没有，可能不写成将会，来源作者意见注明出处，照片待核不写成事实。摘要只引用第二章已定的结论，不复述论证。
tools: []
attention_budget_tokens: 200000
recovery: typed-turn-recovery
