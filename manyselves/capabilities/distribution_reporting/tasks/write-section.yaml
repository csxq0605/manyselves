id: write-section
version: 1.5.0
description: Write one submodule's prose from the settled judgment rows, in the judging conversation
agent: report-consultant
objective: 判断已经定下来。现在按专家版的写法写下面这个小节的正文。
input_contract: ledger_section_brief
output_contract: ledger_section_text
constraints:
- 参考共享资料“专家版方法”里本小节的“写法”和“范例”。别的小节的写法只用于那一节，不搬到本节。
- 正文里的数值、数量和对象—数值清单一律写占位符，由程序填值：value_slots 列出本节可用的占位符和它代表的内容（〔V-…〕某对象某一列的值，带表头单位；〔K-…〕计算结果或数量，带单位；〔S-…〕一个检查项的对象—数值清单，〔S-…:NG〕〔S-…:OK〕只列该状态的对象）。照抄占位符，前后照常写文字，例如“1#柜负荷率〔V-0012〕，为中位数的〔K-0031〕”。不自己写阿拉伯数字；对象名称、小节编号、标准编号、委托要求原文和判断行里的措施与时限可以照原样写，其余数字程序会退回。
- section_state 为 mixed（有问题）的小节不写交代核查范围的总起段，直接从现状写起。
- 风险按判断行写：hazard_conditions 已由事实满足的，直接写结论和后果；只有条件还没核实时才写成“若〈条件〉，可能〈后果〉”。不为凑格式加限定。专家版方法里的后果，只有本项目的事实支持它的前提时才写；前提没有证据的，写成“可能……，待核实”，或不写。
- 按“现状描述 → 风险分析 → 建议 → 依据”组织；只写 rows 里已定的判断，不在正文里改结论，也不提出台账里没有的新结论。
- 问题表由系统从判断行生成（问题和措施相同的对象合并成一行，不能判定的对象只进数据缺口表），不要手写表格；在正文里需要放表的位置单独写一行 [[问题表]]，不写就放在小节末尾。has_problem_table 为 false 时本节没有问题表：不写 [[问题表]]，也不写“见下表”“如下表”。
- 有数据时按对象给出结论和数值；同类对象用一句结论概括，不逐段重复论证。数量、分组和“几倍”只用“程序统计”的结果，对象和占位符要配对正确（占位符前写的对象就是它所属的对象）。
- 措辞不能强于判断行的 evidence_status：资料未提供只写“未取得/未提供”，不写成“缺失/没有”；来源作者意见写明是谁的意见，转述关键说法时用「」引原话（source_quotes 是这些行所引记录的原文，「」里只能放其中的原话，程序会核对），不改写成更强或更弱的说法；推断写“可能”；照片待核写“照片读数待核”。
- section_state 是程序数出来的：no_concern（全部无问题）只写一段，交代查了什么、结论是什么；undetermined_only（全部不能判定）只写一段，说明不能判定、缺什么资料，见数据缺口表；no_rows 写一句本节无检查记录。这两种情况不分“现状/风险/建议/依据”展开。
- 来源、限制和资料缺口在本节集中交代一次（例如一句“以下对 A、B 的判断依据原表评语”“C、D 资料未提供，见数据缺口表”），不在每句、每个对象后重复“来源作者意见”“待核实”“资料未提供”，不展开证据边界或口径论证。
- 写出取舍：本节最该先处理什么、为什么（风险等级、影响范围、几项证据是否相互印证）；几条证据合起来能支持明确判断的，直接写出判断，不因资料不全一律写成不能判定；指出哪项补充检查或复测的结果会改变处理方案。
- 挑选出来的对象计数写〔#:占位符、占位符…〕，例如“所列〔#:V-0003、V-0007〕个回路”，并说明挑选口径；检查项的总数用〔K-…〕。“所列 N 个”和“全部中 N 个”不能混写。
- 建议连同时限和理由写成一句，时限沿用判断行。
- 依据写所引的标准：rule_standards 是程序从所引知识单元取出的标准名称，status 是知识库自己写的依据状态。按候选写法表述，例如“可参照〈标准名〉的相关要求（以现行版本为准）”，不写成确定的依据，不写“符合/违反某条款”，也不写知识单元的名称或编号。没有 rule_standards 的行，依据写所用事实和判断理由；不复述判断方法。rule_standards 里的 limits（限值/阈值）和 criteria（结论标准）是判断时守住的边界，只用来把握措辞，例如不把候选数值写成合规限值、不越过其中的限定语；不要求写出来，也不复述。
- data_elsewhere 里的行：本行用的是同一份测量记录的副本，由所列小节负责呈现。本节不再列出这批数据，只写从本节角度得出的结论，并标“（数据见 2.x.x）”。这与下面的跨模块关联不冲突：关联写的是别的模块的结论，可以引一个关键值并标“（详见 2.x.x）”，但也不重列整批数据。
- 判断规则和审查规则只约束措辞，不写进正文：不写“不能据此……”“不构成承诺”这类免责句，不写“追溯补登、不是重新检查”这类说明句，不写审查、卷宗、台账、返修等流程用语。
- 行里写了 relations 的，related_rows 是它所引的别的模块的判断，for_rows 里有每条关联的候选关系和理由。按理由在风险分析里把这层关联写出来，并标出处“（详见 2.x.x）”；标了 in_knowledge_base=false 的关联按它的理由写，措辞写成本项目的分析（如“结合……，可能……”），不写成通用规律，例如“〈某量〉为〈值〉（详见 2.x.x），可排除〈某原因〉”。只写判断行已经记下的关联，不复述别的模块的论证，措辞不强于所引行的 evidence_status。
- 事实上的“程序说明”是程序整理记录时加的说明，不是原记录写的；需要时当作资料限制写，不写成“记录注明……”。
- 不写小节编号标题，不写 E-、K-、R-、P- 编号（占位符除外）。
- submodule_id 填本小节编号。
tools: []
recovery: typed-turn-recovery
