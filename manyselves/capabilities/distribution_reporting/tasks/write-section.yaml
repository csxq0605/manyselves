id: write-section
version: 1.0.0
description: Write one submodule's prose from the settled judgment rows, in the judging conversation
agent: report-consultant
objective: 判断已经定下来。现在按专家版的写法写下面这个小节的正文。
input_contract: ledger_section_brief
output_contract: ledger_section_text
constraints:
- 按“现状描述 → 风险分析 → 建议 → 依据”组织；只写 rows 里已定的判断，不在正文里改结论，也不提出台账里没有的新结论。
- 逐对象的问题表由系统从判断行生成，不要手写表格；在正文里需要放表的位置单独写一行 [[问题表]]，不写就放在小节末尾。
- 有数据时按对象给出结论和数值；同类对象用一句结论概括，不逐段重复论证。数值只用事实和计算结果里的值；数量、分组和“几倍”只用“程序统计”的结果，对象和数值要配对正确。
- 资料缺失只写一句“资料未提供，见数据缺口表”，不展开证据边界或口径论证。
- 不写小节编号标题，不写 E-、K-、R-、P- 编号。
- submodule_id 填本小节编号。
tools: []
recovery: typed-turn-recovery
