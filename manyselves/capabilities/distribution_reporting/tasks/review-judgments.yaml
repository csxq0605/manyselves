id: review-judgments
version: 2.3.0
description: Review one module's judgment rows against exactly what each row cites
agent: report-consultant
objective: 你现在是下面这个模块的审查人。上面是这些判断行所引的事实（facts）、知识单元（rules）和本模块的专家版判断方法（method）；输入里是判断行、所引计算、跨模块关联、程序挑出要看的行、冲突卷宗和读图有疑问的照片。逐行核对判断是否由它所引的资料推出。
input_contract: ledger_review_item
output_contract: review-findings
context_fields:
- facts
- rules
- method
image:
  list_field: photos
  path_field: path
  media_type_field: media_type
constraints:
- 逐行看：basis 是否由所引事实、计算和知识单元推出；hazard 里的每一环后果，hazard_sources 所列的出处里是否真有，没有出处的是否写成了待核实；gap 是否说清缺什么、影响什么；finding 是否与 basis 和所引事实一致、没有说得比它们更重。不审文字写法，这一步还没有正文。
- related_rows 是作者记下的跨模块关联：for_row 是本模块的行，row 是所关联的别的模块的行（它所引的事实也在 facts 里）。核对 reason 里说的条件能不能从两边的事实看出来；看不出来的，对 for_row 判 blocking，要求删掉这条关联或改成待核实。
- related_rows 里标了 in_knowledge_base=false 的，是知识库没有收录的关联，没有知识库兜底：专门核对它的 mechanism 在专业上是否成立、condition 是否真能从两边的事实看出来；有一项站不住就对 for_row 判 blocking，要求删掉或改成待核实。
- rules 里所引知识单元的限值/阈值、结论标准、依据状态和判断条件是判断的参考：把知识库标为候选、未核实的数值当成合规限值，或越过了结论标准里的限定语的，判 blocking；作者说明本项目条件下知识单元不适用或只部分适用、且理由能从事实看出来的，不算问题。
- 行里写了 placement_reason 的，是作者把事实放在默认以外的小节：看理由和所引知识单元是否支持这样放；不支持的判 blocking。
- program_checks 是程序按结构挑出来、需要你判断的行（与负责小节结论不同、原表 OK/NG 与判断方向相反、缺资料却判为没有问题），逐条看；理由不成立的判 blocking，成立的不用提。
- dossiers 只收真正的冲突：同一条事实被几个模块判成不同结论，同一数量在两张表里读数不同，或照片与记录冲突。冲突时写清两边各自的依据，并说明应以哪一边为准、为什么；只对本模块的行提意见。
- photos 里的原图按顺序附在这条消息里，都是读图有疑问的照片。核对 row_ids 这些判断行里与照片有关的说法；用照片读数否定了表格记录、或把看不清的内容写成事实的，判为 blocking。照片与记录不一致时以记录为准，照片标“读数待核”。
- 以下情况也判为 blocking：把未取得的资料或没有记录当作降级理由；数值的含义与表头说明不符。
- findings 的键是被点名的本模块判断行编号（J-...）。severity：blocking=结论、风险等级、措施、后果或缺口说明错了，必须改；minor=可以更好但结论不变。
- method 是建议，不是硬规定。program_findings 是程序已经查出的问题，不用重复写。
- 没有问题时提交空的 findings。
tools: []
attention_budget_tokens: 200000
recovery: typed-turn-recovery
