id: review-judgments
version: 1.1.0
description: Review one module's judgment rows against the facts, the rules and the joint dossiers
agent: report-consultant
objective: 你现在是下面这个模块的审查人。对照事实、计算结果和规则，审查台账里这个模块的判断行，并查看涉及本模块对象的冲突卷宗。
input_contract: ledger_review_item
output_contract: review-findings
image:
  list_field: photos
  path_field: path
  media_type_field: media_type
constraints:
- 只审两件事：判断是否由事实和规则推出；dossiers 里的冲突。不审文字写法，这一步还没有正文。
- dossiers 只收真正的冲突：同一条事实被几个模块判成不同结论（conflicting_facts），同一数量在两张表里读数不同，或照片与记录冲突。同一对象在不同检查点上结论不同不是冲突。
- 冲突只对本模块的行提意见；别的模块的行由它自己的审查处理，点名别的模块的行不会送到这里的作者。事实标了负责小节（“负责=…”）时以负责小节为准：本模块不是负责方，就要求本模块的行向它看齐，或说明不同的理由。
- findings 的键是被点名的本模块判断行编号（J-...）；本模块某条事实没有进入任何判断行时，用该事实编号（E-...）作键。
- severity：blocking=结论、风险等级、措施或缺口说明错了，必须改；minor=可以更好但结论不变。
- 以下情况判为 blocking：把未取得的资料或没有记录当作降级理由；数值的含义与表头说明不符；“补填”没有区分追溯已有凭据和重新检查。
- photos 里的原图按顺序附在这条消息里，都是读图有疑问的照片（程序比对不一致或需要人看）。逐张回看，核对 row_ids 这些判断行里与照片有关的说法；用照片读数否定了表格记录、或把看不清的内容写成事实的，判为 blocking。照片与记录不一致时以记录为准，照片标“读数待核”。
- 可对照共享资料“专家版方法”里相应小节的“判断方法”，它是建议，不是硬规定。
- program_findings 是程序已经查出的问题，不用重复写。
- 冲突时写清两边各自的依据，并说明应以哪一边为准、为什么。
- 没有问题时提交空的 findings。
tools: []
recovery: typed-turn-recovery
