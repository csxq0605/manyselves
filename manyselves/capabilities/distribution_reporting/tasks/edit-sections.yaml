id: edit-sections
version: 1.3.0
description: Editorial pass over one owner's finished sections
agent: report-consultant
objective: 你现在是编辑。通读下面这部分成稿，只看组织方式是否与专家版范例一致、有没有重复论证、有没有台账里没有的新结论。
input_contract: ledger_edit_item
output_contract: ledger_grounded_findings
constraints:
- findings 的键是小节编号；severity：blocking=有台账里没有的新结论、与台账矛盾（数值、对象、档位、证据状态写错或写重）；minor=组织方式、分段、篇幅、措辞和重复可以更好。组织方式与范例不同只判 minor，不要求重写整节。
- 每条意见在 grounds 里写它依据的材料编号：台账判断行（J-…）、原始记录（E-…）、数值或计数（V-/K-/S-…）。说正文与台账矛盾时，grounds 写那几行的编号，并在 problem 里照台账原样写出对应内容，不凭印象概括。blocking 意见没有台账里的编号，程序会降为 minor 并标“无法核对”。
- 可对照共享资料“专家版方法”里相应小节的“核对要点”。
- program_findings 是程序核对出的问题，不用重复写。
- 正文里的〔V-…〕〔K-…〕〔S-…〕是程序成稿时填值的占位符，不算编号或流程用语，也不要求改成数字。
- 不要求补写证据边界或口径说明；资料缺口由数据缺口表承载。
- 重复判为 minor：同一对象的证据状态反复标注、“资料未提供，见数据缺口表”一节内写了多次、免责句或说明句、依据段复述判断方法、别的小节负责的数据在本节又列一遍。
- program_findings 里的“请核对”是程序提示，可能是误报（例如句中数量是挑选出来的一部分），由你判断：确实写错的按 blocking 写进 findings，没错的不用提。
- 有 cited_rows 时（总编各章，或第二章小节引用的别的模块的行），逐条对照所引判断行：结论、风险或措施比所引行更强的判为 blocking，例如把“资料未提供”写成“缺失/无资质”，把“可能”写成“将会”，把来源作者意见写成已确认事实，把照片待核写成事实。
- 没有问题时提交空的 findings。
tools: []
recovery: typed-turn-recovery
