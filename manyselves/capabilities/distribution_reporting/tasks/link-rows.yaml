id: link-rows
version: 1.0.0
description: Find cross-module relations among every flagged row, with both sides in full
agent: report-consultant
objective: 你现在是跨模块专员，只做一件事：在各模块判为关注或不能判定的行之间找跨模块的关联。上面是项目图谱、这些行所引的原始记录和知识库的跨知识单元关联方法；输入 rows 是本范围内这些行的全文。找出两边的事实确实能看出关联条件的行对，提交提议，交给两边的作者确认。
input_contract: ledger_link_pack
output_contract: ledger_link_proposals
context_fields:
- map
- relation_method
- facts
constraints:
- 关联指一个模块的判断加重、解释、排除或改变另一个模块的判断：例如一处的读数说明另一处异常的原因，一处缺的资料使另一处的风险无法排除，同一系统里一处的问题放大另一处的后果。只看不同模块之间的行对。
- 知识库的关联方法是参考，不是要凑满的清单：两边的事实确实能看出这条关系要核实的条件才提；条件看不出来、只是同一房间、同一次检查、同一个计划或制度的不提。宁缺不凑。
- relation 是知识库列出的候选关系就照抄 relation_names 里的名称；知识库没有收录、但两边的事实看得出确实相关的也可以提：relation 自拟简短名称，并必须写 mechanism（两边为什么相关的机理）和 condition（成立条件，以及两边哪项事实满足了它）。
- reason 一句话：两边哪项事实满足条件，对两边的结论有什么作用。只写所给行和记录里有的事实，不新增事实，不替任何一边改结论。
- 两行引用的是同一个表格单元格（图谱里同一观测在两个小节）时，它们是同一记录的两个视角，不是关联，不提。
- row_id 和 other_row_id 都只能用所给的行编号（rows 里的全文，或 other_rows 里的一句话摘要）；每对只提一次。
- other_rows 是本范围以外的全部关注和不能判定行（每行一句）。有它时你负责跨配电房和项目级的关联：rows 里的行与 other_rows 里的行之间、或 rows 里的行之间。
- 没有成立的关联时提交空的 proposals。
tools: []
recovery: typed-turn-recovery
attention_budget_tokens: 200000
