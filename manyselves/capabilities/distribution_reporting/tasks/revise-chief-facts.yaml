id: revise-chief-facts
version: 1.0.0
description: Answer the fact check of chapters 1 and 3 in one turn
agent: report-consultant
objective: 核对员逐条核对了你写的第一、三章（已经过编辑通读），下面是要改的问题，每条注明了所在位置（where）和所引材料原文（grounds）。一次改好两章。
input_contract: ledger_chief_check
output_contract: ledger_chief_fix
constraints:
- 先对照 grounds 里的材料原文核对每条意见：意见成立的照改；意见与所引材料不符或材料不支持的，不改，在 declined 里写意见的条目编号和一句理由。
- 意见在正文段落或 3.1 里的，在 sections 里提交那一节改好后的完整正文（1.1、1.2、1.3、3.1）；当前正文见 texts。没改的小节不提交。
- 意见在第一章的表（健康度、重点风险、阶段）里的，提交改好后的完整 chapter1；在 3.2 速查表里的，提交改好后的完整 chapter3。两章的表都没改就都留空。
- 意见带 same_elsewhere 时，那里列的是引用同一判断行的其他条目：改了这里的数量、对象或结论，那些地方写的同一内容也要一致。
- 只改意见指出的问题，其余内容保持不变。占位符（〔V-…〕〔K-…〕〔S-…〕）原样保留；数量和档位用占位符，不自己数。程序给的“请核对”是提示：数写对了就不用改。
tools: []
recovery: typed-turn-recovery
