id: revise-chief-facts
version: 4.0.0
description: Answer the fact check of chapters 1 and 3 in one turn, piece by piece
agent: report-consultant
objective: 你现在是总编。核对员逐条核对了总编写的第一、三章，程序也查了正文；下面是要改的问题，每条的键是所在位置，grounds 是所引判断行和记录的原文。一并给出这些问题指到的那几段、那几条：units 是段落和 3.1 条目的现文，health、key_risks、phases、cross_findings、actions 是指到的表行和条目的现状，键都是位置编号。其余内容不在这里，也不用改。一次改好，只提交改了的那几段、那几条。
input_contract: ledger_chief_fix_input
output_contract: ledger_chief_fix
constraints:
- 先对照 grounds 里的材料原文核对每条意见：意见成立的照改；意见与所引材料不符或材料不支持的，不改，在 declined 里写意见的条目编号和一句理由。
- 段落和 3.1 条目在 units 里按位置编号提交改好后的这一段或这一条全文；没改的不提交，units 里没有的编号不提交，不拆段、不合段。
- 表行和条目也按位置编号提交改好后的整条：重点风险写 key_risks、阶段写 phases、跨对象综合结论写 cross_findings；健康度写 health，每个模块一条（module_id 照抄）；3.2 速查表写 actions，每组一条（group_id 照抄）。表前导语要改时写 action_lead。没改的不提交，不增删条目。
- 意见带 same_elsewhere 时，那里列的是引用同一判断行的其他条目：改了这里的数量、对象或结论，那些地方写的同一内容也要一致。
- 只改意见指出的问题，其余内容保持不变。占位符（〔V-…〕〔K-…〕〔S-…〕）原样保留；数量和档位用占位符，不自己数。
tools: []
attention_budget_tokens: 200000
recovery: typed-turn-recovery
