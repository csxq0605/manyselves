id: revise-judgments
version: 1.5.0
description: Revise only the rows a review named, in the conversation that judged them
agent: report-consultant
objective: 审查人和程序对你刚才提交的判断行提出了意见；related 里是别的模块对你这些对象的判断，flagged_elsewhere 是别的模块判为关注或不能判定的全部行。核对后只修改需要改的行。
input_contract: ledger_revision_input
output_contract: ledger_judgment_revision
constraints:
- basis 不写审查、卷宗、台账、返修等流程用语，写作会直接引用 basis。
- findings 必须逐条回应：意见成立就在 rows 里提交改好的完整行（行编号不变）；需要新增的行用新编号；需要删除的行编号放 removed_row_ids；意见不成立就在 responses 里写明理由，键是该意见的编号。
- related 的键是本模块的行，值是别的模块对同一主体的判断（含依据）；同一主体可能只是同一个房间或同一张表的同一行，不等于同一台设备。flagged_elsewhere 是别的模块判为关注或不能判定的行，每行一句（行编号 小节｜对象｜检查点（处置）：发现）。relation_method 是知识库的跨知识单元关联方法，relation_names 是它列出的候选关系。逐条看这些行是否加重、解释或改变了本行的结论，例如负荷率低可以排除过载致热，谐波可以加重变压器发热的后果。只有能归到 relation_names 里某一条、且两边的事实能看出这条关系要核实的条件时才连；只是同一房间、同一次检查、同一个计划或制度的不连；条件核实不了就不连，或把待核实的条件写进 gap。
- 要连，就提交改好的完整行，在 relations 里每条写：row_id（所引的行）、relation（照抄 relation_names 里的名称）、reason（一句话：两边哪项事实满足条件，对本行结论有什么作用）。关联的理由只写在 reason 里，不要写进 basis；只有结论本身变了，才改 basis、风险等级或措施。不连就不动，也不用回应。不替别的模块下结论，不复述它的论证。程序会删掉所引行不存在、属于本模块，或 relation 不在 relation_names 里的关联。
- minor 意见可以顺手改，也可以不改。
- basis、hazard、checkpoint 里写的测量值（带单位的数值）只能取自本行所引的事实、计算、照片或知识单元；要用某个值，就把它的出处写进 evidence_ids、calculation_ids、photo_ids 或 rule_refs。程序会核对，对不上的退回。
- 专家版方法里的后果（某种现状会导致什么），是那个项目的证据支持的；只有本项目的事实支持它的前提（方法里写的“前提”）时才写进 hazard，前提没有证据的，hazard 写成待核实的可能后果。
- 没被点名、也没有因 related 改动的行不要重新提交。只提交本模块的行（J-本模块-…），别的模块的行改不了。
tools: []
recovery: typed-turn-recovery
