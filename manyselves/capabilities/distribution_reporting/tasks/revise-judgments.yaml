id: revise-judgments
version: 4.0.0
description: Revise only the rows a review named, in the conversation that judged them
agent: report-consultant
objective: 审查人和程序对你提交的判断行提出了意见，跨模块审查可能还提议了你没有连的关联（proposed）（输入里有 recheck 的，是程序对你上一次改动的复查；有 fact_check 的，是成稿第一、三章写错的说法在你的判断行里也这样写，要把判断行一起改对）。核对后只提交要改的地方，并逐条决定提议是否采纳。
input_contract: ledger_revision_input
output_contract: ledger_judgment_revision
constraints:
- basis 给审查看，不印进报告；concern 行的 finding 是问题表印给读者的一句话（现状，不超过 60 字），不写编号、知识单元和审查、卷宗、台账、返修等流程用语。
- findings 必须逐条回应：意见成立就在 patches 里写这一行要改的字段（row_id 写行编号，fields 只写改动的字段和改好后的值，没改的字段不写）；需要新增的行把完整的行写进 rows，用新编号；需要删除的行编号放 removed_row_ids；意见不成立就在 responses 里写明理由，键是该意见的编号。
- 关联（relations）已经在上一步定了，不用重写；审查要求删掉或改的关联，才在这一行的 fields 里写改好后的完整 relations。改完的行程序会再核对一遍，对不上的退回一次。
- minor 意见可以顺手改，也可以不改。
- proposed 的键是本模块的行，值是跨模块审查对这一行提议的关联，每条带另一端那一行的全文 other_row；proposal_facts 是另一端所引、你还没看过的记录原文。逐条判断：审查只是提议，不因为是审查提的就采纳；用你自己的行、other_row 和记录原文核实这条关系要的条件，另一端的结论以它的行为准。成立的写进 relations（键是本模块的行，值是新加的关联，写法和关联那一步相同，不重写这一行已有的关联）；不成立的写进 declined_proposals，一句理由。只是同一房间、同一次检查、同一个计划或制度的不采纳；核实不了的不采纳，只有它要的某项条件在全部资料里都没有记录时，才可以采纳成 status 为“待核实”并写明 missing。
- 键是事实编号（E-…）的意见，说的是这条事实还没有任何模块判断：属于本模块某个小节的，新增判断行并写所依据的知识单元；不属于的，在 responses 里说明。
- 把事实放在默认以外的小节时，保留或补写 placement_reason，rule_refs 写覆盖本小节的知识单元。
- basis、hazard、checkpoint 里写的测量值（带单位的数值）只能取自本行所引的事实、计算、照片或知识单元；要用某个值，就把它的出处写进 evidence_ids、calculation_ids、photo_ids 或 rule_refs。程序会核对，对不上的退回。
- 专家版方法里的后果（某种现状会导致什么），是那个项目的证据支持的；只有本项目的事实支持它的前提（方法里写的“前提”）时才写进 hazard，前提没有证据的，hazard 写成待核实的可能后果。
- 没被点名的行不要改。只提交本模块的行（J-本模块-…），别的模块的行改不了。
- concern 行的 hazard_conditions 不能为空：写明后果要在什么条件下才会发生。
tools: []
needs_history: true
attention_budget_tokens: 250000
recovery: typed-turn-recovery
