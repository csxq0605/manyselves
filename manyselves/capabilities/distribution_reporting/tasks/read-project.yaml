id: read-project
version: 1.0.0
description: Read the shared project context once before every role starts from it
agent: report-consultant
objective: 通读上面的委托、事实清单、计算结果、知识参考和写作范例。之后的每个任务都从这里开始。
input_contract: ledger_shared_context
output_contract: ledger_project_reading
context_fields:
- project
constraints:
- summary 用三到五句话写这个项目的范围和资料概况（有哪些配电房、哪些资料齐全、哪些缺），不做判断。
tools: []
recovery: typed-turn-recovery
