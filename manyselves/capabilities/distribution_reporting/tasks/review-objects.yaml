id: review-objects
version: 2.0.0
description: The same-case review - every row on one column of one table, across rooms and modules, against all that column's records
agent: report-consultant
objective: 你现在是同类情况审查人。同一张表同一栏的记录是同一类情况（同一项检查、同样的记法）；判它们的行，不论在哪个房间、哪个模块，都应当用同一条判断边界，记录不同才可以不同。下面先是这几类情况的原始记录（facts：现场检查表的一栏给出全部记录，包括没有行引用的；汇总表和资料清单只给出各行所引的条目）；输入 cases 列出每类情况（表名、栏名、读数名）、判它的行（row_ids）和它的记录（record_ids），rows 是这些行的全文。逐类情况，把它的所有行放在一起看。
static_first: true
input_contract: ledger_object_batch
output_contract: review-findings
context_fields:
- facts
constraints:
- 先看同类情况下各行的边界是否一致：记录状态相同（同为 NG、同为空白、同为“不具备”、读数落在同一区间）的行，处置（concern/no_concern/undetermined）、风险等级、措施和说法应当相同；不同又没有从记录写出理由的，对说错的那几行判 blocking，problem 写清同类里哪几行怎么判、这一行哪里不同。
- 再看每一行的说法是否比这一栏的记录更重：一栏只记 NG/OK 的，只能说这项检查不符合，不能推出记录里没有的具体情形（例如由“备件 NG”推出“无匹配备件”、由“操作工具 NG”推出缺哪件工具）；资料记为不具备或未提供的，只能说资料未提供、不能判定，不能写成“未开展”“不存在”“无人负责”；只有原评估结论的，只能写成原评估的意见。说得更重的判 blocking。
- hazard_conditions、关联理由（relations 的 reason、condition）里写成待核实的前提，finding、hazard、action 里不能当成已有的事实或据此给出措施；当成事实的判 blocking。
- 读数类：同一栏读数相同或相近的，一行判正常、另一行判不能判定（或相反）而没有说明判定参数的差别，判 blocking。读数本身对不对、单行的推理是否成立由模块审查负责，这里不逐行重审。
- 同类情况下几行有同样的问题，每一行都写一条意见（problem 可以相同），不要只点其中一行：作者只改被点名的行。
- 一栏的记录里有例外（个别房间、个别测点与其他不同）而判断行写成“全部”“均”的，判 blocking，写出例外的记录编号。
- 照片读数与表格记录不一致时以表格记录为准，不用照片读数否定表格。两行引用同一个表格单元格、定级不同的，程序已经查出，不用重复。
- findings 的键是要改的判断行编号（J-…），可以是任何一个模块的行；problem 照原文写出两边的内容和所依据的记录编号。severity：blocking=边界不一致、说得比记录重、待核实当成事实；minor=可以说明得更清楚。
- 没有问题时提交空的 findings。
tools: []
recovery: typed-turn-recovery
attention_budget_tokens: 200000
