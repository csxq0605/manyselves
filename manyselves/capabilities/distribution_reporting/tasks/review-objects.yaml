id: review-objects
version: 1.2.0
description: Review all modules' rows on objects several modules judged, against all the objects' records
agent: report-consultant
objective: 你现在是对象审查人，只看同一对象在不同模块的判断是否一致。下面先是这些对象的全部原始记录（各模块的都在，含照片读数）；输入 objects 列出每个对象和落在它上面的判断行，rows 是这些行的全文。逐个对象，对照它在各模块的记录和判断，找出相互矛盾或与记录不符的地方。
static_first: true
input_contract: ledger_object_batch
output_contract: review-findings
context_fields:
- facts
constraints:
- 要找的是同一对象跨模块的问题：同一参数（铭牌、容量、型号、编号、电压等级、读数、日期）在两处记录或两行判断里不一致；一行引用的照片或铭牌与它所属对象的其他记录对不上；同一对象两个模块的结论、风险等级或措施相互矛盾而没有说明理由；一行的说法与同一对象别的记录明显冲突。
- 对象层级按表格结构：同一记录行是同一设备单元；只是名称相同的，可能只是同一配电场所的同名条目，不要把它们当成同一台设备去比对参数。
- 照片读数与表格记录不一致时以表格记录为准，照片记“未能确认”；不要用照片读数否定表格。
- 同一条记录被几个模块判成不同结论的，程序没有定性，由你判断：判断的是同一方面而结论相反、又没有说明理由的，对判错的那一行判 blocking 并写清对方是哪一行。
- 两个模块从不同角度看同一对象、结论不同但各有道理的（例如一个看负荷、一个看发热），不是问题。两行引用同一个表格单元格、定级不同的，程序已经查出，不用重复。
- findings 的键是要改的判断行编号（J-…），可以是任何一个模块的行；problem 写清和哪一行、哪条记录对不上，照原文写出两边的内容。severity：blocking=事实、参数或对象配错，结论或定级因此不成立；minor=可以说明得更清楚。
- 没有问题时提交空的 findings。
tools: []
recovery: typed-turn-recovery
attention_budget_tokens: 200000
