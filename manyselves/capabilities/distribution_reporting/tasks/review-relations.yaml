id: review-relations
version: 1.3.0
description: Review recorded cross-module relations with both rows and what they cite
agent: report-consultant
objective: 你现在是关联审查人，只看作者记下的跨模块关联是否成立。上面是知识库的跨知识单元关联方法和两边所引的原始记录；输入 relations 是每条关联（for_row 记下了这条关联，row_id 是所关联的行），rows 是两边判断行的全文（待核实的一批是摘要）。逐条核对。
input_contract: ledger_relation_batch
output_contract: review-findings
context_fields:
- relation_method
- facts
constraints:
- 逐条看 reason 里说的条件能不能从两边的事实看出来、对 for_row 结论的作用是否说得过头；看不出来或作用说过头的，对 for_row 判 blocking，要求删掉这条关联；只有缺的那项条件在两边的记录里确实没有记录（没测、没填）时，才要求改成待核实并写明缺什么。
- 知识库没有收录的关联（relation 不在关联方法里，带 mechanism 和 condition）没有知识库兜底：专门核对机理在专业上是否成立、条件是否真能从两边的事实看出来；有一项站不住就判 blocking。
- pending 为 true 的一批全是“待核实”的关联，rows 是两边行的摘要，不附原始记录。这一批只看三点：missing 是否写清楚缺哪项条件、补充什么资料或检测能确认；两边的行（对象、检查点、发现）是否确实指向这条关系；reason 有没有把它写成已经成立、拿它加重或解释本行结论。三点都没问题的不写意见，不要求证明关联成立；有一点站不住的判 blocking，要求写清缺口或删掉。
- 不在待核实批里的关联都是“成立”的，按上面几条和原始记录核对。
- 只是同一房间、同一次检查、同一个计划或制度的，以及两边只是同缺一批资料、没有别的联系的，判 blocking，要求删掉。
- 关联成立但 for_row 的 basis、hazard 或风险等级没有体现这层作用、或体现得过头的，判 minor 并说明。
- findings 的键是 for_row 的行编号；同一行有几条关联有问题的写在一条意见里，写明是哪几条（row_id）。
- 没有问题时提交空的 findings。
tools: []
recovery: typed-turn-recovery
attention_budget_tokens: 200000
