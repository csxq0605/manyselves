id: energy-series
version: 0.1.0
description: One meter's records or hourly or daily totals over a time range
instructions: scope 填分区说明里的 scope；meter_id 只能是本分区的表；start、end 用站点本地时间（例如 2026-03-02 08:00），不带时区；granularity 填 native（原始记录，最多 48 小时）、hour 或 day，最多 800 行。每行只计完全落在该行时段内的记录。结果的 evidence_id 可在损耗项里引用。
implementation: capability:energy-efficiency:energy-series
input_contract: series-request
output_contract: finder-tool-result
side_effect: run_local_write
parallel_safe: true
reuse_result: false
model_visible: true
