source: 《制造业能效诊断知识库：九步骤完整版》第 4 步 4.3–4.6，逐项原文摘录：辨识范围、必要证据、常见误判
categories:
- id: LOSS-PROCESS
  title: 同条件加工超耗
  scope: 同产品/配方、能力档和运行模式、合格且完整的加工批次，或服务任务相容的同时运行单元，出现能量或单位合格产出偏差。先表述同条件差异，不跨不同设计能力直接判断操作浪费。
  evidence: 实际加工起止、原始积分、合格产出及单位、完整性与质量、分组成员、计量对称性；清机、中断等是否扣除，观察与参照须一致。功率、喂料/处理速率、良品率等用于解释分子分母，缺失时不补造。
  pitfalls: 高平均功率等于高单耗；投入与成品混用；低产出摊薄导致的单耗变化全部归设备；颜色/尾缀/试产混组；优选批欠处理或质量边缘却作标杆。
- id: LOSS-INTERRUPTION
  title: 加工中断可避免维持用电
  scope: 已确认加工窗口内的暂停、故障或异常等待，期间仍有热态、辅机或控制电量；候选只涉及相对可达中断/维持策略的可避免部分。
  evidence: 实际起止及低功率积分、停机原因/日志、所含设备、必要维持与恢复要求、正常降速/换网/工艺平台等排除依据。可靠性统计可另建预期记录，不能替代实测事件。
  pitfalls: 低功率全部是故障；以全批平均生产功率乘停机时间；把中断期间全部用电当可省；将平均修复时间模型视作逐事件事实。
- id: LOSS-IDLE
  title: 批间隙或计划外待机超耗
  scope: 两项有效生产任务之间或经确认无生产需求时，设备仍消耗电量；候选限于超出有效最低服务的部分。窗口终点要与下一清机或实际准备开始对齐。
  evidence: 相邻任务完整记录、分状态的实测电量、生产相似/近零/未知窗口、日历与现场服务要求、历史真实停机先例及其条件。排除漏批、调试、提前升温、时钟错配。
  pitfalls: 报表无批次等于无人生产；长间隙整段都是待机；外厂零功率可直接套本厂；将低功率但正在进行必要测试或保温的段全部计省。
- id: LOSS-HOLD
  title: 休息日保温策略净超耗
  scope: 休息日或较长生产空档持续保温，与停保温后再准备的完整替代策略相比可能出现净超耗。保温本身不是损耗；较短间隙持续保温可能更经济。
  evidence: 保温窗口与实测量、初始/目标温度、材料与品质要求、下一任务时间、再升温/清机/废料及等待量、可停止设备边界和恢复能力。
  pitfalls: 周日负荷一律可关；按零电量基准计算保温全额；忽略再清机、升温及产品损失；只比电量而回避质量、交付和不可逆状态。
- id: LOSS-TRANSITION
  title: 同切换对过渡作业超耗
  scope: 相同上游产品到下游产品、材料/颜色及洁净要求下，清机、换线、升温或调试出现持续时长、强度或不必要重复次数差异。
  evidence: 有向切换对、实际准备窗口、电量与物料、检验标准、设备能力及启动状态、正常与试产任务、重复切换的业务原因。方向相反的切换不能自动合并。
  pitfalls: 必需清机全额都是损耗；只按下产品分组；长间隙后的再次清机一定多余；试验验证任务自身被称浪费；用较脏或不合格低耗样本作基准。
- id: LOSS-PARALLEL
  title: 可压缩并行窗口超耗
  scope: 新旧设备、两条供给路径或主辅单元存在真实同时运行窗口，且连续服务允许在完成切换后缩短重叠或减少超出所需的并行强度。
  evidence: 两侧独立或可核实计量、起止/配对、真实交叠、稳定单供或规定组合参照、切换与负荷任务、冗余/备用和连续性要求。缺侧计量时不能凭一侧突起认定全并行量。
  pitfalls: 两设备同时运行都可取消；新线产出增加视为旧线退出慢；把必要预热、压力建立或无扰切换段全计省；不同容量或服务任务直接相减。
- id: LOSS-SUPPORT
  title: 公辅供给或运行组合失配
  scope: 压缩空气、制冷、泵/塔、真空、供水、环保等供给与实际服务需求、环境或运行设备组合不匹配，出现待查偏差。服务对象可跨产线，不能只看某一生产分母。
  evidence: 全服务边界、供给量与压力/温度/品质、需求和最低负荷、组合与控制状态、天气和日历、同条件系统电量。缺流量时只能描述耗电，不能声称单位供气效率或漏气率。
  pitfalls: 辅主比高就是辅机差；停产后所有辅机均可停；比值下降就是节能；水处理电量比当回收率；泵速立方直接当全系统实际节电；忽略环保和余热需求。
- id: LOSS-CONDITIONAL
  title: 归一条件后的残余超耗
  scope: 在明确模型、条件域及误差下，产量、气象、装载或服务等解释后仍有残余差异。残差是不被当前模型解释的部分，不是天然设备损耗。
  evidence: 建模样本、目标量与特征、训练/验证规则、系数/模型版本、域范围、误差指标、输入完整性、结构与计量变化记录、实际和预测的同窗支撑。
  pitfalls: 回归截距当不可削减基载；正残差全计浪费；低拟合度证明故障；域外预测照算；遗漏产品或服务变量导致的变化归设备老化；用训练集自证判异。
- id: MECH-CONTROL
  title: 控制覆盖或故障维护机制
  scope: 命令与反馈不一致、手动覆盖、联动缺失、定时策略与需求错位、传感器/执行器/设备维护问题等，可以解释某电量事件的机制线索。
  evidence: 命令、反馈和真实运行/服务量，设定与程序版本、手自动状态、报警/维护/变更日志、保护及人工接管原因，并关联受影响的实际事件。
  pitfalls: 启停频繁就是故障；相关/漂移等于老化；夜间运行就是忘关；没有指令但实际服务必需；补传感器后看见的新电量视为新增损耗。
- id: OPP-CAPABILITY
  title: 跨能力档/规模/经济批量排产机会
  scope: 同类任务在不同能力设备、并行单元数、批量或任务序列下存在能耗差异，可通过可行排产改变。它描述方案机会，不把设备设计差异或必要小批量说成历史操作浪费。
  evidence: 能力与工艺适配、同质量产出、有效运行单元小时、固定启动/切换消耗、订单与交付、设备可用性、库存/保质期、试产和追溯约束。日均值、单元小时加权值的分母不得互换。
  pitfalls: 管数/开机数少就低效；最好一天代表全年；所有订单都能合批；研发小批次可取消；忽略高效设备占用和重启代价；将不同产品结构差归规模效果。
- id: COST-SHIFT
  title: 完整工艺周期移峰净节费
  scope: 在同一服务和明确任务约束下改变用电时刻，按完整周期或联合排程比较电度费用。峰时占比、设备均价和钟点矩阵只负责找候选。
  evidence: 原完整电量曲线及桶长、适用分时价/日历、允许开始结束时窗、前后任务与共享产能、工艺连续性、额外保温/启停及全月需量影响。仅有峰谷总量时只能做附条件情景。
  pitfalls: 峰电全部可移；目标峰谷比推得的转移量就是物理可移量；只算转入谷的好处；保温非谷和谷末对准各领一次整炉收益；把价差叫节电。
- id: COST-BASIC
  title: 基本电费方案与峰值管理机会
  scope: 同户号、同结算周期，比较适用容量/需量方式、申报与实际需量、可行负荷峰值管理的费用差，不是电量损耗。
  evidence: 实际合同和适用规则、容量、账单、结算需量算法/窗口、全月关口曲线、模式与申请生效条件，未来季节负荷及生产计划。小时功率或非同窗平均值不能冒充结算需量。
  pitfalls: 单个峰削去便按同量降费；各设备各自最大值相加；历史低负荷方式不适合夏季便判历史错误；旧费差乘全年就是未来收益；地方优惠条件泛化全国。
- id: COST-REACTIVE
  title: 力调费用差额
  scope: 在实际适用功率因数评价、奖惩和计费基数下，补偿/运行变化形成的调整费差额；不等于有功电量减少。
  evidence: 账单及符号、结算有功/无功或规则指定量、计费基数、分档与容差、适用对象/时期、补偿设备和运行限制。瞬时功率因数不能直接代替结算平均口径。
  pitfalls: 正负奖励符号倒置；奖励已到边界仍继续线性外推；不清基数却按总电费百分比；规则未知默认零费；将改善功率因数直接乘电度价当节电。
- id: COST-STORAGE
  title: 储能联合调度净收益
  scope: 明确启用的储能专题，在实际/候选充放曲线下比较全系统或客户合同份额的净成本，包含电度、需量和库存影响。专题未知时不自动推荐配置。
  evidence: 同窗关口与生产曲线、充放功率及SOC、初终库存、效率边界/辅耗、功率容量与保护、全月需量、价格、衰减运维、合同分成及原有套利机会。
  pitfalls: 放电量就是节电；忽略充电峰与次高峰；将每日削峰相加成月需量收益；总系统收益当客户收入；不对齐末端SOC；容量计费下仍虚构需量费。
- id: COST-PROCURE
  title: 购电方案全成本差额
  scope: 在相同实际或明确预测负荷、户号及合同范围下，比较可获取采购方案的全成本；可分析价格、数量与时段结构变化，但不把分解贡献直接视作新增收益。
  evidence: 合同/报价的适用期、税费与输配附加、偏差/现货调整、结算电量、资格与履约条件、已支付款项以及价格风险。历史同比与同月方案反事实要分清。
  pitfalls: 去年低价必能再次获得；综合账单均价差全归采购；售电侧机制收入直接算客户收益；忽略负荷结构、返还与合同差异；已获得历史收益当未来新增空间。
- id: NECESSARY
  title: 必要工艺/环境/安全服务耗能
  scope: 满足有效工艺、质量、环保、环境、仪表、连续服务、备用与保护要求的耗能，以及经证实必要的恢复与准备。它是边界和反证项，不是节能失败的解释口号。
  evidence: 服务对象、最低标准、适用时窗、质量/安全依据、实际服务量和负责人确认；区分书面设计要求、当前现场事实与待验证经验。必要服务量不能直接等于整条现状曲线。
  pitfalls: 所有非生产电量可关；环保/实验室随主线停；把有必要用途理解成任何供给强度都合理；反过来因一次可停先例否定另一工况下需求。
- id: MEASUREMENT_ISSUE
  title: 计量或时间口径待核
  scope: 缺失、重复、跳变、回卷/重置、量程、倍率、累计/区间/功率混用、共表与父子重复、时钟、业务漏记/错报、覆盖变化及字段误映射等，可能制造或掩盖偏差。
  evidence: 异常原始点与文件版本、表计/采集日志、拓扑与字段口径、对时和业务记录、影响范围、拟议修复规则与替代数据来源；不得为闭合而凭空补值。
  pitfalls: 所有负值都是浪费；平台重复点都是停机；多回路同尖峰必是真实启动；按均值填补后不保留不确定性；更正后的下降被宣传为实际节能。
