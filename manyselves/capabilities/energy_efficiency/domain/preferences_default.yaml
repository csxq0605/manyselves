# 能效能力包的默认分析偏好。
#
# 分析偏好是“怎样分析”的选择，不是关于工厂的事实，所以不进现场核实清单。
# 人在输入文件夹里放 preferences.yaml 或 分析偏好.xlsx 时，按项覆盖这里的值；
# 没放的项用这里的值。每次运行都会在输出里附一份写着当前取值的 分析偏好.xlsx，
# 改好后放回输入文件夹，在同一运行编号上续跑即可。
#
# 想换所有项目的默认值，直接改这个文件。origin 写这个值是怎么来的。
# alternatives 是做敏感性对照用的备选值：程序同时按备选值算一遍，列出结果会变多少。
values:
  day_run_hours:
    value: 1.0
    alternatives: [0.5, 2.0]
    origin: 程序设定（2026-11-18），没有外部依据
  band_reference_quantile:
    value: 0.95
    origin: 沿用 EveryMe 0.6 站点配置 A15 的 P95，未经本项目确认
  band_off_fraction:
    value: 0.05
    alternatives: [0.03]
    origin: 沿用 EveryMe 0.6 站点配置 A15，未经本项目确认；备选值是程序设定
  band_run_fraction:
    value: 0.40
    alternatives: [0.30]
    origin: 沿用 EveryMe 0.6 站点配置 A15，未经本项目确认；备选值是程序设定
