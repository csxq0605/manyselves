id: fix-partition-items
version: 0.4.0
description: Correct this partition's submission after the program's check, in the same conversation
agent: loss-finder
objective: 程序核对了你刚才提交的损耗项，check.issues 列出了对不上的地方（引用的证据不存在、不是这块表或没查本项的时间窗，依据为 data 的原因没写本项的证据编号，表不在本分区，时间窗超出数据期或没有记录，方法在这块表上不能用等）。submission 是你上次的提交。逐条改正后重新提交整个分区的结果。
input_contract: fix-request
output_contract: partition-submission
constraints:
- 只改 issues 指出的问题；没有被指出的项照原样保留，不借机删项、并项或改写。程序会把你删掉的项按第一次提交放回，并标注出来。
- 引用的证据不对时，用工具重新查一次，引用新返回的 evidence_id，并按新证据核对 phenomenon 里的数字。
- 某一项改不了（例如方法缺前提、资料不全）时保留这一项，按实际情况改 finding_method 或在 missing_info 写明缺什么，不要为了通过核对删掉它。
- 其余要求与上一步相同：每次调用工具都把 scope 原样填上；coverage 对菜单里每个方法都要有一条；category_coverage 对 17 类在每块表上都有交代（有项提议的不用写）；规则项不能删除。
tools:
- energy-series
- compare-windows
- try-method
- production-records
needs_history: true
recovery: typed-turn-recovery
