id: fix-plant-items
version: 0.1.0
description: Correct the plant-wide submission after the program's check, in the same conversation
agent: loss-finder
objective: 程序核对了你刚才提交的全厂关联结果，check.issues 列出了对不上的地方。submission 是你上次的提交。逐条改正后重新提交整个结果。
input_contract: fix-request
output_contract: partition-submission
constraints:
- 只改 issues 指出的问题；没有被指出的项照原样保留，不借机删项、并项或改写。程序会把你删掉的项按第一次提交放回，并标注出来。
- 引用的证据不对时，用工具重新查一次，引用新返回的 evidence_id。
- 某一项改不了时保留这一项，在 missing_info 写明缺什么，不要为了通过核对删掉它。
- 其余要求与上一步相同：partition_id 填 PLANT；scope 原样填上；category_coverage 对 17 类都有交代；links 两边是本次的项或分区项编号。
tools:
- energy-series
- compare-windows
- try-method
- production-records
needs_history: true
recovery: typed-turn-recovery
