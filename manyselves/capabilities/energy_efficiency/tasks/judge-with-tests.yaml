id: judge-with-tests
version: 0.1.0
description: Second round of judgments, after the program ran the cause tests
agent: loss-analyst
objective: 程序跑完了你上一轮写的检验，results 是每条的结果（supports 支持、contradicts 矛盾、cannot_test 查不了，附算出的数和规则）。请按结果定稿，重新提交完整的判断：检验支持的原因可写 kept，矛盾的写 dropped（或写 open 并提现场问题），查不了的写 open；措施、现场问题随之调整。
input_contract: probe-results
output_contract: judgment-submission
constraints:
- 每个候选仍各写一条，其余要求与上一轮相同。
- 检验矛盾的原因不能写 kept。repair、retrofit 只能依赖检验支持的原因。
- 可以加新的原因和检验，但新检验这次不会再跑，status 写 open。
needs_history: true
recovery: typed-turn-recovery
