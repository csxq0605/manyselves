id: look-residual
version: 0.1.0
description: One residual round over the largest unexplained pieces of excess
agent: loss-analyst
objective: 下面是程序算出的、还没有哪个视角或规格说得清的超出里最大的几片（slices，每片是一块表的一周，带逐日数、夜间和全厂停的占比、和产线的相关），已有的候选（candidates）和已交的规格（specs_so_far），以及问卷（facts）、对数据口径的推断（assumptions，待确认）、任务和关注点（task、focus，有才给）和写规格能用的维度。每片写一条处置：能说清为什么不算损耗的交剩余解释规格（explained），像浪费的交参照规格（new_reference），看不出的写 cannot_tell，要补资料的写 needs_data。
input_contract: residual-brief
output_contract: residual-submission
constraints:
- key 原样填。slices 里每片各写一条，处置对应的规格写进本条 specs。
- 剩余解释的 type：necessary_service 必要服务、external_driver 外部驱动（写 driver 和要补的数据 request）、data_problem 数据问题、existing_item 已有候选（item 写候选编号）。
- 规格只用 axes 里的维度；不写电量和金额；问卷依据写行编号。
- 已交过的规格（specs_so_far）不重复交。
recovery: typed-turn-recovery
