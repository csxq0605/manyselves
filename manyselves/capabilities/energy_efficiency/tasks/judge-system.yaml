id: judge-system
version: 0.2.0
description: "Judge one system's computed rows: opinion, reference choice, causes settled on the tests, measures and site questions"
agent: loss-analyst
objective: 下面是一个系统里筛为有效或待定的行（judge）。每一行是一个损耗项落在一块表上、由程序在全期算出的结果：时段、各档参照下的超出（levels）、默认档和最保守档、重叠、程序的拆分（decomposition：时长、星期和钟点分布、全厂停占比、集中度、和产线的相关、变化最大的分界日、批次的功率和时长对比）、稳定性（stability：前后两半各多少、最大一天占多少、规格时段挪一格变多少），以及提项时写的原因检验在这一行上的结果（tests：supports 支持、contradicts 矛盾、cannot_test 查不了，附算出的数和规则）。这些项是谁提的、怎么找到的、当时怎么想的在 items 里。筛为无效的一行一项（invalid）；另有筛选规则、本系统的触发处置和机理（system_look）、问卷（facts）、对数据口径的推断（assumptions，待确认）、任务和关注点（task、focus，有才给）、知识库（只作参考）和程序能跑的检验（test_types）。请对 judge 里每一行写一条判断：看了程序算的数以后，意见（像损耗、像必要、像数据问题、看不出），参照选哪一档和理由，原因定稿（按检验结果写 status），措施选项，现场问题和相关项。
input_contract: judge-brief
output_contract: judgment-submission
constraints:
- key 原样填。judge 里每一行各写一条，candidate 写行编号（judge 里的 id）。
- reference_choice 写 levels 里的 label，都不合适写 other；reference_reason 只谈可比性（是不是同一场景、同一产品，那几天有没有特殊情况）。
- causes 沿用提项时的编号；检验支持的可写 kept，矛盾的写 dropped（或写 open 并提现场问题），查不了的写 open。可以加新的原因和检验，新检验这次不会先跑，status 写 open。非损耗的解释（必要服务、工艺需要、数据问题、外部驱动）照样列上，kind 标清。
- measures 原因没确认时只给 management、operation 两类；repair、retrofit 要写 depends_on，并且所依的原因要经检验支持。owner_role 从 roles 的键里选。
- 不写电量、金额和节约量（数以台账为准），不决定有效无效、留不留。
recovery: typed-turn-recovery
