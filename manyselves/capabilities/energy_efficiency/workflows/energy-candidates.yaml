id: energy-candidates
version: 0.1.0
description: Read one site's meter data, run the program's lenses on the electricity grid, let the analyst look where they cannot see (per system, then the residual) and judge the candidates, screen them by the preference rules and write the workbook (台账)
tasks: []
recovery:
- typed-turn-recovery
outputs:
- candidate-register
input_contract: energy-candidates-request
input_variable: request
output_contract: candidate-register-summary
state:
  run-id: ''
  request: {}
actions:
- id: run-ref
  kind: set_variable
  variable: run_ref
  value_variables:
    run_id: run-id
# A folder without a manifest: the program surveys the files and the
# manifest drafter writes how to read them.  The survey gives no brief when
# the folder has a manifest, so the map runs nothing.  No errors variable:
# without a manifest that reads, nothing after this can run.
- id: survey
  kind: invoke_tool
  tool: survey-energy-inputs
  input_variable: run_ref
  output_variable: survey_set
- id: survey-briefs
  kind: set_variable
  variable: survey_briefs
  value_variable: survey_set
  field: briefs
- id: draft-manifest
  kind: map
  items_variable: survey_briefs
  key_field: key
  workflow: draft-manifest
  key_input_variable: draft_key
  output_variable: manifest_results
  max_concurrency: 1
- id: parse
  kind: invoke_tool
  tool: parse-energy-inputs
  input_variable: run_ref
  output_variable: parsed
- id: profile
  kind: invoke_tool
  tool: profile-energy-data
  input_variable: run_ref
  output_variable: profiled
# The program measures how the data behaves; the caliber drafter writes the
# inferences those facts support.  A map of one, so a failed draft leaves
# the run going without drafted inferences.
- id: caliber
  kind: invoke_tool
  tool: caliber-facts
  input_variable: run_ref
  output_variable: caliber_set
- id: caliber-briefs
  kind: set_variable
  variable: caliber_briefs
  value_variable: caliber_set
  field: briefs
- id: draft
  kind: map
  items_variable: caliber_briefs
  key_field: key
  workflow: draft-assumptions
  key_input_variable: draft_key
  output_variable: assumption_results
  errors_variable: assumption_errors
  max_concurrency: 1
# The program builds the company model, the foundation tables (states,
# events, measures, the plant stopped by power) and the electricity grid.
- id: foundation
  kind: invoke_tool
  tool: build-foundation
  input_variable: run_ref
  output_variable: foundation
# S1: every lens on every meter it applies to; overlap, coverage, residual,
# triggers and screening; one look brief per system.
- id: lenses
  kind: invoke_tool
  tool: run-lenses
  input_variable: run_ref
  output_variable: look_set
- id: look-briefs
  kind: set_variable
  variable: look_briefs
  value_variable: look_set
  field: briefs
# S2: one conversation per system; a failed system keeps the program's
# candidates and the run goes on.
- id: look
  kind: map
  items_variable: look_briefs
  key_field: key
  workflow: look-system
  key_input_variable: item_key
  output_variable: look_results
  errors_variable: look_errors
  max_concurrency: 4
# S3: the accepted specs into the register.
- id: apply-input
  kind: set_variable
  variable: apply_input
  value_variables:
    run_id: run-id
    results: look_results
    errors: look_errors
- id: apply
  kind: invoke_tool
  tool: apply-looks
  input_variable: apply_input
  output_variable: applied
- id: rounds
  kind: set_variable
  variable: rounds
  value_variable: applied
  field: rounds
# S4: the residual rounds one after the other; each stops the next when it
# added less than the preference's share of the residual (P34).
- id: residual
  kind: map
  items_variable: rounds
  key_field: key
  workflow: residual-round
  key_input_variable: item_key
  output_variable: round_results
  errors_variable: round_errors
  max_concurrency: 1
# S5: two-round judgments per system, with the program's cause tests between.
- id: judge-briefs
  kind: invoke_tool
  tool: judge-briefs
  input_variable: run_ref
  output_variable: judge_set
- id: judge-items
  kind: set_variable
  variable: judge_items
  value_variable: judge_set
  field: briefs
- id: judge
  kind: map
  items_variable: judge_items
  key_field: key
  workflow: judge-system
  key_input_variable: item_key
  output_variable: judge_results
  errors_variable: judge_errors
  max_concurrency: 4
# S6 and S7: the screening by the preference rules and the workbook.
- id: register-input
  kind: set_variable
  variable: register_input
  value_variables:
    run_id: run-id
    judge_results: judge_results
    judge_errors: judge_errors
    assumption_errors: assumption_errors
- id: register
  kind: invoke_tool
  tool: register-candidates
  input_variable: register_input
  output_variable: register
- id: publish
  kind: publish_result
  output: candidate-register
  input_variable: register
  output_name: register
- id: finish
  kind: end_workflow
  output_variable: register
  output_name: result
