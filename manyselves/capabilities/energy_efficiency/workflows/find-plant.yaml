id: find-plant
version: 0.1.0
description: The loss finder looks across every meter after the partitions; the program checks it, sends it back once for correction and settles the result
tasks:
- find-plant
recovery:
- typed-turn-recovery
output_contract: partition-result
state:
  item: null
  partition_key: null
  corrected: {}
  correction_errors: {}
actions:
- id: open
  kind: create_conversation
  agent: loss-finder
  conversation_key: plant
  key_variable: partition_key
  mode: run
  output_variable: conversation
- id: find
  kind: invoke_agent
  agent: loss-finder
  task: find-plant
  conversation_variable: conversation
  input_variable: item
  output_variable: submission
- id: scope
  kind: set_variable
  variable: scope
  value_variable: item
  field: scope
- id: check
  kind: invoke_tool
  tool: check-partition-items
  input_variables:
    scope: scope
    submission: submission
  output_variable: check
- id: passed
  kind: set_variable
  variable: passed
  value_variable: check
  field: ok
- id: route
  kind: if
  condition:
    variable: passed
    operator: eq
    value: true
  then: settle-input
  otherwise: fix-input
- id: fix-input
  kind: set_variable
  variable: fix_input
  value_variables:
    scope: scope
    check: check
    submission: submission
# The correction round runs as its own item so that its failure leaves the
# first submission in place instead of failing the partition.
- id: fix-items
  kind: set_variable
  variable: fix_items
  value_variables:
    correction: fix_input
- id: correct
  kind: map
  items_variable: fix_items
  workflow: correct-plant
  input_variables:
    conversation: conversation
  output_variable: corrected
  errors_variable: correction_errors
- id: settle-input
  kind: set_variable
  variable: settle_input
  value_variables:
    partition_id: partition_key
    first_submission: submission
    first_check: check
    corrected: corrected
    correction_errors: correction_errors
- id: settle
  kind: invoke_tool
  tool: settle-partition-items
  input_variable: settle_input
  output_variable: result
- id: finish
  kind: end_workflow
  output_variable: result
  output_name: result
