id: residual-brief
version: 1.0.0
description: The largest unexplained pieces of excess, the candidates and specs so far, the survey and the grid's axes
adapter: json_schema
schema:
  type: object
  required: [key, run_id, kind, round, slices, candidates, axes]
  properties:
    key: {type: string}
    run_id: {type: string}
    kind: {type: string}
    round: {type: integer}
    residual_open_kwh: {type: number}
    model_explained_kwh: {type: number}
    found_kwh: {type: number}
    slices: {type: array, items: {type: object}}
    candidates: {type: array, items: {type: object}}
    specs_so_far: {type: array, items: {type: object}}
    rounds_so_far: {type: array, items: {type: object}}
    facts: {type: array, items: {type: object}}
    assumptions: {type: array, items: {type: object}}
    task: {type: object}
    focus: {type: string}
    kb: {type: array, items: {type: object}}
    axes: {type: object}
