id: residual-brief
version: 2.0.0
description: The largest excess no item explains, the differences not adopted on those meters, the items and specs so far, the survey, the cause tests and the grid's axes
adapter: json_schema
schema:
  type: object
  required: [key, run_id, kind, round, item_prefix, slices, differences, items_so_far, axes]
  properties:
    key: {type: string}
    run_id: {type: string}
    kind: {type: string}
    round: {type: integer}
    item_prefix: {type: string}
    residual_open_kwh: {type: number}
    model_explained_kwh: {type: number}
    found_kwh: {type: number}
    slices: {type: array, items: {type: object}}
    differences: {type: array, items: {type: object}}
    items_so_far: {type: array, items: {type: object}}
    specs_so_far: {type: array, items: {type: object}}
    rounds_so_far: {type: array, items: {type: object}}
    facts: {type: array, items: {type: object}}
    assumptions: {type: array, items: {type: object}}
    task: {type: object}
    focus: {type: string}
    kb: {type: array, items: {type: object}}
    axes: {type: object}
    roles: {type: object}
    test_types: {type: object}
