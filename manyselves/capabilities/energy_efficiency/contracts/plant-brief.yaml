id: plant-brief
version: 1.0.0
description: Every meter in short, the plant's state axis, the partitions' items and category gaps, the method menu and the 17 categories
adapter: json_schema
schema:
  type: object
  required: [scope, partition_id, label, site, period, meters, meters_text, methods, method_readiness, partition_items, partition_category_gaps, rule_items, categories, input_kinds]
  properties:
    scope: {type: string}
    partition_id: {type: string}
    label: {type: string}
    site: {type: string}
    period:
      type: object
      required: [start, end]
      properties:
        start: {type: string}
        end: {type: string}
    meters: {type: array, items: {type: object}}
    plant_states: {type: [object, "null"]}
    meters_text: {type: string}
    methods: {type: array, items: {type: object}}
    method_readiness: {type: array, items: {type: object}}
    partition_items: {type: array, items: {type: object}}
    partition_category_gaps: {type: array, items: {type: object}}
    rule_items: {type: array, items: {type: object}}
    site_facts: {type: array, items: {type: object}}
    assumptions: {type: array, items: {type: object}}
    categories: {type: array, items: {type: object}}
    input_kinds: {type: object}
    focus: {type: string}
