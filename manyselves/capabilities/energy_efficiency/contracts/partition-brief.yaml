id: partition-brief
version: 1.0.0
description: One partition's meters, data period, profile text, method menu and rule items
adapter: json_schema
schema:
  type: object
  required: [scope, partition_id, label, site, period, meters, available_inputs, methods, rule_items, profile_text]
  properties:
    scope: {type: string}
    partition_id: {type: string}
    label: {type: string}
    site: {type: string}
    period:
      type: object
      required: [start, end]
      properties:
        start: {type: string}
        end: {type: string}
    meters: {type: array, items: {type: object}}
    available_inputs: {type: object}
    methods: {type: array, items: {type: object}}
    rule_items: {type: array, items: {type: object}}
    profile_text: {type: string}
