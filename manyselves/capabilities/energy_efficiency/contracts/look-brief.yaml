id: look-brief
version: 2.0.0
description: One system's meters, all its program differences, the ones that must be accounted for, the triggers to answer, the survey, the knowledge base as reference, the cause tests and the grid's axes
adapter: json_schema
schema:
  type: object
  required: [key, run_id, kind, system, item_prefix, meters, differences, must_answer, triggers, facts, kb, axes]
  properties:
    key: {type: string}
    run_id: {type: string}
    kind: {type: string}
    system: {type: string}
    item_prefix: {type: string}
    meters: {type: array, items: {type: object}}
    lenses: {type: object}
    differences: {type: array, items: {type: object}}
    must_answer: {type: array, items: {type: string}}
    triggers: {type: array, items: {type: object}}
    facts: {type: array, items: {type: object}}
    assumptions: {type: array, items: {type: object}}
    task: {type: object}
    focus: {type: string}
    kb: {type: array, items: {type: object}}
    axes: {type: object}
    roles: {type: object}
    test_types: {type: object}
    preferences: {type: array, items: {type: object}}
