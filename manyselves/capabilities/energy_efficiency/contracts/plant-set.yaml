id: plant-set
version: 1.0.0
description: The one brief of the plant-wide pass, in a list so a failure of the pass leaves the run going
adapter: json_schema
schema:
  type: object
  required: [run_id, briefs]
  properties:
    run_id: {type: string}
    briefs:
      type: array
      items: {type: object, required: [partition_id, scope]}
