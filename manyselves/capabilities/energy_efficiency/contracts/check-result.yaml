id: check-result
version: 1.0.0
description: Problems the program found in a submission against the run's data
adapter: json_schema
schema:
  type: object
  required: [ok, issues]
  properties:
    ok: {type: boolean}
    issues:
      type: array
      items:
        type: object
        required: [key, problem]
        properties:
          key: {type: string}
          problem: {type: string}
    hints:
      description: The program's own failures while checking; shown, never sent back as problems
      type: array
      items:
        type: object
        required: [key, problem]
        properties:
          key: {type: string}
          problem: {type: string}
