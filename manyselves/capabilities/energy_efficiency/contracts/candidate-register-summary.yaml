id: candidate-register-summary
version: 1.0.0
description: The workbook (台账) of one run and the files it was written to
adapter: json_schema
schema:
  type: object
  required: [run_id, counts, files, output_artifacts]
  properties:
    run_id: {type: string}
    site: {type: string}
    period: {type: object}
    counts: {type: object}
    files: {type: array, items: {type: string}}
    output_artifacts:
      type: array
      items:
        type: object
        required: [path]
        properties:
          path: {type: string}
