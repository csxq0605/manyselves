id: phase-a
phases:
  - id: intake
    mode: pipeline
    agents: [manifest-builder, artifact-parser, evidence-normalizer]
  - id: coverage
    mode: pipeline
    agents: [coverage-evaluator, report-planner]
    needs: [intake]
  - id: module
    mode: parallel
    agents: [module-worker]
    needs: [coverage]
  - id: quality
    mode: pipeline
    agents: [evidence-auditor, revision-router, project-delivery]
    needs: [module]
