id: full-power-distribution-report
phases:
  - id: preparation
    mode: pipeline
    agents:
      - manifest-builder
      - intake-parser
      - evidence-normalizer
      - coverage-evaluator

  - id: planning
    mode: pipeline
    agents: [report-planner]
    needs: [preparation]

  - id: module-pipelines
    mode: parallel
    needs: [planning]
    pipelines:
      - id: module-2.1
        agents: [module-2.1-specialist, evidence-auditor]
        revisionAgent: module-2.1-specialist
        maxRevisions: 2
      - id: module-2.2
        agents: [module-2.2-specialist, evidence-auditor]
        revisionAgent: module-2.2-specialist
        maxRevisions: 2
      - id: module-2.3
        agents: [module-2.3-specialist, evidence-auditor]
        revisionAgent: module-2.3-specialist
        maxRevisions: 2
      - id: module-2.4
        agents: [module-2.4-specialist, evidence-auditor]
        revisionAgent: module-2.4-specialist
        maxRevisions: 2
      - id: module-2.5
        agents: [module-2.5-specialist, evidence-auditor]
        revisionAgent: module-2.5-specialist
        maxRevisions: 2

  - id: module-barrier
    mode: barrier
    needs: [module-pipelines]

  - id: cross-module-review
    mode: pipeline
    agents: [cross-module-reviewer]
    needs: [module-barrier]

  - id: editing-and-delivery
    mode: pipeline
    agents: [chief-editor, citation-builder, docx-renderer, project-delivery]
    needs: [cross-module-review]
